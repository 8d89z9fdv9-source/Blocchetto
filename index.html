      controls = ui.confirm === 'qua'
        ? '<span class="ask">Ricominciamo?</span><button class="btn small" type="button" data-act="qua-restart">Sì</button><button class="btn small ghost" type="button" data-act="cancel">No</button>'
        : '<button class="btn ghost small" type="button" data-act="ask-qua">Ricomincia</button>';
    }
    return { board, status, controls };
  }

  function winLine(line, s, key, fresh) {
    const cx = i => 50 + (i % 3) * 100, cy = i => 50 + Math.floor(i / 3) * 100;
    let x1 = cx(line[0]), y1 = cy(line[0]), x2 = cx(line[2]), y2 = cy(line[2]);
    const len = Math.hypot(x2 - x1, y2 - y1), ex = (x2 - x1) / len * 34, ey = (y2 - y1) / len * 34;
    x1 -= ex; y1 -= ey; x2 += ex; y2 += ey;
    return `<svg class="win-line" viewBox="0 0 300 300" aria-hidden="true"><path class="pen${fresh ? ' fresh' : ''}" pathLength="1" style="--c:var(--pen-${s})" d="${penLine(x1, y1, x2, y2, key)}"/></svg>`;
  }

  function viewTris(anim) {
    const t = S.tris, active = G.trisActive(t);
    const turn = active >= 0 ? G.trisTurn(t.boards[active]) : null;
    const playable = active >= 0 && canAct(turn);
    const lastBoard = t.lm >= 0 ? Math.floor(t.lm / 9) : -1;
    let board = '<div class="tgrid">';
    for (let bi = 0; bi < 6; bi++) {
      const b = t.boards[bi];
      if (!b) {
        board += `<div class="tb future" aria-hidden="true"><div class="cells">${'<div class="cell"></div>'.repeat(9)}</div></div>`;
        continue;
      }
      const res = G.trisResult(b.c), isActive = bi === active;
      board += `<div class="tb${isActive ? ' active' : ''}"${isActive ? ' role="group" aria-label="Partita in corso"' : ''}><div class="cells">`;
      for (let i = 0; i < 9; i++) {
        const v = b.c[i];
        if (!v && isActive && playable) board += `<button class="cell" type="button" data-act="tris" data-i="${i}" aria-label="Casella ${i + 1}"></button>`;
        else board += `<div class="cell">${v ? symSVG(v[1], v[0], `c${t.page}-${bi}-${i}`, anim && t.lm === bi * 9 + i) : ''}</div>`;
      }
      board += '</div>';
      if (res && res.win) board += winLine(res.line, res.win, `w${t.page}-${bi}`, anim && lastBoard === bi);
      board += '</div>';
    }
    board += '</div>';

    let status = '';
    const doneIdx = active >= 0 ? active - 1 : t.boards.length - 1;
    const prev = doneIdx >= 0 ? t.boards[doneIdx] : null;
    const prevRes = prev ? G.trisResult(prev.c) : null;
    if (prevRes && (active < 0 || !t.boards[active].c.some(Boolean))) status = prevRes.win ? `Tris di ${inkName(prevRes.win)}! ` : 'Patta! ';
    status += active < 0 ? 'Pagina finita.' : turnLine(turn);

    let controls = '';
    if (active < 0 && canManage()) controls += '<button class="btn" type="button" data-act="page">Volta pagina</button>';
    if (seat) controls += symPicker(seat, 'Il tuo segno');
    return { board, status, controls };
  }

  /* ---------- drawings: ships, splashes, little pictures for the index ---------- */
  function wobble(key) {
    const r = mulberry32(hash(key));
    return () => (r() - 0.5) * 1.6;
  }
  function shipSVG(sh, s, owner, sunk, key) {
    const NV = Game2.NV, L = sh.length;
    const rows = sh.map(i => Math.floor(i / NV)), cols = sh.map(i => i % NV);
    const r0 = Math.min(...rows), c0 = Math.min(...cols), vertical = L > 1 && cols.every(c => c === cols[0]);
    const W = L * s, H = s, j = wobble(key);
    const p = (x, y) => `${f1(x + j())} ${f1(y + j())}`;
    const top = H * 0.36, bot = H * 0.76;
    const hull = `M${p(5, top)} L${p(W - 17, top)} Q${p(W - 6, top + 1)} ${p(W - 3, H * 0.55)} Q${p(W - 8, bot - 1)} ${p(W - 16, bot)} L${p(10, bot)} Q${p(6, H * 0.6)} ${p(5, top)} Z`;
    const bw = L >= 3 ? s * 0.9 : s * 0.62, bx = W * (L >= 4 ? 0.26 : 0.3);
    let deck = `<rect class="cabin" x="${f1(bx)}" y="${f1(H * 0.17)}" width="${f1(bw)}" height="${f1(H * 0.21)}" rx="3"/>`;
    if (L >= 3) deck += `<rect class="cabin" x="${f1(bx + bw * 0.22)}" y="${f1(H * 0.06)}" width="${f1(bw * 0.4)}" height="${f1(H * 0.13)}" rx="2"/>`;
    if (L >= 4) {
      const fx = bx + bw + s * 0.32;
      deck += `<path class="cabin" d="M${f1(fx)} ${f1(top)} L${f1(fx + s * 0.06)} ${f1(H * 0.1)} L${f1(fx + s * 0.34)} ${f1(H * 0.1)} L${f1(fx + s * 0.4)} ${f1(top)} Z"/>`;
    }
    for (let x = 15; x < W - 22; x += 14) deck += `<circle class="port" cx="${x}" cy="${f1(H * 0.56)}" r="2.3"/>`;
    let hatch = '';
    if (sunk) for (let x = 12; x < W - 10; x += 9) hatch += `M${x} ${f1(bot - 1)} L${x + 7} ${f1(top + 1)} `;
    const tf = (vertical ? `translate(${c0 * s + s} ${r0 * s}) rotate(90)` : `translate(${c0 * s} ${r0 * s})`) + (sunk ? ` rotate(${vertical ? -5 : 5} ${f1(W / 2)} ${f1(H / 2)})` : '');
    return `<g class="boat${sunk ? ' sunk' : ''}" transform="${tf}" style="--c:var(--pen-${owner})"><path class="hull" d="${hull}"/>${deck}${hatch ? `<path class="hatch" d="${hatch}"/>` : ''}</g>`;
  }
  function burstPath(cx, cy, r, key) {

  }

  function tarotFront(v) {

  }
  function tcardHTML(v, opts) {
    return `<div class="tcard${opts.down ? ' down' : ''}${opts.flip ? ' flip' : ''}${v & 1 ? ' rev' : ''}" style="--k:${opts.k || 0}"><div class="inner"><div class="face front">${opts.down ? '' : tarotFront(v)}</div><div class="face back"></div></div></div>`;
  }
  const SPREAD_NAMES = { 1: 'Una carta', 3: 'Tre carte', 5: 'La croce' };
  const SPREAD_HINT = { 1: 'La carta della sera', 3: 'Passato, presente, futuro', 5: 'Cinque carte a croce' };
  const CROSS_AREAS = ['left', 'right', 'top', 'bottom', 'center'];
  const slotStyle = (t, k) => (t.spread === 5 ? ` style="grid-area:${CROSS_AREAS[k]}"` : '');
  function spreadHTML(t, down, flip) {
    const labels = Game2.SPREADS[t.spread];
    let h = `<div class="spread s${t.spread}">`;
    t.picked.forEach((pos, k) => {
      const v = t.deck[pos], name = Game2.TAROT[v >> 1][1];
      h += `<div class="tpos"${slotStyle(t, k)}>${tcardHTML(v, { down, flip, k })}<p class="tpos-l">${labels[k]}</p>${down ? '' : `<p class="tpos-n">${esc(name)}${v & 1 ? ' <span>capovolta</span>' : ''}</p>`}</div>`;
    });
    return h + '</div>';
  }
  function slotsHTML(t) {
    const labels = Game2.SPREADS[t.spread];
    let h = `<div class="spread mini s${t.spread}">`;
    labels.forEach((l, k) => {
      h += `<div class="tpos"${slotStyle(t, k)}>${k < t.picked.length ? '<span class="tback mini"></span>' : '<span class="tslot"></span>'}<p class="tpos-l">${l}</p></div>`;
    });

  }
  function tableHTML(t, canPick, deal) {
    let h = '<div class="ttable">';
    t.deck.forEach((v, pos) => {
      const r = mulberry32(hash('tt' + t.n + ':' + pos)), st = `--r:${f1((r() - 0.5) * 14)}deg;--y:${f1((r() - 0.5) * 8)}px;--k:${pos}`;
      const gone = t.picked.includes(pos), cls = `tback${gone ? ' gone' : ''}${deal ? ' deal' : ''}`;
      h += canPick && !gone
        ? `<button class="${cls}" type="button" data-act="taro-pick" data-pos="${pos}" aria-label="Carta coperta ${pos + 1}" style="${st}"></button>`
        : `<span class="${cls}" style="${st}"></span>`;
    });

  }
  function taroHistory(t) {
    if (!t.hist.length) return '';

    for (const e of t.hist) {
      const when = e.at ? new Date(e.at).toLocaleDateString('it-IT', { day: 'numeric', month: 'long' }) : '';
      const cards = e.c.map(v => Game2.TAROT[v >> 1][1] + (v & 1 ? ' (capovolta)' : '')).join(' · ');
      h += `<div class="hentry"><p class="hq">${esc(when)} · ${SPREAD_NAMES[e.sp]} · pescate da ${esc(nameOf(e.d))}</p>` +

        (e.r ? `<p class="ha" style="--c:var(--pen-${G.other(e.d)})">${esc(e.r)}</p>` : '') + '</div>';
    }
    return h + '</details>';
  }
  function shuffledDeck() {
    const rnd = new Uint32Array(44);
    crypto.getRandomValues(rnd);
    const d = Array.from({ length: Game2.TAROT.length }, (_, i) => i);
    for (let i = d.length - 1; i > 0; i--) {
      const j = rnd[i] % (i + 1);
      [d[i], d[j]] = [d[j], d[i]];
    }
    return d.map((k, i) => k * 2 + (rnd[22 + i] % 100 < 30 ? 1 : 0));
  }
  function viewTaro(anim) {
    const t = S.taro, drawer = t.drawer, reader = G.other(drawer);

      status = canAct(drawer)
        ? (t.picked.length ? `Ancora ${left === 1 ? 'una carta' : left + ' carte'}.` : `Scegli ${t.spread === 1 ? 'una carta' : t.spread + ' carte'} dal tavolo.`)
        : `${inkName(drawer)} sta scegliendo le carte…`;
      if (canManage()) controls = restartCtl('taro');

      board = `<div class="card">${q}${spreadHTML(t, true, false)}</div>`;

    } else {

      if (canAct(reader)) {

      }

      else if (canManage()) controls += `<div class="row">${restartCtl('taro')}</div>`;

    return { board: board + taroHistory(t), status, controls };
  }

  /* ---------- new games ---------- */
  function yourMove(g, s) {

    if (Game3.EXTRA.includes(g)) return Game3.yourMove(S, g, s);

  function restartCtl(g) {

  }
  const tallyOf = (a, b) => `<span class="tally" aria-hidden="true"><span style="--c:var(--pen-a)">${esc(initialOf('a'))} ${a}</span><span style="--c:var(--pen-b)">${esc(initialOf('b'))} ${b}</span></span>`;
  const coord = (i, n) => 'ABCDEFGH'[i % n] + (Math.floor(i / n) + 1);

  function viewC4(anim) {
    const q = S.c4, R = Game2.C4R, C = Game2.C4C, res = Game2.c4Result(q.cells);
    const playable = !res && canAct(q.turn);
    const s = 50, W = C * s, H = R * s;
    let hits = '', holes = '', pieces = '';
    if (playable) {
      for (let c = 0; c < C; c++) if (q.cells[c] === '0') hits += `<rect class="col-hit" data-act="c4" data-col="${c}" x="${c * s}" y="-4" width="${s}" height="${H + 8}"/>`;
    }
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        const i = r * C + c, o = q.cells[i], cx = c * s + s / 2, cy = r * s + s / 2;

        }
      }
    }
    let line = '';
    if (res && res.win) {
      const p = i => [(i % C) * s + s / 2, Math.floor(i / C) * s + s / 2];
      const [x1, y1] = p(res.line[0]), [x2, y2] = p(res.line[3]);

  function viewSos(anim) {
    const q = S.sos, N = Game2.SN, over = Game2.sosOver(q), playable = !over && canAct(q.turn);

    let grid = '', hits = '', letters = '', lines = '';
    for (let k = 1; k < N; k++) grid += `M${k * s} 4 V${W - 4} M4 ${k * s} H${W - 4} `;
    for (let i = 0; i < N * N; i++) {
      const ch = q.cells[i], r = Math.floor(i / N), c = i % N, cx = c * s + s / 2, cy = r * s + s / 2;

      else if (playable) hits += `<rect class="cell-hit" data-act="sos" data-i="${i}" x="${c * s}" y="${r * s}" width="${s}" height="${s}"/>`;

    return { board, status, controls };
  }

  function numPad(label, okLabel) {

  function seaSVG(opts) {
    const NV = Game2.NV, s = 40, m = 22, W = NV * s, tag = opts.mine ? 'm' : 't';
    let h = `<svg class="sea${opts.mine ? ' mine' : ''}" viewBox="${-m} ${-m} ${W + m + 4} ${W + m + 4}" role="img" aria-label="${opts.label}">`;
    for (let k = 0; k < NV; k++) h += `<text class="lab" x="${k * s + s / 2}" y="${-m / 2}">${'ABCDEFGH'[k]}</text><text class="lab" x="${-m / 2}" y="${k * s + s / 2}">${k + 1}</text>`;
    if (opts.tap) for (let i = 0; i < NV * NV; i++) if (opts.shots[i] === '0') h += `<rect class="sea-hit" data-act="navi-shot" data-i="${i}" x="${(i % NV) * s}" y="${Math.floor(i / NV) * s}" width="${s}" height="${s}"/>`;
    h += `<rect class="water" x="0" y="0" width="${W}" height="${W}" rx="6"/>`;
    const wr = mulberry32(hash('waves' + tag));
    let waves = '';
    for (let k = 0; k < 14; k++) waves += `M${f1(6 + wr() * (W - 26))} ${f1(8 + wr() * (W - 16))} q3.5 -3.5 7 0 t7 0 `;
    h += `<path class="wave" d="${waves}"/>`;
    let grid = '';
    for (let k = 0; k <= NV; k++) grid += `M${k * s} 0 V${W} M0 ${k * s} H${W} `;
    h += `<path class="print" d="${grid}"/>`;
    (opts.ships || []).forEach((sh, k) => { h += shipSVG(sh, s, opts.owner, !!(opts.sunk && opts.sunk[k]), tag + sh.join('-')); });
    for (let i = 0; i < NV * NV; i++) {
      const v = opts.shots[i];
      if (v === '0') continue;
      const cx = (i % NV) * s + s / 2, cy = Math.floor(i / NV) * s + s / 2, fresh = opts.fresh === i ? ' pop' : '';
      if (v === 'm') h += `<g class="splash${fresh}"><path class="sring" d="${penCircle(cx, cy, 10, 'sp' + tag + i)}"/><circle class="drop" cx="${cx}" cy="${cy}" r="3"/></g>`;
      else h += `<g class="boom${fresh}" style="--c:var(--pen-${opts.shooter})"><path class="burst" d="${burstPath(cx, cy, 15, 'b' + tag + i)}"/><circle class="core" cx="${cx}" cy="${cy}" r="4"/></g>`;
    }
    return h + '</svg>';
  }
  function viewNavi(anim) {
    const q = S.navi, o = other(), NV = Game2.NV;
    const placed = Game2.fleetOf(q, seat);
    if (q.phase === 'setup' && !placed && !ui.naviDraft) ui.naviDraft = Game2.randomFleet(Math.random);
    const myShips = placed || ui.naviDraft || [];
    const enemy = q.phase !== 'setup' ? Game2.fleetOf(q, o) : null;
    const enemySunk = enemy ? Game2.sunkList(enemy, q.shots[seat]) : [];
    const mySunk = Game2.sunkList(myShips, q.shots[o]);
    const freshMine = anim && q.last && q.last.s === seat ? q.last.i : -1;
    const freshTheirs = anim && q.last && q.last.s === o ? q.last.i : -1;
    let board = '<div class="card navig">';
    if (q.phase === 'setup') {
      board += `<p class="sea-h">Il tuo mare</p>${seaSVG({ label: 'Le tue navi', ships: myShips, owner: seat, shots: '0'.repeat(NV * NV), shooter: o })}`;
    } else {
      board += `<p class="sea-h">Il mare di ${esc(nameOf(o))}</p>`;
      board += seaSVG({ label: 'Il mare dove spari', ships: enemy ? enemy.filter((_, k) => enemySunk[k] || q.phase === 'over') : [], sunk: enemy ? enemy.filter((_, k) => enemySunk[k] || q.phase === 'over').map((_, k) => true) : [], owner: o, shots: q.shots[seat], shooter: seat, tap: q.phase === 'play' && canAct(q.turn), fresh: freshMine });
      board += `<p class="sea-h">Il tuo mare</p>${seaSVG({ label: 'Le tue navi', mine: true, ships: myShips, sunk: mySunk, owner: seat, shots: q.shots[o], shooter: o, fresh: freshTheirs })}`;
    }
    board += '</div>';
    const shotText = last => {
      const fleet = last.s === seat ? enemy : myShips;
      const shots = q.shots[last.s];
      if (shots[last.i] !== 'h') return 'acqua';
      const ship = fleet && fleet.find(sh => sh.includes(last.i));
      return ship && ship.every(i => shots[i] === 'h') ? 'colpita e affondata' : 'colpita';
    };
    let status, controls = '';
    if (q.phase === 'setup') {
      if (!placed) {
        status = 'Ecco le tue navi. Rimescola finché ti piacciono, poi premi «Pronto».';
        if (canManage()) controls = '<button class="btn" type="button" data-act="navi-ready">Pronto</button><button class="btn ghost" type="button" data-act="navi-shuffle">Rimescola</button>';
      } else {
        status = `Navi pronte. ${inkName(o)} sta disponendo le sue…`;
        if (canManage()) controls = '<button class="btn ghost small" type="button" data-act="navi-shuffle">Rimescola le mie navi</button>';
      }
    } else if (q.phase === 'play') {
      const pre = q.last ? (q.last.s === seat ? `${coord(q.last.i, NV)}: ${shotText(q.last)}! ` : `${esc(nameOf(o))} ha sparato in ${coord(q.last.i, NV)}: ${shotText(q.last)}. `) : '';
      status = pre + (canAct(q.turn) ? 'Tocca a te: spara nel mare di ' + inkName(o) + '.' : turnLine(q.turn));
      if (canManage()) controls = restartCtl('navi');
    } else {
      status = q.win === seat ? `Hai affondato tutta la flotta di ${inkName(o)}!` : `${inkName(q.win)} ha affondato tutta la tua flotta.`;
      if (canManage()) controls = '<button class="btn" type="button" data-act="new" data-g="navi">Nuova partita</button>';
    }
    return { board, status, controls };
  }

  function viewDom() {
    const d = S.dom, o = other(), q = Game2.QUESTIONS[d.q];
    const mine = Game2.show(d.ans[seat]), theirs = Game2.show(d.ans[o]);
    const both = !!(d.ans.a && d.ans.b);
    let board = `<div class="card domc"><p class="dom-q">${esc(q)}</p>`;
    if (both) {
      board += `<div class="dom-ans"><div class="ans" style="--c:var(--pen-${seat})"><span class="who">${esc(nameOf(seat))}</span><p>${esc(mine)}</p></div><div class="ans" style="--c:var(--pen-${o})"><span class="who">${esc(nameOf(o))}</span><p>${esc(theirs)}</p></div></div>`;
    } else if (d.ans[seat]) {
      board += `<div class="dom-ans"><div class="ans" style="--c:var(--pen-${seat})"><span class="who">La tua risposta</span><p>${esc(mine)}</p></div></div>`;
    }
    if (d.hist.length) {
      board += '<details class="dom-hist"><summary>Le domande delle altre sere</summary>';
      d.hist.slice(0, 5).forEach(h => {
        const [ha, hb] = [Game2.show(h[1]), Game2.show(h[2])];
        board += `<p class="hq">${esc(Game2.QUESTIONS[h[0]])}</p><p class="ha" style="--c:var(--pen-a)">${esc(nameOf('a'))}: ${esc(ha)}</p><p class="ha" style="--c:var(--pen-b)">${esc(nameOf('b'))}: ${esc(hb)}</p>`;
      });
      board += '</details>';
    }
    board += '</div>';
    let status, controls = '';
    if (both) {
      status = 'Ecco le vostre risposte.';
      if (canManage()) controls = '<button class="btn" type="button" data-act="dom-next">Un’altra domanda</button>';
    } else if (d.ans[seat]) {
      status = `Aspettiamo la risposta di ${inkName(o)}.`;
      if (canManage()) controls = ui.confirm === 'restart-dom' ? restartCtl('dom') : '<button class="btn ghost small" type="button" data-act="ask-restart" data-g="dom">Cambia domanda</button>';
    } else {
      status = d.ans[o] ? `${inkName(o)} ha già risposto. Le risposte si vedono quando rispondi anche tu.` : 'Scrivi la tua risposta: la vedrete insieme quando avete risposto tutti e due.';
      if (canManage()) {
        controls = `<form id="dom-form" class="form dom-form" autocomplete="off" novalidate><label class="lbl" for="dom-text">La tua risposta</label><textarea class="line-input" id="dom-text" name="text" rows="3" maxlength="280" enterkeyhint="send"></textarea><p id="dom-err" class="err" role="alert"></p><div class="row"><button class="btn" type="submit">Invia</button>${d.ans[o] ? '' : '<button class="btn ghost" type="button" data-act="dom-skip">Cambia domanda</button>'}</div></form>`;
        if (d.ans[o]) controls += `<div class="row">${ui.confirm === 'restart-dom' ? restartCtl('dom') : '<button class="btn ghost small" type="button" data-act="ask-restart" data-g="dom">Cambia domanda</button>'}</div>`;
      }
    }
    return { board, status, controls };
  }

  /* ---------- third batch: shared bits ---------- */
  function cryptoShuffle(arr) {
    const a = arr.slice(), r = new Uint32Array(a.length);
    crypto.getRandomValues(r);
    for (let i = a.length - 1; i > 0; i--) {
      const j = r[i] % (i + 1);

  }
  const pickSome = (arr, k) => cryptoShuffle(arr).slice(0, k);
  const pointsLine = (pa, pb) => `<div class="pts2"><span style="--c:var(--pen-a)">${esc(nameOf('a'))} <b>${pa}</b></span><span style="--c:var(--pen-b)">${esc(nameOf('b'))} <b>${pb}</b></span></div>`;

  /* ---------- briscola: Neapolitan cards in felt-tip ---------- */
  const SUIT_CLS = ['tr', 'ty', 'tb', 'tg'];
  const RLAB = ['A', '2', '3', '4', '5', '6', '7', 'F', 'C', 'R'];
  function suitGlyph(su, x, y, s) {
    const P = (dx, dy) => `${f1(x + dx * s)} ${f1(y + dy * s)}`;
    switch (su) {
      case 0: // coppe: a goblet
        return `<path class="tr" d="M${P(-1, -0.75)} L${P(1, -0.75)} Q${P(0.95, 0.2)} ${P(0, 0.3)} Q${P(-0.95, 0.2)} ${P(-1, -0.75)} Z"/><path class="ti" d="M${P(0, 0.3)} L${P(0, 0.85)} M${P(-0.5, 0.9)} L${P(0.5, 0.9)}"/>`;
      case 1: // denari: a coin
        return `<circle class="ty" cx="${f1(x)}" cy="${f1(y)}" r="${f1(s)}"/><circle class="ti" cx="${f1(x)}" cy="${f1(y)}" r="${f1(s * 0.48)}"/>`;
      case 2: // spade: a sword
        return `<path class="tb" d="M${P(0, -1.05)} L${P(0.24, -0.72)} L${P(0.24, 0.4)} L${P(-0.24, 0.4)} L${P(-0.24, -0.72)} Z"/><path class="ti" d="M${P(-0.62, 0.45)} L${P(0.62, 0.45)} M${P(0, 0.45)} L${P(0, 1)}"/>`;
      default: // bastoni: a knobbly wooden club, a little tilted
        return `<g transform="rotate(16 ${f1(x)} ${f1(y)})"><path class="tg" d="M${P(-0.2, 1.02)} L${P(0.2, 1.02)} L${P(0.42, -0.62)} Q${P(0.44, -1.06)} ${P(0, -1.06)} Q${P(-0.44, -1.06)} ${P(-0.42, -0.62)} Z"/><path class="ti" d="M${P(0.32, -0.25)} L${P(0.52, -0.33)} M${P(-0.27, 0.15)} L${P(-0.47, 0.08)} M${P(0.24, 0.5)} L${P(0.42, 0.46)} M${P(-0.05, -0.62)} Q${P(0.05, -0.45)} ${P(-0.02, -0.3)}"/></g>`;
    }
  }
  const PIPS = [
    [[30, 49, 14]],
    [[30, 31, 9], [30, 67, 9]],
    [[30, 27, 8], [30, 49, 8], [30, 71, 8]],
    [[19, 33, 7.5], [41, 33, 7.5], [19, 65, 7.5], [41, 65, 7.5]],
    [[19, 30, 7], [41, 30, 7], [30, 49, 7], [19, 68, 7], [41, 68, 7]],
    [[19, 29, 6.5], [41, 29, 6.5], [19, 49, 6.5], [41, 49, 6.5], [19, 69, 6.5], [41, 69, 6.5]],
    [[19, 27, 6], [41, 27, 6], [30, 38, 6], [19, 51, 6], [41, 51, 6], [19, 71, 6], [41, 71, 6]],
  ];
  function briFigure(r, su) {
    if (r === 7) { // fante: a page boy with a cap
      return `<path class="${SUIT_CLS[su]}" d="M21 76 L24 49 Q30 44 36 49 L39 76 Z"/><circle class="tp" cx="30" cy="38" r="7"/><path class="ti" d="M22.5 35 Q30 25 37.5 35 Z M26 76 L26 83 M34 76 L34 83"/>${suitGlyph(su, 45, 60, 5)}`;
    }
    if (r === 8) { // cavallo: a horse head
      return `<path class="tp" d="M20 80 L23 58 Q20 45 29 35 L31 25 L37 32 Q48 35 50 49 L45 54 L38 49 L36 62 L41 80 Z"/><circle class="tk" cx="36" cy="40" r="1.7"/><path class="ti" d="M29 35 Q24 46 26 57"/>${suitGlyph(su, 15, 70, 5)}`;
    }
    // re: crown, face, robe
    return `<path class="ty" d="M21 33 L21 22 L25.5 27.5 L30 20 L34.5 27.5 L39 22 L39 33 Z"/><circle class="tp" cx="30" cy="41" r="7.5"/><path class="tp" d="M18 82 L22 56 Q30 50 38 56 L42 82 Z"/>${suitGlyph(su, 30, 68, 6.5)}`;
  }
  function briFace(c) {
    const su = Game3.suitOf(c), r = Game3.rankOf(c);
    const mid = r >= 7 ? briFigure(r, su) : PIPS[r].map(([x, y, s]) => suitGlyph(su, x, y, s)).join('');
    return `<svg viewBox="0 0 60 96" aria-hidden="true" focusable="false"><rect class="tframe" x="1.5" y="1.5" width="57" height="93" rx="6"/><text class="blab s${su}" x="8.5" y="11">${RLAB[r]}</text><text class="blab s${su}" x="51.5" y="85" transform="rotate(180 51.5 85)">${RLAB[r]}</text>${mid}</svg>`;
  }
  const briName = c => `${Game3.RANKS[Game3.rankOf(c)]} di ${Game3.SUITS[Game3.suitOf(c)]}`;
  const sortHand = h => h.slice().sort((x, y) => Game3.suitOf(x) - Game3.suitOf(y) || Game3.POWER[Game3.rankOf(y)] - Game3.POWER[Game3.rankOf(x)]);

  function viewBri(anim) {
    const q = S.bri, o = other();
    if (q.phase === 'idle') {
      const board = `<div class="card bri-idle"><div class="bri-fan">${[0, 1, 2].map(k => `<span class="bback" style="--k:${k}"></span>`).join('')}</div><p class="bri-note">Comincia ${q.first === seat ? 'tu' : inkName(q.first)}.</p></div>`;
      return { board, status: 'Si mescola e si danno tre carte a testa.', controls: canManage() ? '<button class="btn" type="button" data-act="bri-deal">Dai le carte</button>' : '' };
    }
    const bs = Game3.suitOf(q.brisc);
    const mine = sortHand(Game3.handOf(q, seat)), theirs = Game3.handOf(q, o).length;
    const myTurn = q.phase === 'play' && canAct(q.turn);
    const inCls = s => (anim ? (s === seat ? ' in-me' : ' in-op') : '');
    let h = '<div class="card bri">';
    h += `<div class="bri-opp"><span class="bri-who" style="--c:var(--pen-${o})">${esc(nameOf(o))}</span><span class="bri-ohand" aria-label="${theirs} carte">${Array.from({ length: theirs }, (_, k) => `<span class="bback sm" style="--k:${k}"></span>`).join('')}</span></div>`;
    h += '<div class="bri-mid"><div class="bri-stock">';

    } else if (q.last) {

      h += `<span class="bslot"><span class="bcard on done" style="--c:var(--pen-${s1})" aria-label="${esc(nameOf(s1))}: ${briName(c1)}">${briFace(c1)}</span></span>`;
      h += `<span class="bslot"><span class="bcard on done${inCls(s2)}" style="--c:var(--pen-${s2})" aria-label="${esc(nameOf(s2))}: ${briName(c2)}">${briFace(c2)}</span></span>`;
      h += `<p class="bri-took" style="--c:var(--pen-${q.last.w})">${q.last.w === seat ? 'Prendi tu' : 'Prende ' + esc(nameOf(q.last.w))}${gain ? ` · ${gain} punt${gain === 1 ? 'o' : 'i'}` : ''}</p>`;
    } else {
      h += '<span class="bslot empty"></span><span class="bslot empty"></span>';
    }
    h += '</div></div>';
    if (q.phase === 'over') h += pointsLine(q.pts.a, q.pts.b);
    h += `<div class="bri-hand${myTurn ? ' live' : ''}">${mine.map(c => `<button class="bcard hand" type="button" data-act="bri" data-c="${c}"${myTurn ? '' : ' disabled'} aria-label="${briName(c)}">${briFace(c)}</button>`).join('')}</div>`;
    h += '</div>';
    let status, controls = '';
    if (q.phase === 'over') {
      const w = q.pts.a === q.pts.b ? '' : q.pts.a > q.pts.b ? 'a' : 'b';
      status = !w ? 'Pari: sessanta a testa.' : w === seat ? `Hai vinto ${q.pts[w]} a ${q.pts[other()]}!` : `Ha vinto ${inkName(w)}, ${q.pts[w]} a ${q.pts[G.other(w)]}.`;
      if (canManage()) controls = '<button class="btn" type="button" data-act="bri-deal">Un’altra partita</button>';
    } else {
      if (myTurn) status = q.table.length ? 'Tocca a te: rispondi.' : 'Tocca a te: gioca una carta.';
      else status = turnLine(q.turn);
      if (!q.left && q.phase === 'play') status += ' Il mazzo è finito.';
      if (canManage()) controls = restartCtl('bri');
    }
    return { board: h, status, controls };
  }

  /* ---------- memory ---------- */
  const MEM_ART = [

    () => '<path class="tb" d="M16 50 Q40 24 66 50 Q40 76 16 50 Z"/><path class="tb" d="M64 50 L86 33 L81 50 L86 67 Z"/><circle class="tk" cx="31" cy="46" r="3.4"/><path class="ti" d="M46 39 Q53 50 46 61"/>',
    () => '<path class="ty" d="M25 45 L27 19 L42 32 Q50 30 58 32 L73 19 L75 45 Q80 73 50 78 Q20 73 25 45 Z"/><circle class="tk" cx="40" cy="50" r="3.2"/><circle class="tk" cx="60" cy="50" r="3.2"/><path class="ti" d="M46 59 L54 59 L50 64 Z M50 64 L50 68 M20 58 L37 61 M20 67 L37 65 M80 58 L63 61 M80 67 L63 65"/>',
    () => '<path class="tp" d="M27 48 L27 81 L73 81 L73 48"/><path class="tr" d="M17 51 L50 21 L83 51 Z"/><path class="tb" d="M43 81 L43 62 L57 62 L57 81"/><rect class="ty" x="61" y="56" width="8" height="8" rx="1"/>',
    () => '<path class="tp" d="M40 53 L37 81 L63 81 L60 53 Z"/><path class="tr" d="M15 56 Q17 20 50 20 Q83 20 85 56 Z"/><circle class="tp" cx="35" cy="39" r="5.5"/><circle class="tp" cx="58" cy="31" r="4.5"/><circle class="tp" cx="68" cy="46" r="4.5"/>',
  ];
  const MEM_NAMES = ['cuore', 'stella', 'luna', 'sole', 'fiore', 'nuvola', 'pesce', 'gatto', 'casetta', 'fungo'];
  const memLayout = () => cryptoShuffle('00112233445566778899'.split('')).join('');
  function memUp(q) {
    const up = new Set(q.open.concat(q.miss));
    for (let i = 0; i < Game3.MEM_N; i++) if (q.found[i] !== '0') up.add(i);
    return up;
  }
  function viewMem(anim) {
    const q = S.mem, o = other(), lay = Game3.layOf(q), over = Game3.memOver(q);
    const sig = JSON.stringify([q.n, q.open, q.miss, q.found]);
    if (!ui.mem || ui.mem.sig !== sig) {
      const same = ui.mem && ui.mem.n === q.n;
      ui.mem = { sig, n: q.n, prev: same ? ui.mem.cur : new Set(), cur: memUp(q), prevFound: same ? ui.mem.found : q.found, found: q.found };
    }
    const { prev, cur, prevFound } = ui.mem;
    const playable = !over && canAct(q.turn);
    let h = `<div class="card memc"><div class="mem-top">${pointsLine(q.pts.a, q.pts.b)}</div><div class="mgrid">`;
    for (let i = 0; i < Game3.MEM_N; i++) {
      const up = cur.has(i), was = prev.has(i), by = q.found[i];
      const sym = lay ? Number(lay[i]) : -1;
      let cls = up ? ' up' : '';
      if (anim && up && !was) cls += ' flip';
      if (anim && !up && was) cls += ' unflip';
      if (by !== '0') cls += ' got';
      if (anim && q.miss.includes(i)) cls += ' nope';
      if (anim && by !== '0' && prevFound[i] === '0') cls += ' yay';
      const showFace = sym >= 0 && (up || (anim && was));
      const face = showFace ? `<svg viewBox="9 9 82 82" aria-hidden="true" focusable="false">${MEM_ART[sym]()}</svg>` : '';
      const can = playable && !up;
      const label = up && sym >= 0 ? MEM_NAMES[sym] : 'carta coperta';
      h += `<button class="mcard${cls}" type="button" data-act="mem" data-i="${i}"${by !== '0' ? ` style="--c:var(--pen-${by})"` : ''}${can ? '' : ' disabled'} aria-label="${label}"><span class="inner"><span class="face front">${face}</span><span class="face back"></span></span></button>`;
    }
    h += '</div></div>';
    let status, controls = '';
    if (over) {
      const w = q.pts.a === q.pts.b ? '' : q.pts.a > q.pts.b ? 'a' : 'b';
      status = !w ? `Pari, ${q.pts.a} coppie a testa.` : w === seat ? `Hai trovato più coppie tu: ${q.pts[w]} a ${q.pts[o]}!` : `Ha trovato più coppie ${inkName(w)}: ${q.pts[w]} a ${q.pts[G.other(w)]}.`;
      if (canManage()) controls = '<button class="btn" type="button" data-act="new" data-g="mem">Nuova partita</button>';
    } else {
      if (!lay) status = q.turn === seat ? 'Comincia tu: gira due carte.' : `Comincia ${inkName(q.turn)}.`;
      else if (q.open.length === 1) status = q.turn === seat ? 'Ora girane un’altra.' : `${inkName(q.turn)} ha girato una carta…`;
      else if (q.miss.length) status = q.turn === seat ? `${esc(nameOf(o))} non ha trovato la coppia. Tocca a te.` : `Niente coppia. Tocca a ${inkName(q.turn)}.`;
      else if (prevFound.replace(/0/g, '').length < q.found.replace(/0/g, '').length) status = q.turn === seat ? 'Coppia! Tocca ancora a te.' : `Coppia per ${inkName(q.turn)}, che gioca ancora.`;
      else status = turnLine(q.turn);
      if (canManage() && lay) controls = restartCtl('mem');
    }
    return { board: h, status, controls };
  }

  /* ---------- disegna e indovina ---------- */
  const DIS_W = [7, 14, 30];
  const DIS_INK_NAMES = ['Nero', 'Rosso', 'Blu', 'Verde', 'Giallo', 'Gomma'];
  const enc2 = n => Math.max(0, Math.min(999, Math.round(n))).toString(36).padStart(2, '0');
  function decodePts(p) {
    const out = [];
    for (let k = 0; k + 3 < p.length; k += 4) out.push([parseInt(p.slice(k, k + 2), 36), parseInt(p.slice(k + 2, k + 4), 36)]);
    return out;
  }
  function smoothPath(pts) {
    if (!pts.length) return '';
    const [x0, y0] = pts[0];
    if (pts.length === 1) return `M${x0} ${y0} L${x0 + 0.1} ${y0}`;
    let d = `M${x0} ${y0}`;
    for (let k = 1; k < pts.length - 1; k++) {
      const [x1, y1] = pts[k], [x2, y2] = pts[k + 1];
      d += ` Q${x1} ${y1} ${f1((x1 + x2) / 2)} ${f1((y1 + y2) / 2)}`;
    }
    const [xl, yl] = pts[pts.length - 1];
    return d + ` L${xl} ${yl}`;
  }
  const strokeSVG = ([c, w, p]) => `<path class="dstroke ink${c}" stroke-width="${DIS_W[w]}" d="${smoothPath(decodePts(p))}"/>`;
  const sheetHTML = (q, can) => `<div class="dsheet-wrap"><svg class="dsheet${can ? ' can' : ''}" id="dis-sheet" viewBox="0 0 1000 1000" role="img" aria-label="Il disegno"><rect class="dpaper" width="1000" height="1000"/><g id="dis-strokes">${q.strokes.map(strokeSVG).join('')}</g><path id="dis-live" class="dstroke"/></svg></div>`;
  function disOptions() {
    const q = S.dis;
    if (!ui.disOpts || ui.disOptsN !== q.n) { ui.disOptsN = q.n; ui.disOpts = pickSome(Game3.WORDS, 3); }
    return ui.disOpts;
  }
  function guessList(q) {
    if (!q.guesses.length) return '';
    return `<ul class="dis-guesses">${q.guesses.slice().reverse().map(([t, ok]) => `<li class="${ok ? 'ok' : ''}">${esc(t)}</li>`).join('')}</ul>`;
  }
  function viewDis() {
    const q = S.dis, o = other(), drawer = q.drawer, guesser = G.other(drawer), word = q.word ? Game2.show(q.word) : '';
    let board, status, controls = '';
    if (q.phase === 'choose') {
      if (drawer === seat) {
        board = `<div class="card dis-choose"><p class="dis-lead">Cosa disegni?</p><div class="dis-opts">${disOptions().map(w => `<button class="dis-opt" type="button" data-act="dis-word" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>` +
          '<button class="btn ghost small" type="button" data-act="dis-reroll">Altre parole</button>' +
          '<form id="dis-own" class="form dis-own" autocomplete="off" novalidate><label class="lbl" for="dis-own-w">Oppure scrivila tu</label><input class="line-input" id="dis-own-w" name="w" type="text" maxlength="24" enterkeyhint="go" autocapitalize="off"><p id="dis-own-err" class="err" role="alert"></p><div class="row"><button class="btn small" type="submit">Disegno questa</button></div></form></div>';
        status = `Scegli una parola: ${inkName(o)} dovrà indovinarla.`;
      } else {
        board = `<div class="card dis-wait"><svg viewBox="0 0 120 70" aria-hidden="true"><path class="ti" d="M12 54 Q30 30 48 50 T84 46"/><path class="tp" d="M84 46 L104 14 L111 18 L91 50 L82 53 Z"/><path class="ty" d="M104 14 L111 18 L114 13 L107 9 Z"/></svg></div>`;
        status = `${inkName(drawer)} sta scegliendo cosa disegnare…`;
        if (canManage()) controls = '<button class="btn ghost small" type="button" data-act="dis-take">Disegno io</button>';
      }
      return { board, status, controls };
    }
    if (q.phase === 'draw') {
      if (drawer === seat) {
        const tools = `<div class="dtools"><div class="inks" role="group" aria-label="Colore">${DIS_INK_NAMES.map((n, k) => `<button class="inkbtn ink${k}" type="button" data-act="dis-ink" data-k="${k}" aria-pressed="${ui.disInk === k}" aria-label="${n}"></button>`).join('')}</div>` +
          `<div class="sizes" role="group" aria-label="Spessore">${DIS_W.map((w, k) => `<button class="sizebtn" type="button" data-act="dis-size" data-k="${k}" aria-pressed="${ui.disSize === k}" aria-label="Tratto ${['sottile', 'medio', 'grosso'][k]}"><i style="--w:${4 + k * 5}px"></i></button>`).join('')}</div>` +
          `<div class="row"><button class="btn small ghost" type="button" data-act="dis-undo"${q.strokes.length ? '' : ' disabled'}>Annulla</button><button class="btn small ghost" type="button" data-act="dis-clear"${q.strokes.length ? '' : ' disabled'}>Cancella tutto</button></div></div>`;
        board = `<div class="card disc"><p class="dis-word">Disegna: <b>${esc(word)}</b></p>${sheetHTML(q, canAct(drawer))}${tools}${q.guesses.length ? `<p class="dis-gl">Ha provato con:</p>${guessList(q)}` : ''}</div>`;
        status = q.guesses.length ? `${inkName(o)} ci sta provando, continua!` : `Disegna col dito. ${inkName(o)} prova a indovinare.`;
        if (canManage()) controls = ui.confirm === 'restart-dis' ? restartCtl('dis') : '<button class="btn ghost small" type="button" data-act="ask-restart" data-g="dis">Cambia parola</button>';
      } else {
        board = `<div class="card disc">${sheetHTML(q, false)}${guessList(q)}</div>`;
        status = q.strokes.length ? `Cosa sta disegnando ${inkName(drawer)}?` : `${inkName(drawer)} sta per disegnare…`;
        if (canManage()) {
          controls = '<form id="dis-form" class="form dis-form" autocomplete="off" novalidate><label class="lbl" for="dis-g">Secondo te cos’è?</label><input class="line-input" id="dis-g" name="g" type="text" maxlength="40" enterkeyhint="send" autocapitalize="off"><p id="dis-err" class="err" role="alert"></p>' +
            '<div class="row"><button class="btn" type="submit">Prova</button><button class="btn ghost" type="button" data-act="dis-give">Mi arrendo</button></div></form>';
        }
      }
      return { board, status, controls };
    }
    const tries = q.guesses.length;
    board = `<div class="card disc"><p class="dis-word">Era: <b>${esc(word)}</b></p>${sheetHTML(q, false)}${guessList(q)}</div>`;
    if (q.win === 'y') status = guesser === seat ? `Indovinato${tries === 1 ? ' al primo colpo' : ''}! Un punto per te.` : `${inkName(guesser)} ha indovinato${tries === 1 ? ' al primo colpo' : ''}!`;
    else status = guesser === seat ? `Niente da fare: era «${esc(word)}».` : `${inkName(guesser)} non l’ha indovinata: era «${esc(word)}».`;
    if (canManage()) controls = `<button class="btn" type="button" data-act="dis-next">${guesser === seat ? 'Adesso disegno io' : `Adesso disegna ${esc(nameOf(guesser))}`}</button>`;
    return { board, status, controls };
  }

  // Finger drawing: the stroke is drawn live on this phone and sent as one move when the finger lifts.
  let dLive = null;
  function disPoint(e, svg) {
    const r = svg.getBoundingClientRect();
    return [Math.round(Math.max(0, Math.min(999, (e.clientX - r.left) / r.width * 1000))), Math.round(Math.max(0, Math.min(999, (e.clientY - r.top) / r.height * 1000)))];
  }
  function sendStroke(pts) {
    if (!pts.length) return true;
    const p = pts.map(([x, y]) => enc2(x) + enc2(y)).join('');
    const okk = act({ t: 'dis.stroke', seat, c: ui.disInk, w: ui.disSize, p });
    if (!okk) toast('Il foglio è pieno: annulla qualcosa o cancella tutto.');
    return okk;
  }
  function addPt(p) {
    const L = dLive.pts[dLive.pts.length - 1];
    if (L && Math.hypot(p[0] - L[0], p[1] - L[1]) < 7) return;
    dLive.pts.push(p);
    if (dLive.pts.length >= 600) {
      const done = dLive.pts;
      if (sendStroke(done)) dLive.g.insertAdjacentHTML('beforeend', strokeSVG([ui.disInk, ui.disSize, done.map(([x, y]) => enc2(x) + enc2(y)).join('')]));
      dLive.pts = [done[done.length - 1]];
    }
    dLive.path.setAttribute('d', smoothPath(dLive.pts));
  }
  document.addEventListener('pointerdown', e => {
    const svg = e.target.closest && e.target.closest('#dis-sheet.can');
    if (!svg || dLive || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault();
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* older Safari */ }
    ui.disLive = true;
    dLive = { id: e.pointerId, svg, pts: [], path: svg.querySelector('#dis-live'), g: svg.querySelector('#dis-strokes') };
    dLive.path.setAttribute('class', `dstroke ink${ui.disInk}`);
    dLive.path.setAttribute('stroke-width', DIS_W[ui.disSize]);
    addPt(disPoint(e, svg));
  });
  document.addEventListener('pointermove', e => {
    if (!dLive || e.pointerId !== dLive.id) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    for (const ev of evs.length ? evs : [e]) addPt(disPoint(ev, dLive.svg));
  }, { passive: false });
  function endStroke(e) {
    if (!dLive || (e && e.pointerId !== dLive.id)) return;

    dLive = null;

  }
  document.addEventListener('pointerup', endStroke);
  document.addEventListener('pointercancel', endStroke);
  document.addEventListener('touchmove', e => { if (dLive) e.preventDefault(); }, { passive: false });

  /* ---------- nomi cose città ---------- */
  const nccDraftKey = () => `blocchetto.ncc.${code}.${seat}.${S.ncc.n}`;
  function nccDraft() {
    try { const v = JSON.parse(store.get(nccDraftKey()) || 'null'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }
  function nccLetter() {
    const q = S.ncc, all = Game3.LETTERS.split('');
    const free = all.filter(ch => !q.used.includes(ch));
    return pickSome(free.length ? free : all, 1)[0];
  }
  function nccHistory(q) {
    if (!q.hist.length) return '';

  }
  function viewNcc(anim) {
    const q = S.ncc, o = other();
    let board, status, controls = '';
    if (q.phase === 'idle') {
      board = `<div class="card ncc"><div class="ncc-letter idle">?</div><p class="ncc-cats">${Game3.CATS.join(' · ')}</p>${nccHistory(q)}</div>`;

      return { board, status, controls };
    }
    const letter = `<div class="ncc-letter${anim && q.phase === 'play' && !q.ans.a && !q.ans.b ? ' pop' : ''}">${q.letter}</div>`;
    if (q.phase === 'play') {
      if (!q.ans[seat]) {
        board = `<div class="card ncc">${letter}${q.stop === o ? `<p class="ncc-stop" style="--c:var(--pen-${o})">${esc(nameOf(o))} ha detto stop!</p>` : ''}` +
          '<form id="ncc-form" class="ncc-form" autocomplete="off" novalidate>' +
          Game3.CATS.map((c, k) => `<label class="ncc-row"><span>${c}</span><input class="line-input" id="ncc-w${k}" name="w${k}" type="text" maxlength="30" autocapitalize="words" enterkeyhint="${k < Game3.CATS.length - 1 ? 'next' : 'done'}"></label>`).join('') +
          `<button class="btn stop" type="submit">${q.stop ? 'Manda' : 'Stop!'}</button></form></div>`;
        status = q.stop === o ? 'Scrivi quello che hai e manda.' : `Tutte parole con la ${q.letter}. Chi finisce prima dice stop.`;
      } else {
        const mine = Game3.nccWords(q, seat);
        board = `<div class="card ncc">${letter}<div class="ncc-mine" style="--c:var(--pen-${seat})">${Game3.CATS.map((c, k) => `<p><span>${c}</span><b>${esc(mine[k]) || '—'}</b></p>`).join('')}</div></div>`;
        status = `Hai detto stop! Aspettiamo le parole di ${inkName(o)}.`;
        if (q.stop !== seat) status = `Parole mandate. Aspettiamo ${inkName(o)}.`;
      }
      if (canManage()) controls = restartCtl('ncc');
      return { board, status, controls };
    }
    const W = { a: Game3.nccWords(q, 'a'), b: Game3.nccWords(q, 'b') };
    const P = Game3.nccPoints(q.letter, W.a, W.b, q.veto);
    const cols = [seat, o];
    let t = `<div class="ncc-table"><div class="nrow head"><span></span>${cols.map(s => `<span style="--c:var(--pen-${s})">${s === seat ? 'Tu' : esc(nameOf(s))}</span>`).join('')}</div>`;
    Game3.CATS.forEach((c, k) => {
      t += `<div class="nrow"><span class="ncat">${c}</span>`;

        const w = W[s][k], vetoed = q.veto[(s === 'a' ? 0 : Game3.CATS.length) + k] === '1', valid = Game3.nccValid(q.letter, w);
        const pts = P[s][k];
        t += `<span class="nw${!valid || vetoed ? ' no' : ''}" style="--c:var(--pen-${s})"><b>${esc(w) || '—'}</b><i class="np">${pts}</i>`;
        if (valid && canManage()) t += `<button class="veto" type="button" data-act="ncc-veto" data-who="${s}" data-k="${k}" aria-pressed="${vetoed}">${vetoed ? 'vale' : 'non vale'}</button>`;
        t += '</span>';
      }
      t += '</div>';
    });
    t += `<div class="nrow tot"><span class="ncat">Totale</span>${cols.map(s => `<span style="--c:var(--pen-${s})">${s === 'a' ? P.ta : P.tb}</span>`).join('')}</div></div>`;

    if (canManage()) controls = `<button class="btn" type="button" data-act="ncc-done">Segna i punti</button><div class="row">${restartCtl('ncc')}</div>`;
    return { board, status, controls };
  }

  /* ---------- chi mi conosce meglio ---------- */
  function pickPair() {
    const q = S.chi, used = new Set([q.q].concat(q.hist.map(h => h[0])));
    const all = Game3.PAIRS.map((_, i) => i);
    const free = all.filter(i => !used.has(i));
    return pickSome(free.length ? free : all.filter(i => i !== q.q), 1)[0];
  }
  function chiOpt(k, who) {
    const pair = Game3.PAIRS[S.chi.q], cur = who === 'me' ? ui.chiMe : ui.chiYou;
    return `<button class="chi-opt" type="button" data-act="chi-pick" data-who="${who}" data-k="${k}" aria-pressed="${cur === k}" style="--c:var(--pen-${seat})">${esc(pair[k])}</button>`;
  }
  function viewChi() {
    const q = S.chi, o = other(), pair = Game3.PAIRS[q.q];
    if (ui.chiN !== `${q.n}.${q.k}`) { ui.chiN = `${q.n}.${q.k}`; ui.chiMe = -1; ui.chiYou = -1; }
    const both = !!(q.ans.a && q.ans.b);
    let h = `<div class="card chi"><div class="chi-top"><span class="chi-k">Domanda ${q.k} di ${Game3.ROUNDS}</span>${pointsLine(q.pts.a, q.pts.b)}</div><p class="chi-q">${esc(pair[0])} <span>o</span> ${esc(pair[1])}?</p>`;
    let status, controls = '';
    if (!q.ans[seat] && q.phase === 'play') {
      h += `<p class="chi-lbl">Tu cosa preferisci?</p><div class="chi-opts">${chiOpt(0, 'me')}${chiOpt(1, 'me')}</div>`;
      h += `<p class="chi-lbl">E secondo te ${esc(nameOf(o))}?</p><div class="chi-opts">${chiOpt(0, 'you')}${chiOpt(1, 'you')}</div>`;
      status = q.ans[o] ? `${inkName(o)} ha già risposto. Tocca a te.` : `Rispondi per te e prova a indovinare cosa sceglie ${inkName(o)}.`;
      if (canManage()) controls = `<button class="btn" type="button" data-act="chi-send"${ui.chiMe >= 0 && ui.chiYou >= 0 ? '' : ' disabled'}>Invia</button>`;
    } else if (!both) {
      const A = Game2.show(q.ans[seat]);
      h += `<div class="chi-mine" style="--c:var(--pen-${seat})"><p>Tu: <b>${esc(pair[Number(A[0])])}</b></p><p>Per ${esc(nameOf(o))} hai detto: <b>${esc(pair[Number(A[1])])}</b></p></div>`;
      status = `Aspettiamo ${inkName(o)}.`;
    } else {
      const A = { a: Game2.show(q.ans.a), b: Game2.show(q.ans.b) };
      h += '<div class="chi-rev">';
      for (const s of [seat, o]) {
        const g = G.other(s), right = A[g][1] === A[s][0];
        h += `<div class="chi-p" style="--c:var(--pen-${s})"><p><b class="ink-name">${s === seat ? 'Tu' : esc(nameOf(s))}</b> ${s === seat ? 'preferisci' : 'preferisce'} <span class="chi-a">${esc(pair[Number(A[s][0])])}</span></p>` +
          `<p class="chi-g${right ? ' ok' : ''}" style="--c:var(--pen-${g})">${g === seat ? 'Tu avevi detto' : `${esc(nameOf(g))} aveva detto`} «${esc(pair[Number(A[g][1])])}»: ${right ? '<i>giusto!</i>' : '<i>sbagliato</i>'}</p></div>`;
      }
      h += '</div>';
      if (q.phase === 'over') {
        const w = q.pts.a === q.pts.b ? '' : q.pts.a > q.pts.b ? 'a' : 'b';
        status = !w ? `Pari, ${q.pts.a} a ${q.pts.b}: vi conoscete uguale.` : w === seat ? `Hai indovinato di più tu: ${q.pts[w]} a ${q.pts[o]}!` : `Ha indovinato di più ${inkName(w)}: ${q.pts[w]} a ${q.pts[G.other(w)]}.`;
        if (canManage()) controls = '<button class="btn" type="button" data-act="chi-new">Nuova partita</button>';
      } else {
        status = 'Ecco com’è andata.';
        if (canManage()) controls = '<button class="btn" type="button" data-act="chi-next">Prossima domanda</button>';
      }
    }
    h += '</div>';
    if (q.phase === 'play' && canManage() && (q.k > 1 || q.ans.a || q.ans.b)) controls += restartCtl('chi');
    return { board: h, status, controls };
  }

  // After each render: fill the Nomi cose città fields with what was typed before a reload.
  function postRender() {
    if (tab !== 'ncc' || S.ncc.phase !== 'play' || S.ncc.ans[seat]) return;
    const d = nccDraft();
    Game3.CATS.forEach((_, k) => {
      const i = document.getElementById('ncc-w' + k);
      if (i && i.dataset.init !== '1') { i.value = typeof d[k] === 'string' ? d[k] : ''; i.dataset.init = '1'; }
    });
  }
  document.addEventListener('input', e => {
    if (!e.target.id || !/^ncc-w\d$/.test(e.target.id)) return;
    const vals = Game3.CATS.map((_, k) => { const i = document.getElementById('ncc-w' + k); return i ? i.value : ''; });
    store.set(nccDraftKey(), JSON.stringify(vals));
  });

  /* ---------- index of games and the random wheel ---------- */
  const TILTS = [-0.6, -1.4, 1.1, 0.8, -1, 1.3, -0.7, -1.2, 0.9, 1.2, -0.9, 0.7, -1.3, 1];
  const DICE = '<svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="24" height="24" rx="6"/><circle cx="11" cy="11" r="1.7" fill="currentColor"/><circle cx="21" cy="11" r="1.7" fill="currentColor"/><circle cx="16" cy="16" r="1.7" fill="currentColor"/><circle cx="11" cy="21" r="1.7" fill="currentColor"/><circle cx="21" cy="21" r="1.7" fill="currentColor"/></svg>';
  function cardState(g) {
    if (synced && g === 'bri' && S.bri.phase === 'idle') return { text: 'Dai le carte', mine: false };
    if (synced && g === 'dis') {
      const q = S.dis, me = q.drawer === seat;
      if (q.phase === 'choose') return me ? { text: 'Scegli la parola', mine: true } : { text: `${nameOf(q.drawer)} sceglie`, mine: false };
      if (q.phase === 'draw') return { text: me ? 'Disegna' : 'Indovina', mine: true };
      return { text: 'Vedi com’è andata', mine: false };
    }
    if (synced && g === 'ncc') {
      const q = S.ncc;
      if (q.phase === 'idle') return { text: 'Estrai la lettera', mine: false };
      if (q.phase === 'play') return q.ans[seat] ? { text: `Aspetta ${nameOf(other())}`, mine: false } : { text: q.stop ? 'Stop! Manda' : 'Scrivi le parole', mine: true };
      return { text: 'Conta i punti', mine: true };
    }
    if (synced && g === 'chi') {
      const m = yourMove('chi', seat);
      if (m === true) return { text: 'Rispondi', mine: true };
      if (m === false) return { text: 'Hai risposto', mine: false };
      return { text: S.chi.phase === 'over' ? 'Partita finita' : 'Vedi le risposte', mine: false };
    }
    if (g === 'taro' && synced) {
      const t = S.taro, mine = t.drawer === seat;
      if (t.phase === 'pick') return mine ? { text: 'Scegli le carte', mine: true } : { text: `${nameOf(t.drawer)} pesca`, mine: false };
      if (t.phase === 'spread') return { text: 'Carte coperte', mine: true };
      if (t.phase === 'reveal') return t.reading ? { text: 'Lettura pronta', mine: false } : !mine ? { text: 'Leggi le carte', mine: true } : { text: `${nameOf(G.other(t.drawer))} legge`, mine: false };
      return { text: 'Mescola le carte', mine: false };
    }
    const m = synced ? yourMove(g, seat) : undefined;
    if (m === true) return { text: g === 'dom' ? 'Rispondi' : 'Tocca a te', mine: true };
    if (m === false) return { text: g === 'dom' ? 'Hai risposto' : `Tocca a ${nameOf(other())}`, mine: false };
    if (m === null) return { text: g === 'dom' ? 'Risposte pronte' : 'Partita finita', mine: false };
    return { text: '…', mine: false };
  }
  function homeHTML() {
    let h = `<button class="spin-btn" type="button" data-act="spin"${ui.spinning || !synced ? ' disabled' : ''}>${DICE}Gira la ruota</button><p class="home-hint">Non sapete a cosa giocare? La ruota sceglie un gioco a caso, uguale per tutti e due.</p><div class="cards">`;
    GAMES.forEach((g, k) => {
      const st = cardState(g);
      h += `<button class="gcard" type="button" data-act="open" data-g="${g}" data-game="${g}" style="--tilt:${TILTS[k]}deg"><span class="gname">${TITLES[g]}</span><span class="gstate${st.mine ? ' mine' : ''}" style="--c:var(--pen-${seat})">${esc(st.text)}</span><span class="gart">${artSVG(g)}</span></button>`;
    });
    return h + '</div>';
  }

  let actx = null;
  function audio() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume().catch(() => {});
      return actx;
    } catch (e) {
      return null;
    }
  }
  function blip(freq, dur, vol, type) {
    const c = audio();
    if (!c || c.state !== 'running') return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  const tick = () => blip(1500, 0.035, 0.07, 'triangle');
  const chime = () => { blip(784, 0.3, 0.13); setTimeout(() => blip(1175, 0.45, 0.13), 130); };
  document.addEventListener('pointerdown', () => { audio(); }, { passive: true });

  const CARD_W = 150;
  let lastPickKey = null, spinPending = null;
  const pickKey = p => (p ? `${p.n}:${p.g}:${p.by}` : '');
  // Both phones land on the same game: the pick travels through Firebase, the spin is only the show.
  function checkPick() {
    if (lastPickKey === null || !S.pick || !S.pick.n) return;
    const key = pickKey(S.pick);
    if (key === lastPickKey) return;
    lastPickKey = key;
    if (Math.abs(Date.now() - S.pick.at) > 20000 || !GAMES.includes(S.pick.g)) return;
    spin(S.pick.g, S.pick.by);
  }
  function startSpin() {
    if (ui.spinning || !synced) return;
    audio();
    const choices = GAMES.filter(g => g !== S.pick.g);
    const g = choices[Math.floor(Math.random() * choices.length)];
    if (act({ t: 'pick', seat, g })) {
      lastPickKey = pickKey(S.pick);
      spin(g, seat);
    }
  }
  function spin(target, by) {
    if (ui.spinning) { spinPending = { target, by }; return; }
    ui.spinning = true;
    const el = $('#spin'), reel = $('#reel');
    $('#spin-title').textContent = by === seat ? 'Si gioca a…' : `${nameOf(by)} ha girato la ruota…`;
    const len = GAMES.length, start = Math.floor(Math.random() * len), ti = GAMES.indexOf(target);
    const F = 4 * len + ((ti - start + len) % len);
    // Cards are laid out right to left, so the strip slides from left to right as it spins.
    const items = [];
    for (let k = -1; k <= F + 1; k++) {
      const g = GAMES[(((start + k) % len) + len) % len];
      items.push(`<div class="rcard" data-game="${g}"><span><i class="rart">${artSVG(g)}</i><b>${TITLES[g]}</b></span></div>`);
    }
    reel.innerHTML = items.reverse().join('');
    el.classList.remove('done');
    el.hidden = false;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const T = reduce ? 0 : 3600, t0 = performance.now();
    let lastTick = 0;
    const Wc = reel.parentElement.clientWidth;
    const place = idx => { reel.style.transform = `translate3d(${(Wc / 2 - CARD_W / 2 - (F + 1 - idx) * CARD_W).toFixed(2)}px, 0, 0)`; };
    const land = () => {
      place(F);
      const win = reel.children[1];
      if (win) win.classList.add('win');
      el.classList.add('done');
      chime();
      setTimeout(() => {
        el.hidden = true;
        reel.innerHTML = '';
        ui.spinning = false;
        if (spinPending) {
          const p = spinPending;
          spinPending = null;
          spin(p.target, p.by);
        } else {
          setTab(target, true);
        }
      }, 1400);
    };
    const frame = now => {
      const t = T ? Math.min(1, (now - t0) / T) : 1;
      const idx = (1 - Math.pow(1 - t, 4)) * F;
      place(idx);
      const near = Math.round(idx);
      if (near !== lastTick) { lastTick = near; if (t < 1) tick(); }
      if (t < 1) requestAnimationFrame(frame);
      else land();
    };
    place(0);
    requestAnimationFrame(frame);
    render();
  }

  function pickQuestion() {
    const used = new Set([S.dom.q].concat(S.dom.hist.map(h => h[0])));
    const all = Game2.QUESTIONS.map((_, i) => i);
    const free = all.filter(i => !used.has(i));
    const pool = free.length ? free : all.filter(i => i !== S.dom.q);
    return pool[Math.floor(Math.random() * pool.length)];
  }
  const VIEWS = { bri: viewBri, mem: viewMem, dis: viewDis, ncc: viewNcc, chi: viewChi, taro: viewTaro, imp: viewImp, qua: viewQua, tris: viewTris, c4: viewC4, sos: viewSos, num: viewNum, navi: viewNavi, dom: viewDom };

  function whoHTML() {
    const o = other(), name = esc(nameOf(o)), t = partnerTabNow();
    let text = `${name} non c’è`;
    if (!synced) text = 'Mi collego…';
    else if (partnerHere()) text = t ? `${name} è ${WHERE[t]}` : `${name} c’è`;
    return `<span class="chip${partnerHere() ? ' here' : ''}" style="--c:var(--pen-${o})"><span class="inkdot"></span><span class="nm">${text}</span></span>`;
  }

  function noteHTML() {
    if (netError) return `<span>${esc(netError)}</span>`;
    if (synced && !partnerHere() && store.get('blocchetto.met.' + code) !== '1') {
      return `<button class="btn small" type="button" data-act="share">Manda il link a ${esc(nameOf(other()))}</button>`;
    }
    return '';
  }

  function setHTML(el, html) {
    if (el._html === html) return;
    const focused = document.activeElement;
    const keep = focused && el.contains(focused) && focused.id && (focused.tagName === 'INPUT' || focused.tagName === 'TEXTAREA')
      ? { id: focused.id, s: focused.selectionStart, e: focused.selectionEnd } : null;
    const vals = {};
    el.querySelectorAll('input[id], textarea[id]').forEach(i => { vals[i.id] = i.value; });
    el.innerHTML = html;
    el._html = html;
    for (const id in vals) {
      const i = document.getElementById(id);
      if (i && el.contains(i)) { i.value = vals[id]; i.dataset.init = '1'; }
    }
    if (keep) {
      const i = document.getElementById(keep.id);
      if (i) { i.focus({ preventScroll: true }); try { i.setSelectionRange(keep.s, keep.e); } catch (e) { /* not a text field */ } }
    }
  }

  function renderSheet() {
    const el = $('#sheet');
    el.hidden = !ui.sheet;
    if (!ui.sheet) { el.innerHTML = ''; el._html = ''; return; }
    const o = other();
    let h = '<div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">';
    h += '<div class="sheet-head"><h3 id="sheet-title">Impostazioni</h3><button class="btn small" type="button" data-act="close-sheet">Fatto</button></div>';
    h += `<section class="seat" style="--c:var(--pen-${seat})"><label class="lbl" for="nick-${seat}">Il tuo nome</label><input class="line-input" id="nick-${seat}" data-nick="${seat}" type="text" maxlength="16" autocomplete="off" enterkeyhint="done">`;
    h += symPicker(seat, 'Il tuo segno nel tris') + '</section>';
    h += `<section class="seat"><div class="seat-top">Link per ${esc(nameOf(o))}</div><input class="link-box" id="link-box" type="text" readonly value="${esc(inviteLink())}" aria-label="Link per ${esc(nameOf(o))}"><div class="row"><button class="btn small" type="button" data-act="share">Manda</button><button class="btn small ghost" type="button" data-act="copy">Copia</button></div></section>`;
    h += '<section class="seat">';
    if (ui.confirm === 'scores') {
      h += '<p class="ask">Azzero tutti i punteggi?</p><div class="row"><button class="btn small" type="button" data-act="do-reset">Azzera</button><button class="btn small ghost" type="button" data-act="cancel">No</button></div>';
    } else if (ui.confirm === 'switch') {
      h += `<p class="ask">Allora sei ${esc(nameOf(o))}?</p><div class="row"><button class="btn small" type="button" data-act="do-switch">Sì</button><button class="btn small ghost" type="button" data-act="cancel">No</button></div>`;
    } else {
      h += `<div class="row"><button class="btn small ghost" type="button" data-act="ask-reset">Azzera i punteggi</button><button class="btn small ghost" type="button" data-act="ask-switch">Non sono ${esc(nameOf(seat))}</button></div>`;
    }
    h += '</section></div>';
    setHTML(el, h);
    const inp = document.getElementById('nick-' + seat);
    if (inp && inp.dataset.init !== '1') { inp.value = nameOf(seat); inp.dataset.init = '1'; }
  }

  function renderGate() {
    const g = $('#gate');
    g.hidden = !!seat;
    if (seat) return;
    setHTML(g, '<div class="gate-card"><h2>Chi sei?</h2>' +
      '<button class="who-btn" type="button" data-act="iam" data-seat="a" style="--c:var(--pen-a)"><span class="inkdot"></span>Gabri</button>' +
      '<button class="who-btn" type="button" data-act="iam" data-seat="b" style="--c:var(--pen-b)"><span class="inkdot"></span>Ivi</button></div>');
  }

  function render() {
    renderGate();
    if (!seat) return;
    setHTML($('#who'), whoHTML());
    const home = tab === 'home';
    $('#home').hidden = !home;
    $('#crumbs').hidden = home;
    $('#page').hidden = home;
    if (home) {
      setHTML($('#home'), homeHTML());
    } else {
      const sig = JSON.stringify(S[tab]);
      let anim = false;
      if (seen.imp === undefined) { for (const g of GAMES) seen[g] = JSON.stringify(S[g]); }
      else if (seen[tab] !== sig) { seen[tab] = sig; animSig = tab + sig; animUntil = Date.now() + 900; anim = true; }
      else if (animSig === tab + sig && Date.now() < animUntil) anim = true;
      $('#page').dataset.game = tab;
      $('#page-title').textContent = TITLES[tab];
      $('#rules-text').textContent = RULES[tab];
      const v = VIEWS[tab](anim);
      $('#page-score').hidden = tab === 'dom' || tab === 'taro';
      setHTML($('#page-score'), scoreHTML(tab));
      if (!(tab === 'dis' && ui.disLive)) setHTML($('#board'), v.board);
      setHTML($('#status'), v.status);
      setHTML($('#controls'), v.controls);
      $('#controls').hidden = !v.controls;
    }
    const note = noteHTML();
    setHTML($('#note'), note);
    $('#note').hidden = !note;
    renderSheet();
    renderCall();
    postRender();
  }

  /* ---------- input ---------- */
  function openRulesOnce(g) {
    const key = 'blocchetto.rules.' + g;
    $('#rules').open = store.get(key) !== '1';
    store.set(key, '1');
  }
  function setTab(t) {
    if (!(t === 'home' || GAMES.includes(t)) || t === tab) return;
    tab = t;
    ui.confirm = '';
    store.set('blocchetto.tab', t);
    updatePresence();
    render();
    window.scrollTo(0, 0);
    if (t !== 'home') {
      openRulesOnce(t);
      const p = $('#page');
      p.classList.remove('enter');
      void p.offsetWidth;
      p.classList.add('enter');
    }
  }
  function openSheet() {
    ui.sheet = true;
    ui.confirm = '';
    renderSheet();
    const b = $('#sheet [data-act="close-sheet"]');
    if (b) b.focus();
  }
  function closeSheet() {
    ui.sheet = false;
    ui.confirm = '';
    render();
    $('#open-sheet').focus();
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) {
      if (e.target.id === 'sheet') closeSheet();
      return;
    }
    if (el.disabled) return;
    const A = el.getAttribute('data-act');
    switch (A) {
      case 'iam':
        seat = seatOr(el.getAttribute('data-seat'));
        rememberSeat();
        load();
        render();
        startSync();
        startNet();
        break;
      case 'tab': setTab(el.getAttribute('data-tab')); break;
      case 'open-sheet': openSheet(); break;
      case 'close-sheet': closeSheet(); break;
      case 'share': shareInvite(); break;
      case 'copy': copyInvite(); break;
      case 'call': startCall(); break;
      case 'answer': answerCall(); break;
      case 'decline': declineCall(); break;
      case 'hangup': hangup(); break;
      case 'mic':
        micOn = !micOn;
        if (localStream) localStream.getAudioTracks().forEach(t => { t.enabled = micOn; });
        renderCall();
        break;
      case 'cam':
        camOn = !camOn;
        if (localStream) localStream.getVideoTracks().forEach(t => { t.enabled = camOn; });
        renderCall();
        break;
      case 'call-size':
        bigCall = !bigCall;
        pos.x = null;
        renderCall();
        break;
      case 'tap-audio':
        $('#remote').play().then(() => { needTap = false; renderCall(); }).catch(() => {});
        break;
      case 'home': setTab('home'); break;
      case 'open': setTab(el.getAttribute('data-g')); break;
      case 'spin': startSpin(); break;
      case 'new': {
        const g = el.getAttribute('data-g');
        if (g === 'navi') ui.naviDraft = null;
        act({ t: g + '.new', seat });
        break;
      }
      case 'ask-restart': ui.confirm = 'restart-' + el.getAttribute('data-g'); render(); break;
      case 'restart': {
        const g = el.getAttribute('data-g');
        ui.confirm = '';
        if (g === 'navi') ui.naviDraft = null;
        if (g === 'taro') act({ t: 'taro.cancel', seat });
        else if (g === 'dom') act({ t: 'dom.new', seat, force: true, q: pickQuestion() });
        else act({ t: g + '.new', seat, force: true });
        render();
        break;
      }
      case 'c4': act({ t: 'c4.drop', seat, col: Number(el.getAttribute('data-col')) }); break;
      case 'sos-letter': ui.sosCh = el.getAttribute('data-ch') === 'O' ? 'O' : 'S'; render(); break;
      case 'sos': act({ t: 'sos.play', seat, i: Number(el.getAttribute('data-i')), ch: ui.sosCh }); break;
      case 'num-key': {
        const d = el.getAttribute('data-d');
        if (ui.numDraft.length < 4 && !ui.numDraft.includes(d)) { ui.numDraft += d; render(); }
        break;
      }
      case 'num-del': ui.numDraft = ui.numDraft.slice(0, -1); render(); break;
      case 'num-ok': {
        const t = S.num.phase === 'setup' ? 'num.secret' : 'num.guess';
        if (act({ t, seat, code: ui.numDraft })) { ui.numDraft = ''; render(); }
        break;
      }
      case 'navi-shuffle':
        ui.naviDraft = Game2.randomFleet(Math.random);
        if (Game2.fleetOf(S.navi, seat)) act({ t: 'navi.place', seat, ships: ui.naviDraft });
        else render();
        break;
      case 'navi-ready': if (ui.naviDraft) act({ t: 'navi.place', seat, ships: ui.naviDraft }); break;
      case 'navi-shot': act({ t: 'navi.shot', seat, i: Number(el.getAttribute('data-i')) }); break;
      case 'dom-next': act({ t: 'dom.next', seat, q: pickQuestion() }); break;
      case 'dom-skip': act({ t: 'dom.skip', seat, q: pickQuestion() }); break;
      case 'bri-deal': act({ t: 'bri.deal', seat, deck: cryptoShuffle(Array.from({ length: 40 }, (_, i) => i)) }); break;
      case 'bri': act({ t: 'bri.play', seat, card: Number(el.getAttribute('data-c')) }); break;
      case 'mem': {
        const a = { t: 'mem.flip', seat, i: Number(el.getAttribute('data-i')) };
        if (!S.mem.lay) a.deal = memLayout();
        act(a);
        break;
      }
      case 'dis-word': act({ t: 'dis.word', seat, word: el.getAttribute('data-w') }); break;
      case 'dis-reroll': ui.disOpts = pickSome(Game3.WORDS.filter(w => !ui.disOpts || !ui.disOpts.includes(w)), 3); render(); break;
      case 'dis-ink': ui.disInk = Number(el.getAttribute('data-k')) || 0; if (ui.disInk === 5 && ui.disSize < 2) ui.disSize = 2; render(); break;
      case 'dis-size': ui.disSize = Number(el.getAttribute('data-k')) || 0; render(); break;
      case 'dis-undo': act({ t: 'dis.undo', seat }); break;
      case 'dis-clear':
        if (ui.confirm !== 'dis-clear') { ui.confirm = 'dis-clear'; el.textContent = 'Sicuro? Tocca ancora'; setTimeout(() => { if (ui.confirm === 'dis-clear') { ui.confirm = ''; render(); } }, 2500); break; }
        ui.confirm = '';
        act({ t: 'dis.clear', seat });
        break;
      case 'dis-give': act({ t: 'dis.give', seat }); break;
      case 'dis-take': act({ t: 'dis.take', seat }); break;
      case 'dis-next': act({ t: 'dis.next', seat }); break;
      case 'ncc-start': act({ t: 'ncc.start', seat, letter: nccLetter() }); break;
      case 'ncc-veto': act({ t: 'ncc.veto', seat, who: el.getAttribute('data-who'), k: Number(el.getAttribute('data-k')) }); break;
      case 'ncc-done': act({ t: 'ncc.done', seat }); break;
      case 'chi-pick':
        if (el.getAttribute('data-who') === 'me') ui.chiMe = Number(el.getAttribute('data-k'));
        else ui.chiYou = Number(el.getAttribute('data-k'));
        render();
        break;
      case 'chi-send': if (ui.chiMe >= 0 && ui.chiYou >= 0) act({ t: 'chi.answer', seat, me: ui.chiMe, you: ui.chiYou }); break;
      case 'chi-next': act({ t: 'chi.next', seat, q: pickPair() }); break;
      case 'chi-new': act({ t: 'chi.new', seat, q: pickPair() }); break;
      case 'taro-spread': ui.taroSpread = Number(el.getAttribute('data-n')) || 3; render(); break;
      case 'taro-pick': act({ t: 'taro.pick', seat, pos: Number(el.getAttribute('data-pos')) }); break;
      case 'taro-flip': act({ t: 'taro.flip', seat }); break;
      case 'taro-done': act({ t: 'taro.done', seat }); break;
      case 'taro-cancel': act({ t: 'taro.cancel', seat }); break;
      case 'guess': act({ t: 'imp.guess', seat, ch: el.getAttribute('data-ch') }); break;
      case 'imp-swap': act({ t: 'imp.swap', seat }); break;
      case 'imp-next': act({ t: 'imp.next', seat }); break;
      case 'imp-cancel': act({ t: 'imp.cancel', seat }); break;
      case 'line': act({ t: 'qua.line', seat, k: el.getAttribute('data-k'), i: Number(el.getAttribute('data-i')) }); break;
      case 'size': act({ t: 'qua.new', seat, size: Number(el.getAttribute('data-size')) }); break;
      case 'ask-qua': ui.confirm = 'qua'; render(); break;
      case 'qua-restart': ui.confirm = ''; act({ t: 'qua.new', seat, size: S.qua.R, force: true }); render(); break;
      case 'tris': act({ t: 'tris.play', seat, i: Number(el.getAttribute('data-i')) }); break;
      case 'page': act({ t: 'tris.page', seat }); break;
      case 'sym': act({ t: 'sym', seat, sym: el.getAttribute('data-sym') }); break;
      case 'ask-reset': ui.confirm = 'scores'; renderSheet(); break;
      case 'ask-switch': ui.confirm = 'switch'; renderSheet(); break;
      case 'do-reset': ui.confirm = ''; act({ t: 'scores0', seat }); renderSheet(); break;
      case 'do-switch':
        seat = other();
        rememberSeat();
        location.reload();
        break;
      case 'cancel': ui.confirm = ''; render(); break;
      default: break;
    }
  });

  document.addEventListener('submit', e => {
    if (e.target.id === 'dis-own') {
      e.preventDefault();
      const w = G.cleanText(e.target.elements.w.value, 24);
      if (Game.normWord(w).replace(/[^A-Z]/g, '').length < 2) { $('#dis-own-err').textContent = 'Almeno due lettere.'; return; }
      if (document.activeElement) document.activeElement.blur();
      act({ t: 'dis.word', seat, word: w });
      return;
    }
    if (e.target.id === 'dis-form') {
      e.preventDefault();
      const input = e.target.elements.g, txt = G.cleanText(input.value, 40);
      if (!Game3.guessKey(txt)) { $('#dis-err').textContent = 'Scrivi cosa ti sembra.'; return; }
      if (act({ t: 'dis.guess', seat, text: txt })) {
        const fresh = $('#dis-g');
        if (fresh && S.dis.phase === 'draw') { fresh.value = ''; fresh.focus({ preventScroll: true }); }
        else if (document.activeElement) document.activeElement.blur();
      }
      return;
    }
    if (e.target.id === 'ncc-form') {
      e.preventDefault();
      const words = Game3.CATS.map((_, k) => e.target.elements['w' + k].value);
      if (document.activeElement) document.activeElement.blur();
      act({ t: 'ncc.send', seat, words });
      return;
    }
    if (e.target.id === 'taro-qform') {
      e.preventDefault();
      if (document.activeElement) document.activeElement.blur();
      act({ t: 'taro.shuffle', seat, spread: ui.taroSpread, deck: shuffledDeck(), question: e.target.elements.q.value });
      return;
    }
    if (e.target.id === 'taro-form') {
      e.preventDefault();
      const txt = G.cleanText(e.target.elements.text.value, 800);
      if (!txt) { $('#taro-err').textContent = 'Scrivi qualcosa prima di inviare.'; return; }
      if (document.activeElement) document.activeElement.blur();
      if (!act({ t: 'taro.read', seat, text: txt })) $('#taro-err').textContent = 'La lettura è già questa.';
      return;
    }
    if (e.target.id === 'dom-form') {
      e.preventDefault();
      const txt = G.cleanText(e.target.elements.text.value, 280);
      if (!txt) { $('#dom-err').textContent = 'Scrivi qualcosa prima di inviare.'; return; }
      if (document.activeElement) document.activeElement.blur();
      act({ t: 'dom.answer', seat, text: txt });
      return;
    }
    if (e.target.id !== 'imp-form') return;
    e.preventDefault();
    const form = e.target;
    const word = G.normWord(form.elements.word.value);
    const err = $('#imp-err');
    if (word.replace(/[^A-Z]/g, '').length < 2) {
      err.textContent = 'Almeno due lettere, senza numeri.';
      form.elements.word.focus();
      return;
    }
    if (document.activeElement) document.activeElement.blur();
    if (!act({ t: 'imp.set', seat, word, hint: form.elements.hint.value })) err.textContent = 'Qualcosa non va, ricarica la pagina.';
  });

  document.addEventListener('change', e => {
    const s = e.target.getAttribute && e.target.getAttribute('data-nick');
    if (s && s === seat) act({ t: 'nick', seat, nick: e.target.value });
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && ui.sheet) { closeSheet(); return; }
    const tgt = e.target;
    if (ui.sheet || e.metaKey || e.ctrlKey || e.altKey) return;
    if (tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.isContentEditable)) return;
    if (tab === 'imp' && /^[a-zA-Z]$/.test(e.key)) {
      const v = G.impView(S.imp);
      if (S.imp.phase === 'play' && !v.over && canAct(v.guesser)) act({ t: 'imp.guess', seat, ch: e.key.toUpperCase() });
    }
  });

  if (seat) load();
  if (tab !== 'home') openRulesOnce(tab);
  render();
  startSync();
  startNet();
})();
</script>
