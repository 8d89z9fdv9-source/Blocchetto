<style>
:root {
  /* Layout: a pocket game pad. Mint cover, three coloured tabs that tuck under the open page; each page is a coloured frame around rounded paper cards, marks drawn with a red and a blue felt-tip. */
  --bg: #D2ECDB;
  --ink: #1D2340;
  --ink-soft: #4A5270;
  --paper: #F7F5F0;
  --paper-2: #E9E5DC;
  --imp: #7066D4;
  --qua: #3570DA;
  --tris: #E0662C;
  --imp-print: #7066D4;
  --qua-print: #3570DA;
  --tris-print: #EE9B72;
  --pen-a: #D3312A;
  --pen-b: #233C9C;
  --on-frame: #FFFFFF;
  --live: #23935A;
  --muted: #8B90A0;
  --scrim: rgba(17, 22, 40, .45);
  --shadow: 0 1px 0 rgba(29, 35, 64, .05), 0 12px 26px -16px rgba(29, 35, 64, .45);
  --f-ui: "Figtree", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-hand: "Patrick Hand", "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101814; --ink: #E8ECF5; --ink-soft: #AAB2C6; --paper: #1E2332; --paper-2: #2B3144;
    --imp: #5A51BE; --qua: #2C5DB9; --tris: #B9552A;
    --imp-print: #A99FF5; --qua-print: #86A6F0; --tris-print: #C9774F;
    --pen-a: #FF8678; --pen-b: #9DB3FF; --on-frame: #FFFFFF; --live: #57D18F; --muted: #7F8699;
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 12px 26px -16px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101814; --ink: #E8ECF5; --ink-soft: #AAB2C6; --paper: #1E2332; --paper-2: #2B3144;
  --imp: #5A51BE; --qua: #2C5DB9; --tris: #B9552A;
  --imp-print: #A99FF5; --qua-print: #86A6F0; --tris-print: #C9774F;
  --pen-a: #FF8678; --pen-b: #9DB3FF; --on-frame: #FFFFFF; --live: #57D18F; --muted: #7F8699;
  --scrim: rgba(0, 0, 0, .6); --shadow: 0 12px 26px -16px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; touch-action: manipulation; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 40px;
  display: grid; gap: 16px;
}

/* cover */
.cover { display: grid; gap: 12px; }
.cover-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.cover h1 { margin: 0; font-size: clamp(27px, 7.4vw, 36px); font-weight: 800; line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance; }
.cover .sub { margin: 8px 0 0; font-size: 15px; color: var(--ink-soft); max-width: 32ch; }
.pill { flex: none; font: 700 14px/1 var(--f-ui); color: var(--ink); background: transparent; border: 2px solid var(--ink); border-radius: 999px; padding: 9px 13px; cursor: pointer; }
@media (hover: hover) { .pill:hover { background: var(--ink); color: var(--bg); } }
.who { display: flex; flex-wrap: wrap; gap: 8px; min-height: 32px; }
.chip { display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: 100%; padding: 6px 12px 6px 9px; border-radius: 999px; background: var(--paper); font-size: 14px; font-weight: 700; box-shadow: var(--shadow); }
.chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip .state { font-weight: 500; color: var(--ink-soft); white-space: nowrap; }
.inkdot { width: 11px; height: 11px; border-radius: 50%; background: var(--c); flex: none; }
.chip.here .inkdot { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--live); }

/* tabs tucked under the page */
.book { display: grid; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.tabs { position: relative; z-index: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; margin-bottom: -18px; padding-inline: 4px; }
.tab {
  position: relative; border: 0; border-radius: 14px 14px 8px 8px; padding: 13px 6px 30px;
  color: var(--on-frame); font: 800 16px/1.1 var(--f-ui); letter-spacing: .01em; cursor: pointer;
  transform: translateY(8px) rotate(var(--tilt)); transition: transform .2s ease; box-shadow: var(--shadow);
}
.tab[aria-selected="true"] { transform: none; }
.tab-imp { background: var(--imp); --tilt: -2deg; }
.tab-qua { background: var(--qua); --tilt: 1.5deg; }
.tab-tris { background: var(--tris); --tilt: -1deg; }
.tab .badge { position: absolute; top: -6px; right: -4px; width: 17px; height: 17px; border-radius: 50%; background: var(--paper); box-shadow: 0 0 0 3px var(--c, var(--ink)); }

/* page */
.page { position: relative; z-index: 1; --frame: var(--imp); --print: var(--imp-print); background: var(--frame); border-radius: 22px; padding: 14px 12px 12px; display: grid; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
.page[data-game="qua"] { --frame: var(--qua); --print: var(--qua-print); }
.page[data-game="tris"] { --frame: var(--tris); --print: var(--tris-print); }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px; min-width: 0; }
.page-head h2 { margin: 0; color: var(--on-frame); font-size: 21px; font-weight: 800; flex: none; }
.score { display: inline-flex; align-items: center; gap: 8px; min-width: 0; padding: 6px 12px; border-radius: 999px; background: var(--paper); font-weight: 700; font-size: 14px; }
.sc-n { color: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; max-width: 7.5em; }
.sc-p { font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
.sc-sep { margin: 0 3px; color: var(--muted); }
.card { background: var(--paper); border-radius: 16px; padding: 16px; min-width: 0; }
.panel { background: var(--paper); border-radius: 16px; padding: 14px 16px; display: grid; gap: 12px; min-width: 0; }
.status { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.4; text-wrap: pretty; }
.ink-name { color: var(--c); font-weight: 800; }
.count { display: inline-block; margin-left: 4px; font-size: 14px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.reveal { font-family: var(--f-hand); font-size: 21px; letter-spacing: .05em; }
.tally { display: inline-flex; gap: 12px; margin-left: 6px; font-family: var(--f-hand); font-size: 21px; font-weight: 400; vertical-align: -1px; }
.tally span { color: var(--c); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.note { margin: 0; padding: 0 4px; font-size: 14px; color: var(--ink-soft); text-wrap: pretty; }

/* buttons */
.btn { font: 700 16px/1 var(--f-ui); padding: 13px 20px; border-radius: 999px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.small { padding: 9px 14px; font-size: 14px; }
@media (hover: hover) { .btn:hover { filter: brightness(1.1); } }
.seg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.seg-label { font-size: 14px; font-weight: 700; color: var(--ink-soft); margin-right: 4px; }
.chipbtn { font: 700 15px/1 var(--f-ui); padding: 10px 13px; border-radius: 999px; border: 2px solid var(--paper-2); background: transparent; cursor: pointer; font-variant-numeric: tabular-nums; }
.chipbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.symbtn { width: 44px; height: 44px; padding: 7px; border-radius: 12px; border: 2px solid transparent; background: transparent; cursor: pointer; }
.symbtn svg { width: 100%; height: 100%; display: block; overflow: visible; }
.symbtn[aria-pressed="true"] { border-color: var(--ink); background: var(--paper-2); }

/* pen and print */
.pen { fill: none; stroke: var(--c, var(--ink)); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.pen.thin { stroke-width: 2.6; }
.pen.sym { stroke-width: 7; }
.pen.edge-line { stroke-width: 3.6; }
.pen.edge-line.last { stroke-width: 5.2; }
.print { fill: none; stroke: var(--print); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.fresh { animation: draw .5s cubic-bezier(.3, .7, .4, 1) both; }
.win-line .fresh { animation-delay: .35s; }
@keyframes draw {
  0% { stroke-dasharray: 1 1; stroke-dashoffset: 1; }
  99% { stroke-dasharray: 1 1; stroke-dashoffset: 0; }
  100% { stroke-dasharray: none; stroke-dashoffset: 0; }
}
.pop { animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both; transform-box: fill-box; transform-origin: center; display: inline-block; }
@keyframes pop { from { opacity: 0; transform: scale(.4) rotate(-12deg); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .fresh, .pop { animation: none; }
  .tab { transition: none; }
}

/* hangman */
.hang { display: grid; justify-items: center; gap: 14px; }
.gallows { width: min(100%, 250px); height: auto; overflow: visible; }
.hint { margin: -6px 0 0; font-family: var(--f-hand); font-size: 21px; color: var(--ink-soft); text-align: center; }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; max-width: 100%; font-size: var(--fs, 32px); }
.slots .w { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.slot { width: 1.05em; height: 1.35em; border-bottom: 3px solid var(--print); display: grid; place-items: end center; font-family: var(--f-hand); line-height: 1; padding-bottom: .06em; }
.punct { font-family: var(--f-hand); line-height: 1.35; }
.ch { color: var(--c); }
.ch.ghost { color: var(--muted); opacity: .55; }
.ch.miss { color: var(--muted); }
.slots.empty { width: min(100%, 260px); height: 1.3em; border-bottom: 3px dashed var(--print); opacity: .6; }
.abc { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 2px 4px; }
.abc.waiting .key:not(.used) { opacity: .55; }
.key { position: relative; height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--print); font: 800 20px/1 var(--f-ui); cursor: pointer; }
.key:disabled { cursor: default; }
.key.used { color: var(--muted); }
.key.hit { color: var(--ink); }
.key .mark { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); overflow: visible; pointer-events: none; }
@media (hover: hover) { .key:not(:disabled):hover { background: var(--paper-2); } }

/* dots and boxes */
.dots { display: block; width: 100%; height: auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.dot { fill: var(--print); pointer-events: none; }
.ini { font-family: var(--f-hand); font-size: 34px; fill: var(--c); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.edge { cursor: pointer; }
.edge .hit { fill: transparent; }
.edge .ghost { stroke: var(--c); stroke-width: 4; stroke-linecap: round; opacity: 0; transition: opacity .12s; }
@media (hover: hover) { .edge:hover .ghost { opacity: .4; } }

/* tic-tac-toe */
.tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tb { position: relative; aspect-ratio: 1 / 1; border-radius: 14px; background: var(--paper); }
.tb.future { opacity: .5; }
.tb.active { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--ink); }
.cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); border-radius: 14px; overflow: hidden; }
.cell { display: grid; place-items: center; min-width: 0; min-height: 0; padding: 14%; border: 0; border-right: 2px solid var(--print); border-bottom: 2px solid var(--print); background: transparent; }
.cell:nth-child(3n) { border-right: 0; }
.cell:nth-child(n+7) { border-bottom: 0; }
button.cell { cursor: pointer; }
@media (hover: hover) { button.cell:hover { background: var(--paper-2); } }
.cell svg { width: 100%; height: 100%; display: block; overflow: visible; }
.win-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.win-line .pen { stroke-width: 6; }

/* forms and the names sheet */
.form { display: grid; gap: 10px; }
.lbl { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
.opt { font-weight: 500; }
.line-input { width: 100%; font: 25px/1.2 var(--f-hand); color: var(--ink); background: transparent; border: 0; border-bottom: 3px solid var(--print, var(--ink-soft)); border-radius: 0; padding: 4px 2px 6px; letter-spacing: .04em; }
.line-input:focus { outline: none; border-bottom-color: var(--ink); }
.line-input::placeholder { color: var(--muted); opacity: 1; }
.line-input.secret { -webkit-text-security: disc; }
.err { margin: 0; min-height: 1.2em; color: var(--pen-a); font-size: 14px; font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.sheet {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: end center; background: var(--scrim);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
@media (min-width: 640px) { .sheet { place-items: center; } }
.sheet-card { width: min(100%, 480px); max-height: calc(100% - 8px); overflow: auto; background: var(--paper); border-radius: 22px; padding: 18px; display: grid; gap: 16px; box-shadow: var(--shadow); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h3 { margin: 0; font-size: 22px; font-weight: 800; }
.seat { display: grid; gap: 8px; padding-top: 14px; border-top: 2px solid var(--paper-2); }
.seat-top { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.seat-top .tag { font-weight: 600; color: var(--ink-soft); font-size: 14px; }
.seat-name { margin: 0; font-family: var(--f-hand); font-size: 24px; color: var(--c); }
.ask { margin: 0; font-weight: 600; }

/* iPhone: safe areas, no zoom on double tap, no text selection while playing */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { min-height: 100dvh; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); touch-action: manipulation; }
.book, .tabs, .call, .ring, .gate { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.cover-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.pill { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; }
.pill svg { width: 18px; height: 18px; flex: none; }
.pill.call-pill { background: var(--ink); color: var(--bg); }
.note .row { margin-top: 10px; }

/* the call window: dark on purpose, it frames a camera picture */
.call { position: fixed; z-index: 40; left: 0; top: 0; width: 132px; border-radius: 18px; overflow: hidden; background: #0E1220; box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .55); touch-action: none; }
.call.big { width: min(calc(100vw - 24px), 440px); }
.call-video { position: relative; aspect-ratio: 3 / 4; background: #0E1220; }
.call.big .call-video { max-height: 62dvh; width: 100%; }
.call video { display: block; object-fit: cover; background: #0E1220; }
#remote { position: absolute; inset: 0; width: 100%; height: 100%; }
#local { position: absolute; right: 6px; bottom: 6px; width: 34%; aspect-ratio: 3 / 4; border-radius: 10px; transform: scaleX(-1); box-shadow: 0 0 0 2px rgba(255, 255, 255, .85); }
.call-msg { position: absolute; left: 8px; right: 8px; top: 8px; margin: 0; color: #FFFFFF; font-size: 13px; font-weight: 700; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); }
.tap-audio { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap; background: #FFFFFF; color: #0E1220; border-color: #FFFFFF; }
.call-bar { display: flex; justify-content: space-between; gap: 4px; padding: 6px; background: #0E1220; }
.call.big .call-bar { justify-content: center; gap: 14px; padding: 10px; }
.cbtn { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .16); color: #FFFFFF; cursor: pointer; }
.cbtn svg { width: 16px; height: 16px; }
.cbtn.off { background: #FFFFFF; color: #0E1220; }
.cbtn.end { background: #E5484D; }
.call.big .cbtn { width: 48px; height: 48px; }
.call.big .cbtn svg { width: 22px; height: 22px; }

.ring { position: fixed; z-index: 50; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%); width: min(calc(100vw - 24px), 420px); display: grid; gap: 12px; padding: 16px; border-radius: 20px; background: var(--paper); color: var(--ink); box-shadow: var(--shadow), 0 0 0 3px var(--c, var(--ink)); }
.ring p { margin: 0; font-size: 18px; font-weight: 800; }
.btn.ok { background: #1F9D57; border-color: #1F9D57; color: #FFFFFF; }

.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%); width: max-content; max-width: min(calc(100vw - 32px), 420px); padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 600; box-shadow: var(--shadow); }

.gate { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: var(--bg); padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.gate-card { width: min(100%, 400px); display: grid; gap: 14px; text-align: center; }
.gate h2 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
.gate p { margin: 0 0 6px; color: var(--ink-soft); }
.who-btn { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 20px; border: 0; border-radius: 18px; background: var(--paper); color: var(--c); font: 800 22px/1 var(--f-ui); box-shadow: var(--shadow); cursor: pointer; }
.who-btn .inkdot { width: 16px; height: 16px; }
.link-box { width: 100%; padding: 11px 12px; border: 2px solid var(--paper-2); border-radius: 12px; background: var(--bg); color: var(--ink); font: 600 16px/1.3 var(--f-ui); }

/* five more pages of the pad, each with its own colour */
:root {
  --c4: #17907A; --c4-print: #17907A;
  --sos: #C9467A; --sos-print: #C9467A;
  --num: #B07614; --num-print: #B07614;
  --navi: #22789C; --navi-print: #22789C;
  --dom: #3E3A8E; --dom-print: #5A55B8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --c4: #127462; --c4-print: #5FD0B6;
    --sos: #A3385F; --sos-print: #F08DB2;
    --num: #8C5F0E; --num-print: #F0BE5A;
    --navi: #1B5F7C; --navi-print: #7FC4E2;
    --dom: #302C72; --dom-print: #A9A5F2;
  }
}
:root[data-theme="dark"] {
  --c4: #127462; --c4-print: #5FD0B6;
  --sos: #A3385F; --sos-print: #F08DB2;
  --num: #8C5F0E; --num-print: #F0BE5A;
  --navi: #1B5F7C; --navi-print: #7FC4E2;
  --dom: #302C72; --dom-print: #A9A5F2;
}
[data-game="imp"] { --frame: var(--imp); --print: var(--imp-print); }
[data-game="qua"] { --frame: var(--qua); --print: var(--qua-print); }
[data-game="tris"] { --frame: var(--tris); --print: var(--tris-print); }
.page[data-game="c4"], [data-game="c4"] { --frame: var(--c4); --print: var(--c4-print); }
.page[data-game="sos"], [data-game="sos"] { --frame: var(--sos); --print: var(--sos-print); }
.page[data-game="num"], [data-game="num"] { --frame: var(--num); --print: var(--num-print); }
.page[data-game="navi"], [data-game="navi"] { --frame: var(--navi); --print: var(--navi-print); }
.page[data-game="dom"], [data-game="dom"] { --frame: var(--dom); --print: var(--dom-print); }

/* index */
.home { display: grid; gap: 16px; }
.spin-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 18px 20px; border: 0; border-radius: 20px; background: var(--ink); color: var(--bg); font: 800 20px/1 var(--f-ui); cursor: pointer; box-shadow: var(--shadow); transition: transform .12s ease; }
.spin-btn svg { width: 28px; height: 28px; flex: none; }
.spin-btn:active { transform: scale(.98); }
.spin-btn:disabled { opacity: .55; cursor: default; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
.gcard { display: grid; align-content: space-between; justify-items: start; gap: 18px; min-height: 108px; min-width: 0; padding: 14px 14px 12px; border: 0; border-radius: 18px; background: var(--frame); color: var(--on-frame); text-align: left; cursor: pointer; box-shadow: var(--shadow); transform: rotate(var(--tilt, 0deg)); transition: transform .16s ease; }
.gcard:active { transform: rotate(0deg) scale(.97); }
@media (hover: hover) { .gcard:hover { transform: rotate(0deg) translateY(-2px); } }
.gname { font: 800 18px/1.15 var(--f-ui); text-wrap: balance; }
.gstate { max-width: 100%; padding: 5px 10px; border-radius: 999px; background: var(--paper); color: var(--ink-soft); font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gstate.mine { color: var(--c); box-shadow: inset 0 0 0 2px var(--c); }
.crumbs { display: flex; margin-bottom: -4px; }
.pill.back { background: var(--paper); border-color: transparent; box-shadow: var(--shadow); }
.page.enter { animation: enter .26s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* quattro in fila */
.c4 { display: block; width: 100%; height: auto; }
.hole { fill: var(--paper-2); stroke: var(--print); stroke-width: 2; pointer-events: none; }
.disc { pointer-events: none; }
.disc circle { fill: var(--c); fill-opacity: .9; }
.disc.drop { animation: c4drop .44s cubic-bezier(.4, 0, .6, 1.35) both; }
@keyframes c4drop { from { transform: translateY(var(--dy)); } to { transform: none; } }
.col-hit { fill: transparent; cursor: pointer; }
@media (hover: hover) { .col-hit:hover { fill: var(--print); fill-opacity: .1; } }
.pen.win { stroke-width: 6; }

/* sos */
.sosg { display: block; width: 100%; height: auto; }
.sosg .print { stroke-width: 2; }
.sos-ch { font-family: var(--f-hand); font-size: 34px; fill: var(--c); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.cell-hit { fill: transparent; cursor: pointer; }
@media (hover: hover) { .cell-hit:hover { fill: var(--print); fill-opacity: .1; } }
.sos-line { stroke-width: 4; opacity: .85; }
.letter-btn { width: 54px; height: 48px; border-radius: 12px; border: 2px solid var(--paper-2); background: transparent; color: var(--c); font: 400 30px/1 var(--f-hand); cursor: pointer; }
.letter-btn[aria-pressed="true"] { border-color: var(--c); background: var(--paper-2); }

/* indovina il numero */
.numg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.ncol { min-width: 0; }
.ncol-h { margin-bottom: 6px; font-size: 13px; font-weight: 800; color: var(--c); }
.nrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1.5px dashed var(--paper-2); }
.ndig { font: 400 24px/1 var(--f-hand); letter-spacing: .12em; color: var(--c); }
.nfb { display: inline-flex; gap: 3px; flex: none; }
.nfb i, .nlegend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; }
.nfb .b, .nlegend .dotb { background: var(--ink); }
.nfb .c, .nlegend .dotc { box-shadow: inset 0 0 0 2px var(--ink); }
.nfb .z { background: var(--paper-2); }
.nempty { margin: 0; color: var(--muted); font-size: 14px; }
.nlegend { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 2px 0 0; font-size: 13px; color: var(--ink-soft); }
.nlegend span { display: inline-flex; align-items: center; gap: 6px; }
.controls > .numpad, .controls > .dom-form { flex: 1 1 100%; }
.numpad { display: grid; gap: 12px; }
.slots4 { display: flex; justify-content: center; gap: 10px; }
.slots4 span { width: 46px; height: 56px; display: grid; place-items: end center; padding-bottom: 4px; border-bottom: 3px solid var(--print); font: 400 38px/1 var(--f-hand); color: var(--c); }
.keypad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.key2 { height: 50px; border: 2px solid var(--paper-2); border-radius: 12px; background: transparent; color: var(--ink); font: 800 20px/1 var(--f-ui); cursor: pointer; font-variant-numeric: tabular-nums; }
.key2:disabled { opacity: .3; cursor: default; }
.btn:disabled { opacity: .4; cursor: default; }

/* battaglia navale */
.navig { display: grid; justify-items: center; gap: 8px; }
.sea-h { justify-self: stretch; margin: 6px 0 0; font-size: 13px; font-weight: 800; color: var(--ink-soft); }
.sea { display: block; width: 100%; max-width: 380px; height: auto; }
.sea.mine { max-width: 230px; }
.sea .lab { font: 700 12px/1 var(--f-ui); fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
.sea .print { stroke-width: 1.5; }
.ship { fill: var(--c); fill-opacity: .16; stroke: var(--c); stroke-width: 3; }
.ship.sunk { fill-opacity: .34; }
.miss { fill: var(--print); opacity: .6; transform-box: fill-box; transform-origin: center; }
.shot-hit { stroke-width: 4.5; }
.sea-hit { fill: transparent; cursor: pointer; }
@media (hover: hover) { .sea-hit:hover { fill: var(--print); fill-opacity: .14; } }

/* domanda della buonanotte */
.domc { display: grid; gap: 14px; }
.dom-q { margin: 0; font: 400 27px/1.25 var(--f-hand); color: var(--ink); text-wrap: balance; }
.dom-ans { display: grid; gap: 10px; }
.ans { padding: 10px 12px; border-radius: 12px; background: var(--paper-2); }
.ans .who { font-size: 12px; font-weight: 800; color: var(--c, var(--ink-soft)); }
.ans p { margin: 4px 0 0; font: 400 21px/1.3 var(--f-hand); color: var(--c, var(--ink)); white-space: pre-wrap; overflow-wrap: anywhere; }
textarea.line-input { resize: none; min-height: 3.6em; font-size: 22px; }
.dom-hist { font-size: 14px; color: var(--ink-soft); }
.dom-hist summary { cursor: pointer; font-weight: 700; }
.hq { margin: 12px 0 2px; font-weight: 700; color: var(--ink); }
.ha { margin: 0; font: 400 18px/1.35 var(--f-hand); color: var(--c); overflow-wrap: anywhere; }

/* the wheel */
.spin { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px 16px; background: var(--scrim); }
.spin-box { width: min(100%, 360px); display: grid; justify-items: center; gap: 14px; }
.spin-title { margin: 0; color: #FFFFFF; font: 800 22px/1.2 var(--f-ui); text-align: center; text-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
.reel-window { position: relative; width: 100%; height: 252px; overflow: hidden; border-radius: 22px; background: var(--paper); box-shadow: var(--shadow); -webkit-mask-image: linear-gradient(transparent, #000 24%, #000 76%, transparent); mask-image: linear-gradient(transparent, #000 24%, #000 76%, transparent); }
.reel { will-change: transform; }
.rcard { height: 84px; padding: 7px 14px; }
.rcard span { display: grid; place-items: center; height: 100%; border-radius: 16px; background: var(--frame); color: var(--on-frame); font: 800 22px/1 var(--f-ui); }
.reel-window::after { content: ""; position: absolute; left: 8px; right: 8px; top: 84px; height: 84px; border-radius: 20px; box-shadow: inset 0 0 0 3px var(--ink); pointer-events: none; }
.spin.done .rcard.win span { animation: winpop .7s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes winpop { 0% { transform: scale(1); } 45% { transform: scale(1.12); } 100% { transform: scale(1.05); } }
@media (prefers-reduced-motion: reduce) {
  .disc.drop, .page.enter, .spin.done .rcard.win span { animation: none; }
}

/* bigger call window for a sharp picture */
.call.big { width: min(calc(100vw - 16px), 560px); }
.call.big .call-video { max-height: 72dvh; }
/* long game names wrap instead of squeezing the score */
.page-head h2 { flex: 1 1 auto; min-width: 0; line-height: 1.1; text-wrap: balance; }
.page-head .score { flex: none; }
</style>
</head>

  <header class="cover">
    <div>
      <h1>Blocchetto della buonanotte</h1>
      <div class="cover-actions">
        <button class="pill call-pill" id="call-btn" type="button" data-act="call"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.5" width="13" height="11" rx="2.5"/><path d="M15.5 11l6-3.5v9l-6-3.5"/></svg><span id="call-btn-label">Chiama</span></button>
        <button class="pill" id="open-sheet" type="button" data-act="open-sheet">Impostazioni</button>

</div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" integrity="sha384-AQ3POAMqIhwS81FrUH95ekxqBZHeP5tG2JfEL3+7GuTtfRLWnrRh32UxwzM+//A9" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js" integrity="sha384-1/m+A1jVWbD3yiK3/vtFvm1+LjK1WLpSoDY+Kaxppwn/yP9BVSgdHTNQVOjrzUO5" crossorigin="anonymous"></script>
<script id="logic">
const Game = (() => {
  const SYMS = ['x', 'o', 's', 'h', 'n', 'f', 'l', 'u'];
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const MAX_WRONG = 6;
  const SIZES = [3, 4, 5, 6];
  const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  const INVISIBLE = /[\u0000-\u001f\u007f-\u009f\u00ad\u200b\u200c\u200e\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g;

  const other = s => (s === 'a' ? 'b' : 'a');
  const isSeat = s => s === 'a' || s === 'b';
  const seatOr = (s, d) => (isSeat(s) ? s : d);
  const clone = o => JSON.parse(JSON.stringify(o));
  const setAt = (str, i, ch) => str.slice(0, i) + ch + str.slice(i + 1);
  const int = (v, d) => (typeof v === 'number' && Number.isFinite(v) ? Math.trunc(v) : d);
  const intIn = (v, lo, hi, d) => { const n = int(v, d); return n >= lo && n <= hi ? n : d; };
  const blankPlayer = s => ({ id: null, nick: '', sym: s === 'a' ? 'x' : 'o' });

  function cleanText(raw, max) {
    const s = String(raw == null ? '' : raw).replace(/[\t\n\r]/g, ' ').replace(INVISIBLE, '').replace(/\s+/g, ' ').trim();
    return Array.from(s).filter(ch => !(ch.length === 1 && ch >= '\ud800' && ch <= '\udfff')).slice(0, max).join('').trim();
  }

  // Secret words keep only A-Z, spaces, apostrophes and hyphens; accents are dropped (PERCHÉ -> PERCHE).
  function normWord(raw) {
    return String(raw == null ? '' : raw)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toUpperCase()
      .replace(/[\u2018\u2019\u0060\u00b4]/g, "'")
      .replace(/[^A-Z' -]/g, '')
      .replace(/\s+/g, ' ')
      .replace(/-{2,}/g, '-')
      .replace(/'{2,}/g, "'")
      .trim()
      .slice(0, 24)
      .trim();
  }

  // Not secure, just not readable at a glance in shared data.
  function enc(word) {
    let s = '';
    for (let i = 0; i < word.length; i++) s += String.fromCharCode(word.charCodeAt(i) ^ 23);
    return btoa(s).split('').reverse().join('');
  }
  function dec(code) {
    try {
      const b = atob(String(code || '').split('').reverse().join(''));
      let s = '';
      for (let i = 0; i < b.length; i++) s += String.fromCharCode(b.charCodeAt(i) ^ 23);
      return s && normWord(s) === s ? s : '';
    } catch (e) {
      return '';
    }
  }

  function emptyQua(R, C, first, n) {
    return { R, C, h: '0'.repeat((R + 1) * C), v: '0'.repeat(R * (C + 1)), bx: '0'.repeat(R * C), turn: first, first, last: '', mk: 0, n };
  }
  function emptyBoard(first) {
    return { c: ['', '', '', '', '', '', '', '', ''], f: first };
  }
  function fresh() {
    return {
      v: 1, rev: 0, ts: 0, by: '',
      players: { a: blankPlayer('a'), b: blankPlayer('b') },
      score: { imp: { a: 0, b: 0 }, qua: { a: 0, b: 0 }, tris: { a: 0, b: 0 } },
      imp: { phase: 'setup', setter: 'a', w: '', hint: '', g: '', n: 1 },
      qua: emptyQua(4, 4, 'a', 1),
      tris: { boards: [emptyBoard('a')], page: 1, lm: -1 },
    };
  }

  function impView(imp) {
    const word = imp.phase === 'play' ? dec(imp.w) : '';
    const set = new Set(word.replace(/[^A-Z]/g, ''));
    const wrong = [];
    for (const ch of imp.g) if (!set.has(ch)) wrong.push(ch);
    const lost = wrong.length >= MAX_WRONG;
    let won = set.size > 0 && !lost;
    if (won) for (const ch of set) if (!imp.g.includes(ch)) { won = false; break; }
    return { word, set, wrong, won, lost, over: imp.phase === 'play' && (won || lost), guesser: other(imp.setter) };
  }

  function trisResult(c) {
    for (const ln of LINES) {
      const s = c[ln[0]] ? c[ln[0]][0] : '';
      if (s && c[ln[1]] && c[ln[1]][0] === s && c[ln[2]] && c[ln[2]][0] === s) return { win: s, line: ln };
    }
    return c.every(Boolean) ? { draw: true } : null;
  }
  function trisTurn(b) {
    return b.c.filter(Boolean).length % 2 === 0 ? b.f : other(b.f);
  }
  function trisActive(t) {
    const i = t.boards.length - 1;
    return i < 0 || trisResult(t.boards[i].c) ? -1 : i;
  }

  function quaCount(q) {
    let a = 0, b = 0;
    for (const ch of q.bx) { if (ch === 'a') a++; else if (ch === 'b') b++; }
    return { a, b };
  }
  const quaOver = q => !q.bx.includes('0');
  const quaStarted = q => /[ab]/.test(q.h) || /[ab]/.test(q.v);
  function edgeBoxes(q, k, i) {
    const R = q.R, C = q.C, out = [];
    if (k === 'h') {
      const r = Math.floor(i / C), c = i % C;
      if (r > 0) out.push((r - 1) * C + c);
      if (r < R) out.push(r * C + c);
    } else {
      const r = Math.floor(i / (C + 1)), c = i % (C + 1);
      if (c > 0) out.push(r * C + c - 1);
      if (c < C) out.push(r * C + c);
    }
    return out;
  }
  function boxClosed(q, b) {
    const C = q.C, r = Math.floor(b / C), c = b % C;
    return q.h[r * C + c] !== '0' && q.h[(r + 1) * C + c] !== '0' && q.v[r * (C + 1) + c] !== '0' && q.v[r * (C + 1) + c + 1] !== '0';
  }

  function turnOf(S, g) {
    if (g === 'imp') {
      const v = impView(S.imp);
      if (v.over) return null;
      return S.imp.phase === 'setup' ? S.imp.setter : v.guesser;
    }
    if (g === 'qua') return quaOver(S.qua) ? null : S.qua.turn;
    if (g === 'tris') {
      const i = trisActive(S.tris);
      return i < 0 ? null : trisTurn(S.tris.boards[i]);
    }
    return null;
  }

  // Every change goes through here: returns the next state, or null when the move is not allowed.
  function apply(S, a) {
    if (!S || !a || typeof a !== 'object') return null;
    const N = clone(S);
    const s = a.seat;
    switch (a.t) {
      case 'seat': {
        if (!isSeat(s) || typeof a.id !== 'string' || !a.id || N.players[s].id === a.id) return null;
        const o = other(s);
        if (N.players[o].id === a.id) N.players[o] = blankPlayer(o);
        N.players[s] = { id: a.id, nick: '', sym: blankPlayer(s).sym };
        return N;
      }
      case 'free': {
        if (!isSeat(s) || !isSeat(a.which) || !N.players[a.which].id) return null;
        N.players[a.which] = blankPlayer(a.which);
        return N;
      }
      case 'nick': {
        if (!isSeat(s)) return null;
        const nick = cleanText(a.nick, 16);
        if (N.players[s].nick === nick) return null;
        N.players[s].nick = nick;
        return N;
      }
      case 'sym': {
        if (!isSeat(s) || !SYMS.includes(a.sym) || N.players[s].sym === a.sym) return null;
        N.players[s].sym = a.sym;
        return N;
      }
      case 'scores0': {
        if (!isSeat(s)) return null;
        N.score = fresh().score;
        return N;
      }
      case 'imp.set': {
        const imp = N.imp;
        if (imp.phase !== 'setup' || s !== imp.setter) return null;
        const word = normWord(a.word);
        if (word.replace(/[^A-Z]/g, '').length < 2) return null;
        N.imp = { phase: 'play', setter: imp.setter, w: enc(word), hint: cleanText(a.hint, 40), g: '', n: imp.n };
        return N;
      }
      case 'imp.swap': {
        if (!isSeat(s) || N.imp.phase !== 'setup') return null;
        N.imp.setter = other(N.imp.setter);
        return N;
      }
      case 'imp.cancel': {
        const v = impView(N.imp);
        if (N.imp.phase !== 'play' || v.over || s !== N.imp.setter) return null;
        N.imp = { phase: 'setup', setter: N.imp.setter, w: '', hint: '', g: '', n: N.imp.n + 1 };
        return N;
      }
      case 'imp.guess': {
        const imp = N.imp, v = impView(imp);
        if (imp.phase !== 'play' || v.over || s !== v.guesser) return null;
        const ch = typeof a.ch === 'string' ? a.ch : '';
        if (ch.length !== 1 || !LETTERS.includes(ch) || imp.g.includes(ch)) return null;
        imp.g += ch;
        const after = impView(imp);
        if (after.won) N.score.imp[after.guesser] += 1;
        else if (after.lost) N.score.imp[imp.setter] += 1;
        return N;
      }
      case 'imp.next': {
        if (!isSeat(s) || !impView(N.imp).over) return null;
        N.imp = { phase: 'setup', setter: other(N.imp.setter), w: '', hint: '', g: '', n: N.imp.n + 1 };
        return N;
      }
      case 'qua.line': {
        const q = N.qua;
        if (quaOver(q) || s !== q.turn) return null;

    for (let b = 0; b < q.bx.length; b++) {

      if (o === '0') continue;
      const r = Math.floor(b / q.C), c = b % q.C;
      boxes += `<text class="ini${freshBoxes.has(b) ? ' pop' : ''}" x="${X(c) + s / 2}" y="${Y(r) + s / 2 + 2}" style="--c:var(--pen-${o})">${esc(initialOf(o))}</text>`;
    }
    const edge = (k, i, x1, y1, x2, y2) => {
      const o = (k === 'h' ? q.h : q.v)[i];
      if (o !== '0') {
        const isLast = q.last === k + i;
        lines += `<path class="pen edge-line${isLast ? ' last' : ''}${isLast && anim ? ' fresh' : ''}" pathLength="1" style="--c:var(--pen-${o})" d="${penLine(x1, y1, x2, y2, 'e' + q.n + k + i)}"/>`;
      } else if (playable) {
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, hs = s / 2;
        hits += `<g class="edge" data-act="line" data-k="${k}" data-i="${i}"><polygon class="hit" points="${mx - hs},${my} ${mx},${my - hs} ${mx + hs},${my} ${mx},${my + hs}"/><line class="ghost" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="--c:var(--pen-${q.turn})"/></g>`;
      }
    };
    for (let r = 0; r <= q.R; r++) for (let c = 0; c < q.C; c++) edge('h', r * q.C + c, X(c), Y(r), X(c + 1), Y(r));
    for (let r = 0; r < q.R; r++) for (let c = 0; c <= q.C; c++) edge('v', r * (q.C + 1) + c, X(c), Y(r), X(c), Y(r + 1));
    for (let r = 0; r <= q.R; r++) for (let c = 0; c <= q.C; c++) dots += `<circle class="dot" cx="${X(c)}" cy="${Y(r)}" r="3.6"/>`;
    const label = `Griglia ${q.R} per ${q.C}: ${cnt.a} quadratini a ${esc(nameOf('a'))}, ${cnt.b} a ${esc(nameOf('b'))}`;
    const board = `<div class="card"><svg class="dots" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${boxes}${lines}${hits}${dots}</svg></div>`;

    const tally = `<span class="tally" aria-hidden="true"><span style="--c:var(--pen-a)">${esc(initialOf('a'))} ${cnt.a}</span><span style="--c:var(--pen-b)">${esc(initialOf('b'))} ${cnt.b}</span></span>`;
    let status;
    if (over) status = cnt.a === cnt.b ? `Pari, ${cnt.a} a ${cnt.b}.` : `Ha vinto ${inkName(cnt.a > cnt.b ? 'a' : 'b')}, ${Math.max(cnt.a, cnt.b)} a ${Math.min(cnt.a, cnt.b)}.`;
    else if (q.mk && q.last) status = seat === q.turn ? 'Quadratino! Ancora tu.' : `Quadratino! Gioca ancora ${inkName(q.turn)}.`;
    else status = turnLine(q.turn);
    status += ' ' + tally;

    let controls = '';
    if (canManage() && (over || !started)) {
      controls = `<div class="seg" role="group" aria-label="${over ? 'Nuova partita' : 'Grandezza della griglia'}"><span class="seg-label">${over ? 'Nuova partita:' : 'Griglia:'}</span>` +
        G.SIZES.map(k => `<button class="chipbtn" type="button" data-act="size" data-size="${k}" aria-pressed="${!over && q.R === k}">${k}×${k}</button>`).join('') +
        '</div>';
    } else if (canManage() && started && !over) {
      controls = ui.confirm === 'qua'
        ? '<span class="ask">Ricominciamo?</span><button class="btn small" type="button" data-act="qua-restart">Sì</button><button class="btn small ghost" type="button" data-act="cancel">No</button>'
        : '<button class="btn ghost small" type="button" data-act="ask-qua">Ricomincia</button>';
    }
    return { board, status, controls };
  }

  function winLine(line, s, key, fresh) {
    const cx = i => 50 + (i % 3) * 100, cy = i => 50 + Math.floor(i / 3) * 100;
    let x1 = cx(line[0]), y1 = cy(line[0]), x2 = cx(line[2]), y2 = cy(line[2]);
    const len = Math.hypot(x2 - x1, y2 - y1), ex = (x2 - x1) / len * 34, ey = (y2 - y1) / len * 34;
    x1 -= ex; y1 -= ey; x2 += ex; y2 += ey;
    return `<svg class="win-line" viewBox="0 0 300 300" aria-hidden="true"><path class="pen${fresh ? ' fresh' : ''}" pathLength="1" style="--c:var(--pen-${s})" d="${penLine(x1, y1, x2, y2, key)}"/></svg>`;
  }

  function viewTris(anim) {
    const t = S.tris, active = G.trisActive(t);
    const turn = active >= 0 ? G.trisTurn(t.boards[active]) : null;
    const playable = active >= 0 && canAct(turn);
    const lastBoard = t.lm >= 0 ? Math.floor(t.lm / 9) : -1;
    let board = '<div class="tgrid">';
    for (let bi = 0; bi < 6; bi++) {
      const b = t.boards[bi];
      if (!b) {
        board += `<div class="tb future" aria-hidden="true"><div class="cells">${'<div class="cell"></div>'.repeat(9)}</div></div>`;
        continue;
      }
      const res = G.trisResult(b.c), isActive = bi === active;
      board += `<div class="tb${isActive ? ' active' : ''}"${isActive ? ' role="group" aria-label="Partita in corso"' : ''}><div class="cells">`;
      for (let i = 0; i < 9; i++) {
        const v = b.c[i];
        if (!v && isActive && playable) board += `<button class="cell" type="button" data-act="tris" data-i="${i}" aria-label="Casella ${i + 1}"></button>`;
        else board += `<div class="cell">${v ? symSVG(v[1], v[0], `c${t.page}-${bi}-${i}`, anim && t.lm === bi * 9 + i) : ''}</div>`;
      }
      board += '</div>';
      if (res && res.win) board += winLine(res.line, res.win, `w${t.page}-${bi}`, anim && lastBoard === bi);
      board += '</div>';
    }
    board += '</div>';

    let status = '';
    const doneIdx = active >= 0 ? active - 1 : t.boards.length - 1;
    const prev = doneIdx >= 0 ? t.boards[doneIdx] : null;
    const prevRes = prev ? G.trisResult(prev.c) : null;
    if (prevRes && (active < 0 || !t.boards[active].c.some(Boolean))) status = prevRes.win ? `Tris di ${inkName(prevRes.win)}! ` : 'Patta! ';
    status += active < 0 ? 'Pagina finita.' : turnLine(turn);

    let controls = '';
    if (active < 0 && canManage()) controls += '<button class="btn" type="button" data-act="page">Volta pagina</button>';
    if (seat) controls += symPicker(seat, 'Il tuo segno');
    return { board, status, controls };
  }

  /* ---------- new games ---------- */
  function yourMove(g, s) {
    if (Game2.EXTRA.includes(g)) return Game2.yourMove(S, g, s);
    const t = G.turnOf(S, g);
    return t ? t === s : null;
  }
  function restartCtl(g) {
    return ui.confirm === 'restart-' + g
      ? `<span class="ask">Ricominciamo?</span><button class="btn small" type="button" data-act="restart" data-g="${g}">Sì</button><button class="btn small ghost" type="button" data-act="cancel">No</button>`
      : `<button class="btn ghost small" type="button" data-act="ask-restart" data-g="${g}">Ricomincia</button>`;
  }
  const tallyOf = (a, b) => `<span class="tally" aria-hidden="true"><span style="--c:var(--pen-a)">${esc(initialOf('a'))} ${a}</span><span style="--c:var(--pen-b)">${esc(initialOf('b'))} ${b}</span></span>`;
  const coord = (i, n) => 'ABCDEFGH'[i % n] + (Math.floor(i / n) + 1);

  function viewC4(anim) {
    const q = S.c4, R = Game2.C4R, C = Game2.C4C, res = Game2.c4Result(q.cells);
    const playable = !res && canAct(q.turn);
    const s = 50, W = C * s, H = R * s;
    let hits = '', holes = '', pieces = '';
    if (playable) {
      for (let c = 0; c < C; c++) if (q.cells[c] === '0') hits += `<rect class="col-hit" data-act="c4" data-col="${c}" x="${c * s}" y="-4" width="${s}" height="${H + 8}"/>`;
    }
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        const i = r * C + c, o = q.cells[i], cx = c * s + s / 2, cy = r * s + s / 2;
        holes += `<circle class="hole" cx="${cx}" cy="${cy}" r="19"/>`;
        if (o !== '0') {
          const fresh = anim && q.last === i;
          pieces += `<g class="disc${fresh ? ' drop' : ''}" style="--c:var(--pen-${o});--dy:${-(cy + s)}px"><circle cx="${cx}" cy="${cy}" r="17"/><path class="pen thin" d="${penCircle(cx, cy, 17.5, 'c4' + q.n + i)}"/></g>`;
        }
      }
    }
    let line = '';
    if (res && res.win) {
      const p = i => [(i % C) * s + s / 2, Math.floor(i / C) * s + s / 2];
      const [x1, y1] = p(res.line[0]), [x2, y2] = p(res.line[3]);
      line = `<path class="pen win${anim ? ' fresh' : ''}" pathLength="1" style="--c:var(--ink)" d="${penLine(x1, y1, x2, y2, 'c4w' + q.n)}"/>`;
    }
    const board = `<div class="card"><svg class="c4" viewBox="-4 -4 ${W + 8} ${H + 8}" role="img" aria-label="Quattro in fila">${hits}${holes}${pieces}${line}</svg></div>`;
    let status;
    if (res && res.win) status = res.win === seat ? 'Quattro in fila! Hai vinto.' : `Quattro in fila di ${inkName(res.win)}.`;
    else if (res) status = 'Pari, la griglia è piena.';
    else status = turnLine(q.turn);
    let controls = '';
    if (res && canManage()) controls = '<button class="btn" type="button" data-act="new" data-g="c4">Nuova partita</button>';
    else if (canManage() && /[ab]/.test(q.cells)) controls = restartCtl('c4');
    return { board, status, controls };
  }

  function viewSos(anim) {
    const q = S.sos, N = Game2.SN, over = Game2.sosOver(q), playable = !over && canAct(q.turn);
    const s = 50, W = N * s;
    let grid = '', hits = '', letters = '', lines = '';
    for (let k = 1; k < N; k++) grid += `M${k * s} 4 V${W - 4} M4 ${k * s} H${W - 4} `;
    for (let i = 0; i < N * N; i++) {
      const ch = q.cells[i], r = Math.floor(i / N), c = i % N, cx = c * s + s / 2, cy = r * s + s / 2;
      if (ch !== '.') letters += `<text class="sos-ch${anim && q.last === i ? ' pop' : ''}" x="${cx}" y="${cy + 2}" style="--c:var(--pen-${q.by[i]})">${ch}</text>`;
      else if (playable) hits += `<rect class="cell-hit" data-act="sos" data-i="${i}" x="${c * s}" y="${r * s}" width="${s}" height="${s}"/>`;
    }
    const pt = i => [(i % N) * s + s / 2, Math.floor(i / N) * s + s / 2];
    q.lines.forEach((l, k) => {
      let [x1, y1] = pt(l[0]), [x2, y2] = pt(l[2]);
      const len = Math.hypot(x2 - x1, y2 - y1) || 1, ex = (x2 - x1) / len * 14, ey = (y2 - y1) / len * 14;
      x1 -= ex; y1 -= ey; x2 += ex; y2 += ey;
      const fresh = anim && q.mk && k >= q.lines.length - q.mk;
      lines += `<path class="pen sos-line${fresh ? ' fresh' : ''}" pathLength="1" style="--c:var(--pen-${l[3]})" d="${penLine(x1, y1, x2, y2, 'sl' + q.n + k)}"/>`;
    });
    const board = `<div class="card"><svg class="sosg" viewBox="0 0 ${W} ${W}" role="img" aria-label="SOS">${hits}<path class="print" d="${grid}"/>${lines}${letters}</svg></div>`;
    let status;
    if (over) status = q.pts.a === q.pts.b ? `Pari, ${q.pts.a} a ${q.pts.b}.` : `Ha vinto ${inkName(q.pts.a > q.pts.b ? 'a' : 'b')}, ${Math.max(q.pts.a, q.pts.b)} a ${Math.min(q.pts.a, q.pts.b)}.`;
    else if (q.mk) status = seat === q.turn ? 'SOS! Ancora tu.' : `SOS! Gioca ancora ${inkName(q.turn)}.`;
    else status = turnLine(q.turn);
    status += ' ' + tallyOf(q.pts.a, q.pts.b);
    let controls = '';
    if (!over && canManage()) {
      controls += `<div class="seg" role="group" aria-label="Lettera da scrivere"><span class="seg-label">Scrivi</span>` +
        ['S', 'O'].map(ch => `<button class="letter-btn" type="button" data-act="sos-letter" data-ch="${ch}" aria-pressed="${ui.sosCh === ch}" style="--c:var(--pen-${seat})">${ch}</button>`).join('') + '</div>';
      if (/[SO]/.test(q.cells)) controls += restartCtl('sos');
    }
    if (over && canManage()) controls = '<button class="btn" type="button" data-act="new" data-g="sos">Nuova partita</button>';
    return { board, status, controls };
  }

  function numPad(label, okLabel) {
    const d = ui.numDraft;
    let h = `<div class="numpad"><div class="slots4" aria-label="${label}: ${d.split('').join(' ') || 'vuoto'}" style="--c:var(--pen-${seat})">`;
    for (let k = 0; k < 4; k++) h += `<span>${d[k] || ''}</span>`;
    h += '</div><div class="keypad">';
    for (const k of ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0']) h += `<button class="key2" type="button" data-act="num-key" data-d="${k}"${d.includes(k) || d.length >= 4 ? ' disabled' : ''}>${k}</button>`;
    h += `</div><div class="row"><button class="btn" type="button" data-act="num-ok"${d.length === 4 ? '' : ' disabled'}>${okLabel}</button><button class="btn ghost" type="button" data-act="num-del"${d ? '' : ' disabled'}>Cancella</button></div></div>`;
    return h;
  }
  function viewNum(anim) {
    const q = S.num, o = other(), lastIdx = q.guesses.length - 1;
    const col = s2 => {
      let h = `<div class="ncol" style="--c:var(--pen-${s2})"><div class="ncol-h">${s2 === seat ? 'I tuoi tentativi' : 'Tentativi di ' + esc(nameOf(s2))}</div>`;
      let any = false;
      q.guesses.forEach((g, k) => {
        if (g[0] !== s2) return;
        any = true;
        h += `<div class="nrow${anim && k === lastIdx ? ' pop' : ''}"><span class="ndig">${g[1]}</span><span class="nfb" role="img" aria-label="${g[2]} al posto giusto, ${g[3]} spostate">${'<i class="b"></i>'.repeat(g[2])}${'<i class="c"></i>'.repeat(g[3])}${'<i class="z"></i>'.repeat(4 - g[2] - g[3])}</span></div>`;
      });
      if (!any) h += '<p class="nempty">Ancora nessuno</p>';
      return h + '</div>';
    };
    const board = `<div class="card numg">${col(seat)}${col(o)}<p class="nlegend"><span><i class="dotb"></i> cifra al posto giusto</span><span><i class="dotc"></i> cifra giusta ma spostata</span></p></div>`;
    const mine = Game2.show(q.sec[seat]);
    let status, controls = '';
    if (q.phase === 'setup') {
      if (!q.sec[seat]) {
        status = 'Scegli il tuo numero segreto: 4 cifre, tutte diverse.';
        if (canManage()) controls = numPad('Il tuo numero', 'Fatto');
      } else {
        status = `Il tuo numero è <span class="reveal">${esc(mine)}</span>. ${inkName(o)} sta scegliendo il suo…`;
      }
    } else if (q.phase === 'play') {
      if (canAct(q.turn)) {
        status = 'Tocca a te: prova un numero.';
        controls = numPad('Il tuo tentativo', 'Prova');
      } else {
        status = turnLine(q.turn) + ` <span class="count">Il tuo numero: ${esc(mine)}</span>`;
      }
      if (canManage()) controls += restartCtl('num');
    } else {
      const theirs = Game2.show(q.sec[o]);
      status = q.win === seat ? `Indovinato! Il numero di ${inkName(o)} era <span class="reveal">${esc(theirs)}</span>.` : `${inkName(q.win)} ha indovinato il tuo numero, <span class="reveal">${esc(mine)}</span>.`;
      if (canManage()) controls = '<button class="btn" type="button" data-act="new" data-g="num">Nuova partita</button>';
    }
    return { board, status, controls };
  }

  function seaSVG(opts) {
    const NV = Game2.NV, s = 40, m = 22, W = NV * s;
    let h = `<svg class="sea${opts.mine ? ' mine' : ''}" viewBox="${-m} ${-m} ${W + m + 4} ${W + m + 4}" role="img" aria-label="${opts.label}">`;
    for (let k = 0; k < NV; k++) h += `<text class="lab" x="${k * s + s / 2}" y="${-m / 2}">${'ABCDEFGH'[k]}</text><text class="lab" x="${-m / 2}" y="${k * s + s / 2}">${k + 1}</text>`;
    let grid = '';
    for (let k = 0; k <= NV; k++) grid += `M${k * s} 0 V${W} M0 ${k * s} H${W} `;
    if (opts.tap) for (let i = 0; i < NV * NV; i++) if (opts.shots[i] === '0') h += `<rect class="sea-hit" data-act="navi-shot" data-i="${i}" x="${(i % NV) * s}" y="${Math.floor(i / NV) * s}" width="${s}" height="${s}"/>`;
    h += `<path class="print" d="${grid}"/>`;
    (opts.ships || []).forEach((sh, k) => {
      const rows = sh.map(i => Math.floor(i / NV)), cols = sh.map(i => i % NV);
      const x = Math.min(...cols) * s + 5, y = Math.min(...rows) * s + 5, w = (Math.max(...cols) - Math.min(...cols) + 1) * s - 10, hh = (Math.max(...rows) - Math.min(...rows) + 1) * s - 10;
      h += `<rect class="ship${opts.sunk && opts.sunk[k] ? ' sunk' : ''}" x="${x}" y="${y}" width="${w}" height="${hh}" rx="14" style="--c:var(--pen-${opts.owner})"/>`;
    });
    for (let i = 0; i < NV * NV; i++) {
      const v = opts.shots[i];
      if (v === '0') continue;
      const cx = (i % NV) * s + s / 2, cy = Math.floor(i / NV) * s + s / 2, fresh = opts.fresh === i;
      if (v === 'm') h += `<circle class="miss${fresh ? ' pop' : ''}" cx="${cx}" cy="${cy}" r="5"/>`;
      else h += `<path class="pen shot-hit${fresh ? ' fresh' : ''}" pathLength="1" style="--c:var(--pen-${opts.shooter})" d="${penLine(cx - 11, cy - 11, cx + 11, cy + 11, 'h' + i + opts.shooter)} ${penLine(cx + 11, cy - 11, cx - 11, cy + 11, 'k' + i + opts.shooter)}"/>`;
    }
    return h + '</svg>';
  }
  function viewNavi(anim) {
    const q = S.navi, o = other(), NV = Game2.NV;
    const placed = Game2.fleetOf(q, seat);
    if (q.phase === 'setup' && !placed && !ui.naviDraft) ui.naviDraft = Game2.randomFleet(Math.random);
    const myShips = placed || ui.naviDraft || [];
    const enemy = q.phase !== 'setup' ? Game2.fleetOf(q, o) : null;
    const enemySunk = enemy ? Game2.sunkList(enemy, q.shots[seat]) : [];
    const mySunk = Game2.sunkList(myShips, q.shots[o]);
    const freshMine = anim && q.last && q.last.s === seat ? q.last.i : -1;
    const freshTheirs = anim && q.last && q.last.s === o ? q.last.i : -1;
    let board = '<div class="card navig">';
    if (q.phase === 'setup') {
      board += `<p class="sea-h">Il tuo mare</p>${seaSVG({ label: 'Le tue navi', ships: myShips, owner: seat, shots: '0'.repeat(NV * NV), shooter: o })}`;
    } else {
      board += `<p class="sea-h">Il mare di ${esc(nameOf(o))}</p>`;
      board += seaSVG({ label: 'Il mare dove spari', ships: enemy ? enemy.filter((_, k) => enemySunk[k] || q.phase === 'over') : [], sunk: enemy ? enemy.map(() => true) : [], owner: o, shots: q.shots[seat], shooter: seat, tap: q.phase === 'play' && canAct(q.turn), fresh: freshMine });
      board += `<p class="sea-h">Il tuo mare</p>${seaSVG({ label: 'Le tue navi', mine: true, ships: myShips, sunk: mySunk, owner: seat, shots: q.shots[o], shooter: o, fresh: freshTheirs })}`;
    }
    board += '</div>';
    const shotText = last => {
      const fleet = last.s === seat ? enemy : myShips;
      const shots = q.shots[last.s];
      if (shots[last.i] !== 'h') return 'acqua';
      const ship = fleet && fleet.find(sh => sh.includes(last.i));
      return ship && ship.every(i => shots[i] === 'h') ? 'colpita e affondata' : 'colpita';
    };
    let status, controls = '';
    if (q.phase === 'setup') {
      if (!placed) {
        status = 'Ecco le tue navi. Rimescola finché ti piacciono, poi premi «Pronto».';
        if (canManage()) controls = '<button class="btn" type="button" data-act="navi-ready">Pronto</button><button class="btn ghost" type="button" data-act="navi-shuffle">Rimescola</button>';
      } else {
        status = `Navi pronte. ${inkName(o)} sta disponendo le sue…`;
        if (canManage()) controls = '<button class="btn ghost small" type="button" data-act="navi-shuffle">Rimescola le mie navi</button>';
      }
    } else if (q.phase === 'play') {
      const pre = q.last ? (q.last.s === seat ? `${coord(q.last.i, NV)}: ${shotText(q.last)}! ` : `${esc(nameOf(o))} ha sparato in ${coord(q.last.i, NV)}: ${shotText(q.last)}. `) : '';
      status = pre + (canAct(q.turn) ? 'Tocca a te: spara nel mare di ' + inkName(o) + '.' : turnLine(q.turn));
      if (canManage()) controls = restartCtl('navi');
    } else {
      status = q.win === seat ? `Hai affondato tutta la flotta di ${inkName(o)}!` : `${inkName(q.win)} ha affondato tutta la tua flotta.`;
      if (canManage()) controls = '<button class="btn" type="button" data-act="new" data-g="navi">Nuova partita</button>';
    }
    return { board, status, controls };
  }

  function viewDom() {
    const d = S.dom, o = other(), q = Game2.QUESTIONS[d.q];
    const mine = Game2.show(d.ans[seat]), theirs = Game2.show(d.ans[o]);
    const both = !!(d.ans.a && d.ans.b);
    let board = `<div class="card domc"><p class="dom-q">${esc(q)}</p>`;
    if (both) {
      board += `<div class="dom-ans"><div class="ans" style="--c:var(--pen-${seat})"><span class="who">${esc(nameOf(seat))}</span><p>${esc(mine)}</p></div><div class="ans" style="--c:var(--pen-${o})"><span class="who">${esc(nameOf(o))}</span><p>${esc(theirs)}</p></div></div>`;
    } else if (d.ans[seat]) {
      board += `<div class="dom-ans"><div class="ans" style="--c:var(--pen-${seat})"><span class="who">La tua risposta</span><p>${esc(mine)}</p></div></div>`;
    }
    if (d.hist.length) {
      board += '<details class="dom-hist"><summary>Le domande delle altre sere</summary>';
      d.hist.slice(0, 5).forEach(h => {
        const [ha, hb] = [Game2.show(h[1]), Game2.show(h[2])];
        board += `<p class="hq">${esc(Game2.QUESTIONS[h[0]])}</p><p class="ha" style="--c:var(--pen-a)">${esc(nameOf('a'))}: ${esc(ha)}</p><p class="ha" style="--c:var(--pen-b)">${esc(nameOf('b'))}: ${esc(hb)}</p>`;
      });
      board += '</details>';
    }
    board += '</div>';
    let status, controls = '';
    if (both) {
      status = 'Ecco le vostre risposte.';
      if (canManage()) controls = '<button class="btn" type="button" data-act="dom-next">Un’altra domanda</button>';
    } else if (d.ans[seat]) {
      status = `Aspettiamo la risposta di ${inkName(o)}.`;
    } else {
      status = d.ans[o] ? `${inkName(o)} ha già risposto. Le risposte si vedono quando rispondi anche tu.` : 'Scrivi la tua risposta: la vedrete insieme quando avete risposto tutti e due.';
      if (canManage()) {
        controls = `<form id="dom-form" class="form dom-form" autocomplete="off" novalidate><label class="lbl" for="dom-text">La tua risposta</label><textarea class="line-input" id="dom-text" name="text" rows="3" maxlength="280" enterkeyhint="send"></textarea><p id="dom-err" class="err" role="alert"></p><div class="row"><button class="btn" type="submit">Invia</button>${d.ans[o] ? '' : '<button class="btn ghost" type="button" data-act="dom-skip">Cambia domanda</button>'}</div></form>`;
      }
    }
    return { board, status, controls };
  }

  /* ---------- index of games and the random wheel ---------- */
  const TILTS = [-1.4, 1.1, 0.8, -1, 1.3, -0.7, -1.2, 0.9];
  const DICE = '<svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="24" height="24" rx="6"/><circle cx="11" cy="11" r="1.7" fill="currentColor"/><circle cx="21" cy="11" r="1.7" fill="currentColor"/><circle cx="16" cy="16" r="1.7" fill="currentColor"/><circle cx="11" cy="21" r="1.7" fill="currentColor"/><circle cx="21" cy="21" r="1.7" fill="currentColor"/></svg>';
  function cardState(g) {
    const m = synced ? yourMove(g, seat) : undefined;
    if (m === true) return { text: g === 'dom' ? 'Rispondi' : 'Tocca a te', mine: true };
    if (m === false) return { text: g === 'dom' ? 'Hai risposto' : `Tocca a ${nameOf(other())}`, mine: false };
    if (m === null) return { text: g === 'dom' ? 'Risposte pronte' : 'Partita finita', mine: false };
    return { text: '…', mine: false };
  }
  function homeHTML() {
    let h = `<button class="spin-btn" type="button" data-act="spin"${ui.spinning || !synced ? ' disabled' : ''}>${DICE}Gira la ruota</button><div class="cards">`;
    GAMES.forEach((g, k) => {
      const st = cardState(g);
      h += `<button class="gcard" type="button" data-act="open" data-g="${g}" data-game="${g}" style="--tilt:${TILTS[k]}deg"><span class="gname">${TITLES[g]}</span><span class="gstate${st.mine ? ' mine' : ''}" style="--c:var(--pen-${seat})">${esc(st.text)}</span></button>`;
    });
    return h + '</div>';
  }

  let actx = null;
  function audio() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume().catch(() => {});
      return actx;
    } catch (e) {
      return null;
    }
  }
  function blip(freq, dur, vol, type) {
    const c = audio();
    if (!c || c.state !== 'running') return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  const tick = () => blip(1500, 0.035, 0.07, 'triangle');
  const chime = () => { blip(784, 0.3, 0.13); setTimeout(() => blip(1175, 0.45, 0.13), 130); };
  document.addEventListener('pointerdown', () => { audio(); }, { passive: true });

  const REEL_H = 84;
  let lastPickKey = null, spinPending = null;
  const pickKey = p => (p ? `${p.n}:${p.g}:${p.by}` : '');
  // Both phones land on the same game: the pick travels through Firebase, the spin is only the show.
  function checkPick() {
    if (lastPickKey === null || !S.pick || !S.pick.n) return;
    const key = pickKey(S.pick);
    if (key === lastPickKey) return;
    lastPickKey = key;
    if (Math.abs(Date.now() - S.pick.at) > 20000 || !GAMES.includes(S.pick.g)) return;
    spin(S.pick.g, S.pick.by);
  }
  function startSpin() {
    if (ui.spinning || !synced) return;
    audio();
    const choices = GAMES.filter(g => g !== S.pick.g);
    const g = choices[Math.floor(Math.random() * choices.length)];
    if (act({ t: 'pick', seat, g })) {
      lastPickKey = pickKey(S.pick);
      spin(g, seat);
    }
  }
  function spin(target, by) {
    if (ui.spinning) { spinPending = { target, by }; return; }
    ui.spinning = true;
    const el = $('#spin'), reel = $('#reel');
    $('#spin-title').textContent = by === seat ? 'Si gioca a…' : `${nameOf(by)} ha girato la ruota…`;
    const len = GAMES.length, start = Math.floor(Math.random() * len), ti = GAMES.indexOf(target);
    const F = 4 * len + ((ti - start + len) % len);
    let h = '';
    for (let k = -1; k <= F + 1; k++) {
      const g = GAMES[(((start + k) % len) + len) % len];
      h += `<div class="rcard" data-game="${g}"><span>${TITLES[g]}</span></div>`;
    }
    reel.innerHTML = h;
    el.classList.remove('done');
    el.hidden = false;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const T = reduce ? 0 : 3600, t0 = performance.now();
    let lastTick = 0;
    const place = idx => { reel.style.transform = `translate3d(0, ${(-idx * REEL_H).toFixed(2)}px, 0)`; };
    const land = () => {
      place(F);
      const win = reel.children[F + 1];
      if (win) win.classList.add('win');
      el.classList.add('done');
      chime();
      setTimeout(() => {
        el.hidden = true;
        reel.innerHTML = '';
        ui.spinning = false;
        if (spinPending) {
          const p = spinPending;
          spinPending = null;
          spin(p.target, p.by);
        } else {
          setTab(target, true);
        }
      }, 1400);
    };
    const frame = now => {
      const t = T ? Math.min(1, (now - t0) / T) : 1;
      const idx = (1 - Math.pow(1 - t, 4)) * F;
      place(idx);
      const near = Math.round(idx);
      if (near !== lastTick) { lastTick = near; if (t < 1) tick(); }
      if (t < 1) requestAnimationFrame(frame);
      else land();
    };
    place(0);
    requestAnimationFrame(frame);
    render();
  }

  function pickQuestion() {
    const used = new Set([S.dom.q].concat(S.dom.hist.map(h => h[0])));
    const all = Game2.QUESTIONS.map((_, i) => i);
    const free = all.filter(i => !used.has(i));
    const pool = free.length ? free : all.filter(i => i !== S.dom.q);
    return pool[Math.floor(Math.random() * pool.length)];
  }
  const VIEWS = { imp: viewImp, qua: viewQua, tris: viewTris, c4: viewC4, sos: viewSos, num: viewNum, navi: viewNavi, dom: viewDom };

  function whoHTML() {
    const o = other(), name = esc(nameOf(o)), t = partnerTabNow();
    let text = `${name} non c’è`;
    if (!synced) text = 'Mi collego…';
    else if (partnerHere()) text = t ? `${name} è ${WHERE[t]}` : `${name} c’è`;
    return `<span class="chip${partnerHere() ? ' here' : ''}" style="--c:var(--pen-${o})"><span class="inkdot"></span><span class="nm">${text}</span></span>`;
  }

  function noteHTML() {
    if (netError) return `<span>${esc(netError)}</span>`;
    if (synced && !partnerHere() && store.get('blocchetto.met.' + code) !== '1') {
      return `<button class="btn small" type="button" data-act="share">Manda il link a ${esc(nameOf(other()))}</button>`;
    }
    return '';
  }

  function setHTML(el, html) {
    if (el._html === html) return;
    const focused = document.activeElement;
    const keep = focused && el.contains(focused) && focused.id && focused.tagName === 'INPUT'
      ? { id: focused.id, s: focused.selectionStart, e: focused.selectionEnd } : null;
    const vals = {};
    el.querySelectorAll('input[id]').forEach(i => { vals[i.id] = i.value; });
    el.innerHTML = html;
    el._html = html;
    for (const id in vals) {
      const i = document.getElementById(id);
      if (i && el.contains(i)) { i.value = vals[id]; i.dataset.init = '1'; }
    }
    if (keep) {
      const i = document.getElementById(keep.id);
      if (i) { i.focus({ preventScroll: true }); try { i.setSelectionRange(keep.s, keep.e); } catch (e) { /* not a text field */ } }
    }
  }

  function renderSheet() {
    const el = $('#sheet');
    el.hidden = !ui.sheet;
    if (!ui.sheet) { el.innerHTML = ''; el._html = ''; return; }
    const o = other();
    let h = '<div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">';
    h += '<div class="sheet-head"><h3 id="sheet-title">Impostazioni</h3><button class="btn small" type="button" data-act="close-sheet">Fatto</button></div>';
    h += `<section class="seat" style="--c:var(--pen-${seat})"><label class="lbl" for="nick-${seat}">Il tuo nome</label><input class="line-input" id="nick-${seat}" data-nick="${seat}" type="text" maxlength="16" autocomplete="off" enterkeyhint="done">`;
    h += symPicker(seat, 'Il tuo segno nel tris') + '</section>';
    h += `<section class="seat"><div class="seat-top">Link per ${esc(nameOf(o))}</div><input class="link-box" id="link-box" type="text" readonly value="${esc(inviteLink())}" aria-label="Link per ${esc(nameOf(o))}"><div class="row"><button class="btn small" type="button" data-act="share">Manda</button><button class="btn small ghost" type="button" data-act="copy">Copia</button></div></section>`;
    h += '<section class="seat">';
    if (ui.confirm === 'scores') {
      h += '<p class="ask">Azzero tutti i punteggi?</p><div class="row"><button class="btn small" type="button" data-act="do-reset">Azzera</button><button class="btn small ghost" type="button" data-act="cancel">No</button></div>';
    } else if (ui.confirm === 'switch') {
      h += `<p class="ask">Allora sei ${esc(nameOf(o))}?</p><div class="row"><button class="btn small" type="button" data-act="do-switch">Sì</button><button class="btn small ghost" type="button" data-act="cancel">No</button></div>`;
    } else {
      h += `<div class="row"><button class="btn small ghost" type="button" data-act="ask-reset">Azzera i punteggi</button><button class="btn small ghost" type="button" data-act="ask-switch">Non sono ${esc(nameOf(seat))}</button></div>`;
    }
    h += '</section></div>';
    setHTML(el, h);
    const inp = document.getElementById('nick-' + seat);
    if (inp && inp.dataset.init !== '1') { inp.value = nameOf(seat); inp.dataset.init = '1'; }
  }

  function renderGate() {
    const g = $('#gate');
    g.hidden = !!seat;
    if (seat) return;
    setHTML(g, '<div class="gate-card"><h2>Chi sei?</h2>' +
      '<button class="who-btn" type="button" data-act="iam" data-seat="a" style="--c:var(--pen-a)"><span class="inkdot"></span>Gabri</button>' +
      '<button class="who-btn" type="button" data-act="iam" data-seat="b" style="--c:var(--pen-b)"><span class="inkdot"></span>Ivi</button></div>');
  }

  function render() {
    renderGate();
    if (!seat) return;
    setHTML($('#who'), whoHTML());
    const home = tab === 'home';
    $('#home').hidden = !home;
    $('#crumbs').hidden = home;
    $('#page').hidden = home;
    if (home) {
      setHTML($('#home'), homeHTML());
    } else {
      const sig = JSON.stringify(S[tab]);
      let anim = false;
      if (seen.imp === undefined) { for (const g of GAMES) seen[g] = JSON.stringify(S[g]); }
      else if (seen[tab] !== sig) { seen[tab] = sig; animSig = tab + sig; animUntil = Date.now() + 900; anim = true; }
      else if (animSig === tab + sig && Date.now() < animUntil) anim = true;
      $('#page').dataset.game = tab;
      $('#page-title').textContent = TITLES[tab];
      const v = VIEWS[tab](anim);
      $('#page-score').hidden = tab === 'dom';
      setHTML($('#page-score'), scoreHTML(tab));
      setHTML($('#board'), v.board);
      setHTML($('#status'), v.status);
      setHTML($('#controls'), v.controls);
      $('#controls').hidden = !v.controls;
    }
    const note = noteHTML();
    setHTML($('#note'), note);
    $('#note').hidden = !note;
    renderSheet();
    renderCall();
  }

  /* ---------- input ---------- */
  function setTab(t) {
    if (!(t === 'home' || GAMES.includes(t)) || t === tab) return;
    tab = t;
    ui.confirm = '';
    store.set('blocchetto.tab', t);
    updatePresence();
    render();
    window.scrollTo(0, 0);
    if (t !== 'home') {
      const p = $('#page');
      p.classList.remove('enter');
      void p.offsetWidth;
      p.classList.add('enter');
    }
  }
  function openSheet() {
    ui.sheet = true;
    ui.confirm = '';
    renderSheet();
    const b = $('#sheet [data-act="close-sheet"]');
    if (b) b.focus();
  }
  function closeSheet() {
    ui.sheet = false;
    ui.confirm = '';
    render();
    $('#open-sheet').focus();
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) {
      if (e.target.id === 'sheet') closeSheet();
      return;
    }
    if (el.disabled) return;
    const A = el.getAttribute('data-act');
    switch (A) {
      case 'iam':
        seat = seatOr(el.getAttribute('data-seat'));
        rememberSeat();
        load();
        render();
        startSync();
        startNet();
        break;
      case 'tab': setTab(el.getAttribute('data-tab')); break;
      case 'open-sheet': openSheet(); break;
      case 'close-sheet': closeSheet(); break;
      case 'share': shareInvite(); break;
      case 'copy': copyInvite(); break;
      case 'call': startCall(); break;
      case 'answer': answerCall(); break;
      case 'decline': declineCall(); break;
      case 'hangup': hangup(); break;
      case 'mic':
        micOn = !micOn;
        if (localStream) localStream.getAudioTracks().forEach(t => { t.enabled = micOn; });
        renderCall();
        break;
      case 'cam':
        camOn = !camOn;
        if (localStream) localStream.getVideoTracks().forEach(t => { t.enabled = camOn; });
        renderCall();
        break;
      case 'call-size':
        bigCall = !bigCall;
        pos.x = null;
        renderCall();
        break;
      case 'tap-audio':
        $('#remote').play().then(() => { needTap = false; renderCall(); }).catch(() => {});
        break;
      case 'home': setTab('home'); break;
      case 'open': setTab(el.getAttribute('data-g')); break;
      case 'spin': startSpin(); break;
      case 'new': {
        const g = el.getAttribute('data-g');
        if (g === 'navi') ui.naviDraft = null;
        act({ t: g + '.new', seat });
        break;
      }
      case 'ask-restart': ui.confirm = 'restart-' + el.getAttribute('data-g'); render(); break;
      case 'restart': {
        const g = el.getAttribute('data-g');
        ui.confirm = '';
        if (g === 'navi') ui.naviDraft = null;
        act({ t: g + '.new', seat, force: true });
        render();
        break;
      }
      case 'c4': act({ t: 'c4.drop', seat, col: Number(el.getAttribute('data-col')) }); break;
      case 'sos-letter': ui.sosCh = el.getAttribute('data-ch') === 'O' ? 'O' : 'S'; render(); break;
      case 'sos': act({ t: 'sos.play', seat, i: Number(el.getAttribute('data-i')), ch: ui.sosCh }); break;
      case 'num-key': {
        const d = el.getAttribute('data-d');
        if (ui.numDraft.length < 4 && !ui.numDraft.includes(d)) { ui.numDraft += d; render(); }
        break;
      }
      case 'num-del': ui.numDraft = ui.numDraft.slice(0, -1); render(); break;
      case 'num-ok': {
        const t = S.num.phase === 'setup' ? 'num.secret' : 'num.guess';
        if (act({ t, seat, code: ui.numDraft })) { ui.numDraft = ''; render(); }
        break;
      }
      case 'navi-shuffle':
        ui.naviDraft = Game2.randomFleet(Math.random);
        if (Game2.fleetOf(S.navi, seat)) act({ t: 'navi.place', seat, ships: ui.naviDraft });
        else render();
        break;
      case 'navi-ready': if (ui.naviDraft) act({ t: 'navi.place', seat, ships: ui.naviDraft }); break;
      case 'navi-shot': act({ t: 'navi.shot', seat, i: Number(el.getAttribute('data-i')) }); break;
      case 'dom-next': act({ t: 'dom.next', seat, q: pickQuestion() }); break;
      case 'dom-skip': act({ t: 'dom.skip', seat, q: pickQuestion() }); break;
      case 'guess': act({ t: 'imp.guess', seat, ch: el.getAttribute('data-ch') }); break;
      case 'imp-swap': act({ t: 'imp.swap', seat }); break;
      case 'imp-next': act({ t: 'imp.next', seat }); break;
      case 'imp-cancel': act({ t: 'imp.cancel', seat }); break;
      case 'line': act({ t: 'qua.line', seat, k: el.getAttribute('data-k'), i: Number(el.getAttribute('data-i')) }); break;
      case 'size': act({ t: 'qua.new', seat, size: Number(el.getAttribute('data-size')) }); break;
      case 'ask-qua': ui.confirm = 'qua'; render(); break;
      case 'qua-restart': ui.confirm = ''; act({ t: 'qua.new', seat, size: S.qua.R, force: true }); render(); break;
      case 'tris': act({ t: 'tris.play', seat, i: Number(el.getAttribute('data-i')) }); break;
      case 'page': act({ t: 'tris.page', seat }); break;
      case 'sym': act({ t: 'sym', seat, sym: el.getAttribute('data-sym') }); break;
      case 'ask-reset': ui.confirm = 'scores'; renderSheet(); break;
      case 'ask-switch': ui.confirm = 'switch'; renderSheet(); break;
      case 'do-reset': ui.confirm = ''; act({ t: 'scores0', seat }); renderSheet(); break;
      case 'do-switch':
        seat = other();
        rememberSeat();
        location.reload();
        break;
      case 'cancel': ui.confirm = ''; render(); break;
      default: break;
    }
  });

  document.addEventListener('submit', e => {
    if (e.target.id === 'dom-form') {
      e.preventDefault();
      const txt = G.cleanText(e.target.elements.text.value, 280);
      if (!txt) { $('#dom-err').textContent = 'Scrivi qualcosa prima di inviare.'; return; }
      if (document.activeElement) document.activeElement.blur();
      act({ t: 'dom.answer', seat, text: txt });
      return;
    }
    if (e.target.id !== 'imp-form') return;
    e.preventDefault();
    const form = e.target;
    const word = G.normWord(form.elements.word.value);
    const err = $('#imp-err');
    if (word.replace(/[^A-Z]/g, '').length < 2) {
      err.textContent = 'Almeno due lettere, senza numeri.';
      form.elements.word.focus();
      return;
    }
    if (document.activeElement) document.activeElement.blur();
    if (!act({ t: 'imp.set', seat, word, hint: form.elements.hint.value })) err.textContent = 'Qualcosa non va, ricarica la pagina.';
  });

  document.addEventListener('change', e => {
    const s = e.target.getAttribute && e.target.getAttribute('data-nick');
    if (s && s === seat) act({ t: 'nick', seat, nick: e.target.value });
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && ui.sheet) { closeSheet(); return; }
    const tgt = e.target;
    if (ui.sheet || e.metaKey || e.ctrlKey || e.altKey) return;
    if (tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.isContentEditable)) return;
    if (tab === 'imp' && /^[a-zA-Z]$/.test(e.key)) {
      const v = G.impView(S.imp);
      if (S.imp.phase === 'play' && !v.over && canAct(v.guesser)) act({ t: 'imp.guess', seat, ch: e.key.toUpperCase() });
    }
  });

  if (seat) load();
  render();
  startSync();
  startNet();
})();
</script>
</body>
</html>
