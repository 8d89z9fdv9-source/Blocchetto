<style>
:root {
  /* Layout: a pocket game pad. Mint cover, three coloured tabs that tuck under the open page; each page is a coloured frame around rounded paper cards, marks drawn with a red and a blue felt-tip. */
  --bg: #D2ECDB;
  --ink: #1D2340;
  --ink-soft: #4A5270;
  --paper: #F7F5F0;
  --paper-2: #E9E5DC;
  --imp: #7066D4;
  --qua: #3570DA;
  --tris: #E0662C;
  --imp-print: #7066D4;
  --qua-print: #3570DA;
  --tris-print: #EE9B72;
  --pen-a: #D3312A;
  --pen-b: #233C9C;
  --on-frame: #FFFFFF;
  --live: #23935A;
  --muted: #8B90A0;
  --scrim: rgba(17, 22, 40, .45);
  --shadow: 0 1px 0 rgba(29, 35, 64, .05), 0 12px 26px -16px rgba(29, 35, 64, .45);
  --f-ui: "Figtree", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-hand: "Patrick Hand", "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101814; --ink: #E8ECF5; --ink-soft: #AAB2C6; --paper: #1E2332; --paper-2: #2B3144;
    --imp: #5A51BE; --qua: #2C5DB9; --tris: #B9552A;
    --imp-print: #A99FF5; --qua-print: #86A6F0; --tris-print: #C9774F;
    --pen-a: #FF8678; --pen-b: #9DB3FF; --on-frame: #FFFFFF; --live: #57D18F; --muted: #7F8699;
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 12px 26px -16px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101814; --ink: #E8ECF5; --ink-soft: #AAB2C6; --paper: #1E2332; --paper-2: #2B3144;
  --imp: #5A51BE; --qua: #2C5DB9; --tris: #B9552A;
  --imp-print: #A99FF5; --qua-print: #86A6F0; --tris-print: #C9774F;
  --pen-a: #FF8678; --pen-b: #9DB3FF; --on-frame: #FFFFFF; --live: #57D18F; --muted: #7F8699;
  --scrim: rgba(0, 0, 0, .6); --shadow: 0 12px 26px -16px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; touch-action: manipulation; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 40px;
  display: grid; gap: 16px;
}

/* cover */
.cover { display: grid; gap: 12px; }
.cover-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.cover h1 { margin: 0; font-size: clamp(27px, 7.4vw, 36px); font-weight: 800; line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance; }
.cover .sub { margin: 8px 0 0; font-size: 15px; color: var(--ink-soft); max-width: 32ch; }
.pill { flex: none; font: 700 14px/1 var(--f-ui); color: var(--ink); background: transparent; border: 2px solid var(--ink); border-radius: 999px; padding: 9px 13px; cursor: pointer; }
@media (hover: hover) { .pill:hover { background: var(--ink); color: var(--bg); } }
.who { display: flex; flex-wrap: wrap; gap: 8px; min-height: 32px; }
.chip { display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: 100%; padding: 6px 12px 6px 9px; border-radius: 999px; background: var(--paper); font-size: 14px; font-weight: 700; box-shadow: var(--shadow); }
.chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip .state { font-weight: 500; color: var(--ink-soft); white-space: nowrap; }
.inkdot { width: 11px; height: 11px; border-radius: 50%; background: var(--c); flex: none; }
.chip.here .inkdot { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--live); }

/* tabs tucked under the page */
.book { display: grid; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.tabs { position: relative; z-index: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; margin-bottom: -18px; padding-inline: 4px; }
.tab {
  position: relative; border: 0; border-radius: 14px 14px 8px 8px; padding: 13px 6px 30px;
  color: var(--on-frame); font: 800 16px/1.1 var(--f-ui); letter-spacing: .01em; cursor: pointer;
  transform: translateY(8px) rotate(var(--tilt)); transition: transform .2s ease; box-shadow: var(--shadow);
}
.tab[aria-selected="true"] { transform: none; }
.tab-imp { background: var(--imp); --tilt: -2deg; }
.tab-qua { background: var(--qua); --tilt: 1.5deg; }
.tab-tris { background: var(--tris); --tilt: -1deg; }
.tab .badge { position: absolute; top: -6px; right: -4px; width: 17px; height: 17px; border-radius: 50%; background: var(--paper); box-shadow: 0 0 0 3px var(--c, var(--ink)); }

/* page */
.page { position: relative; z-index: 1; --frame: var(--imp); --print: var(--imp-print); background: var(--frame); border-radius: 22px; padding: 14px 12px 12px; display: grid; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
.page[data-game="qua"] { --frame: var(--qua); --print: var(--qua-print); }
.page[data-game="tris"] { --frame: var(--tris); --print: var(--tris-print); }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px; min-width: 0; }
.page-head h2 { margin: 0; color: var(--on-frame); font-size: 21px; font-weight: 800; flex: none; }
.score { display: inline-flex; align-items: center; gap: 8px; min-width: 0; padding: 6px 12px; border-radius: 999px; background: var(--paper); font-weight: 700; font-size: 14px; }
.sc-n { color: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; max-width: 7.5em; }
.sc-p { font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
.sc-sep { margin: 0 3px; color: var(--muted); }
.card { background: var(--paper); border-radius: 16px; padding: 16px; min-width: 0; }
.panel { background: var(--paper); border-radius: 16px; padding: 14px 16px; display: grid; gap: 12px; min-width: 0; }
.status { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.4; text-wrap: pretty; }
.ink-name { color: var(--c); font-weight: 800; }
.count { display: inline-block; margin-left: 4px; font-size: 14px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.reveal { font-family: var(--f-hand); font-size: 21px; letter-spacing: .05em; }
.tally { display: inline-flex; gap: 12px; margin-left: 6px; font-family: var(--f-hand); font-size: 21px; font-weight: 400; vertical-align: -1px; }
.tally span { color: var(--c); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.note { margin: 0; padding: 0 4px; font-size: 14px; color: var(--ink-soft); text-wrap: pretty; }

/* buttons */
.btn { font: 700 16px/1 var(--f-ui); padding: 13px 20px; border-radius: 999px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.small { padding: 9px 14px; font-size: 14px; }
@media (hover: hover) { .btn:hover { filter: brightness(1.1); } }
.seg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.seg-label { font-size: 14px; font-weight: 700; color: var(--ink-soft); margin-right: 4px; }
.chipbtn { font: 700 15px/1 var(--f-ui); padding: 10px 13px; border-radius: 999px; border: 2px solid var(--paper-2); background: transparent; cursor: pointer; font-variant-numeric: tabular-nums; }
.chipbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.symbtn { width: 44px; height: 44px; padding: 7px; border-radius: 12px; border: 2px solid transparent; background: transparent; cursor: pointer; }
.symbtn svg { width: 100%; height: 100%; display: block; overflow: visible; }
.symbtn[aria-pressed="true"] { border-color: var(--ink); background: var(--paper-2); }

/* pen and print */
.pen { fill: none; stroke: var(--c, var(--ink)); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.pen.thin { stroke-width: 2.6; }
.pen.sym { stroke-width: 7; }
.pen.edge-line { stroke-width: 3.6; }
.pen.edge-line.last { stroke-width: 5.2; }
.print { fill: none; stroke: var(--print); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.fresh { animation: draw .5s cubic-bezier(.3, .7, .4, 1) both; }
.win-line .fresh { animation-delay: .35s; }
@keyframes draw {
  0% { stroke-dasharray: 1 1; stroke-dashoffset: 1; }
  99% { stroke-dasharray: 1 1; stroke-dashoffset: 0; }
  100% { stroke-dasharray: none; stroke-dashoffset: 0; }
}
.pop { animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both; transform-box: fill-box; transform-origin: center; display: inline-block; }
@keyframes pop { from { opacity: 0; transform: scale(.4) rotate(-12deg); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .fresh, .pop { animation: none; }
  .tab { transition: none; }
}

/* hangman */
.hang { display: grid; justify-items: center; gap: 14px; }
.gallows { width: min(100%, 250px); height: auto; overflow: visible; }
.hint { margin: -6px 0 0; font-family: var(--f-hand); font-size: 21px; color: var(--ink-soft); text-align: center; }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; max-width: 100%; font-size: var(--fs, 32px); }
.slots .w { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.slot { width: 1.05em; height: 1.35em; border-bottom: 3px solid var(--print); display: grid; place-items: end center; font-family: var(--f-hand); line-height: 1; padding-bottom: .06em; }
.punct { font-family: var(--f-hand); line-height: 1.35; }
.ch { color: var(--c); }
.ch.ghost { color: var(--muted); opacity: .55; }
.ch.miss { color: var(--muted); }
.slots.empty { width: min(100%, 260px); height: 1.3em; border-bottom: 3px dashed var(--print); opacity: .6; }
.abc { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 2px 4px; }
.abc.waiting .key:not(.used) { opacity: .55; }
.key { position: relative; height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--print); font: 800 20px/1 var(--f-ui); cursor: pointer; }
.key:disabled { cursor: default; }
.key.used { color: var(--muted); }
.key.hit { color: var(--ink); }
.key .mark { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); overflow: visible; pointer-events: none; }
@media (hover: hover) { .key:not(:disabled):hover { background: var(--paper-2); } }

/* dots and boxes */
.dots { display: block; width: 100%; height: auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.dot { fill: var(--print); pointer-events: none; }
.ini { font-family: var(--f-hand); font-size: 34px; fill: var(--c); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.edge { cursor: pointer; }
.edge .hit { fill: transparent; }
.edge .ghost { stroke: var(--c); stroke-width: 4; stroke-linecap: round; opacity: 0; transition: opacity .12s; }
@media (hover: hover) { .edge:hover .ghost { opacity: .4; } }

/* tic-tac-toe */
.tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tb { position: relative; aspect-ratio: 1 / 1; border-radius: 14px; background: var(--paper); }
.tb.future { opacity: .5; }
.tb.active { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--ink); }
.cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); border-radius: 14px; overflow: hidden; }
.cell { display: grid; place-items: center; min-width: 0; min-height: 0; padding: 14%; border: 0; border-right: 2px solid var(--print); border-bottom: 2px solid var(--print); background: transparent; }
.cell:nth-child(3n) { border-right: 0; }
.cell:nth-child(n+7) { border-bottom: 0; }
button.cell { cursor: pointer; }
@media (hover: hover) { button.cell:hover { background: var(--paper-2); } }
.cell svg { width: 100%; height: 100%; display: block; overflow: visible; }
.win-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.win-line .pen { stroke-width: 6; }

/* forms and the names sheet */
.form { display: grid; gap: 10px; }
.lbl { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
.opt { font-weight: 500; }
.line-input { width: 100%; font: 25px/1.2 var(--f-hand); color: var(--ink); background: transparent; border: 0; border-bottom: 3px solid var(--print, var(--ink-soft)); border-radius: 0; padding: 4px 2px 6px; letter-spacing: .04em; }
.line-input:focus { outline: none; border-bottom-color: var(--ink); }
.line-input::placeholder { color: var(--muted); opacity: 1; }
.line-input.secret { -webkit-text-security: disc; }
.err { margin: 0; min-height: 1.2em; color: var(--pen-a); font-size: 14px; font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.sheet {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: end center; background: var(--scrim);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
@media (min-width: 640px) { .sheet { place-items: center; } }
.sheet-card { width: min(100%, 480px); max-height: calc(100% - 8px); overflow: auto; background: var(--paper); border-radius: 22px; padding: 18px; display: grid; gap: 16px; box-shadow: var(--shadow); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h3 { margin: 0; font-size: 22px; font-weight: 800; }
.seat { display: grid; gap: 8px; padding-top: 14px; border-top: 2px solid var(--paper-2); }
.seat-top { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.seat-top .tag { font-weight: 600; color: var(--ink-soft); font-size: 14px; }
.seat-name { margin: 0; font-family: var(--f-hand); font-size: 24px; color: var(--c); }
.ask { margin: 0; font-weight: 600; }

/* iPhone: safe areas, no zoom on double tap, no text selection while playing */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { min-height: 100dvh; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); touch-action: manipulation; }
.book, .tabs, .call, .ring, .gate { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.cover-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.pill { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; }
.pill svg { width: 18px; height: 18px; flex: none; }
.pill.call-pill { background: var(--ink); color: var(--bg); }
.note .row { margin-top: 10px; }

/* the call window: dark on purpose, it frames a camera picture */
.call { position: fixed; z-index: 40; left: 0; top: 0; width: 132px; border-radius: 18px; overflow: hidden; background: #0E1220; box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .55); touch-action: none; }
.call.big { width: min(calc(100vw - 24px), 440px); }
.call-video { position: relative; aspect-ratio: 3 / 4; background: #0E1220; }
.call.big .call-video { max-height: 62dvh; width: 100%; }
.call video { display: block; object-fit: cover; background: #0E1220; }
#remote { position: absolute; inset: 0; width: 100%; height: 100%; }
#local { position: absolute; right: 6px; bottom: 6px; width: 34%; aspect-ratio: 3 / 4; border-radius: 10px; transform: scaleX(-1); box-shadow: 0 0 0 2px rgba(255, 255, 255, .85); }
.call-msg { position: absolute; left: 8px; right: 8px; top: 8px; margin: 0; color: #FFFFFF; font-size: 13px; font-weight: 700; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); }
.tap-audio { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap; background: #FFFFFF; color: #0E1220; border-color: #FFFFFF; }
.call-bar { display: flex; justify-content: space-between; gap: 4px; padding: 6px; background: #0E1220; }
.call.big .call-bar { justify-content: center; gap: 14px; padding: 10px; }
.cbtn { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .16); color: #FFFFFF; cursor: pointer; }
.cbtn svg { width: 16px; height: 16px; }
.cbtn.off { background: #FFFFFF; color: #0E1220; }
.cbtn.end { background: #E5484D; }
.call.big .cbtn { width: 48px; height: 48px; }
.call.big .cbtn svg { width: 22px; height: 22px; }

.ring { position: fixed; z-index: 50; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%); width: min(calc(100vw - 24px), 420px); display: grid; gap: 12px; padding: 16px; border-radius: 20px; background: var(--paper); color: var(--ink); box-shadow: var(--shadow), 0 0 0 3px var(--c, var(--ink)); }
.ring p { margin: 0; font-size: 18px; font-weight: 800; }
.btn.ok { background: #1F9D57; border-color: #1F9D57; color: #FFFFFF; }

.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%); width: max-content; max-width: min(calc(100vw - 32px), 420px); padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 600; box-shadow: var(--shadow); }

.gate { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: var(--bg); padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.gate-card { width: min(100%, 400px); display: grid; gap: 14px; text-align: center; }
.gate h2 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
.gate p { margin: 0 0 6px; color: var(--ink-soft); }
.who-btn { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 20px; border: 0; border-radius: 18px; background: var(--paper); color: var(--c); font: 800 22px/1 var(--f-ui); box-shadow: var(--shadow); cursor: pointer; }
.who-btn .inkdot { width: 16px; height: 16px; }
.link-box { width: 100%; padding: 11px 12px; border: 2px solid var(--paper-2); border-radius: 12px; background: var(--bg); color: var(--ink); font: 600 16px/1.3 var(--f-ui); }

/* five more pages of the pad, each with its own colour */
:root {
  --c4: #17907A; --c4-print: #17907A;
  --sos: #C9467A; --sos-print: #C9467A;
  --num: #B07614; --num-print: #B07614;
  --navi: #22789C; --navi-print: #22789C;
  --dom: #3E3A8E; --dom-print: #5A55B8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --c4: #127462; --c4-print: #5FD0B6;
    --sos: #A3385F; --sos-print: #F08DB2;
    --num: #8C5F0E; --num-print: #F0BE5A;
    --navi: #1B5F7C; --navi-print: #7FC4E2;
    --dom: #302C72; --dom-print: #A9A5F2;
  }
}
:root[data-theme="dark"] {
  --c4: #127462; --c4-print: #5FD0B6;
  --sos: #A3385F; --sos-print: #F08DB2;
  --num: #8C5F0E; --num-print: #F0BE5A;
  --navi: #1B5F7C; --navi-print: #7FC4E2;
  --dom: #302C72; --dom-print: #A9A5F2;
}
[data-game="imp"] { --frame: var(--imp); --print: var(--imp-print); }
[data-game="qua"] { --frame: var(--qua); --print: var(--qua-print); }
[data-game="tris"] { --frame: var(--tris); --print: var(--tris-print); }
.page[data-game="c4"], [data-game="c4"] { --frame: var(--c4); --print: var(--c4-print); }
.page[data-game="sos"], [data-game="sos"] { --frame: var(--sos); --print: var(--sos-print); }
.page[data-game="num"], [data-game="num"] { --frame: var(--num); --print: var(--num-print); }
.page[data-game="navi"], [data-game="navi"] { --frame: var(--navi); --print: var(--navi-print); }
.page[data-game="dom"], [data-game="dom"] { --frame: var(--dom); --print: var(--dom-print); }

/* index */
.home { display: grid; gap: 16px; }
.spin-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 18px 20px; border: 0; border-radius: 20px; background: var(--ink); color: var(--bg); font: 800 20px/1 var(--f-ui); cursor: pointer; box-shadow: var(--shadow); transition: transform .12s ease; }
.spin-btn svg { width: 28px; height: 28px; flex: none; }
.spin-btn:active { transform: scale(.98); }
.spin-btn:disabled { opacity: .55; cursor: default; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
.gcard { display: grid; align-content: space-between; justify-items: start; gap: 18px; min-height: 108px; min-width: 0; padding: 14px 14px 12px; border: 0; border-radius: 18px; background: var(--frame); color: var(--on-frame); text-align: left; cursor: pointer; box-shadow: var(--shadow); transform: rotate(var(--tilt, 0deg)); transition: transform .16s ease; }
.gcard:active { transform: rotate(0deg) scale(.97); }
@media (hover: hover) { .gcard:hover { transform: rotate(0deg) translateY(-2px); } }
.gname { font: 800 18px/1.15 var(--f-ui); text-wrap: balance; }
.gstate { max-width: 100%; padding: 5px 10px; border-radius: 999px; background: var(--paper); color: var(--ink-soft); font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gstate.mine { color: var(--c); box-shadow: inset 0 0 0 2px var(--c); }
.crumbs { display: flex; margin-bottom: -4px; }
.pill.back { background: var(--paper); border-color: transparent; box-shadow: var(--shadow); }
.page.enter { animation: enter .26s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* quattro in fila */
.c4 { display: block; width: 100%; height: auto; }
.hole { fill: var(--paper-2); stroke: var(--print); stroke-width: 2; pointer-events: none; }
.disc { pointer-events: none; }
.disc circle { fill: var(--c); fill-opacity: .9; }
.disc.drop { animation: c4drop .44s cubic-bezier(.4, 0, .6, 1.35) both; }
@keyframes c4drop { from { transform: translateY(var(--dy)); } to { transform: none; } }
.col-hit { fill: transparent; cursor: pointer; }
@media (hover: hover) { .col-hit:hover { fill: var(--print); fill-opacity: .1; } }
.pen.win { stroke-width: 6; }

/* sos */
.sosg { display: block; width: 100%; height: auto; }
.sosg .print { stroke-width: 2; }
.sos-ch { font-family: var(--f-hand); font-size: 34px; fill: var(--c); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.cell-hit { fill: transparent; cursor: pointer; }
@media (hover: hover) { .cell-hit:hover { fill: var(--print); fill-opacity: .1; } }
.sos-line { stroke-width: 4; opacity: .85; }
.letter-btn { width: 54px; height: 48px; border-radius: 12px; border: 2px solid var(--paper-2); background: transparent; color: var(--c); font: 400 30px/1 var(--f-hand); cursor: pointer; }
.letter-btn[aria-pressed="true"] { border-color: var(--c); background: var(--paper-2); }

/* indovina il numero */
.numg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.ncol { min-width: 0; }
.ncol-h { margin-bottom: 6px; font-size: 13px; font-weight: 800; color: var(--c); }
.nrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1.5px dashed var(--paper-2); }
.ndig { font: 400 24px/1 var(--f-hand); letter-spacing: .12em; color: var(--c); }
.nfb { display: inline-flex; gap: 3px; flex: none; }
.nfb i, .nlegend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; }
.nfb .b, .nlegend .dotb { background: var(--ink); }
.nfb .c, .nlegend .dotc { box-shadow: inset 0 0 0 2px var(--ink); }
.nfb .z { background: var(--paper-2); }
.nempty { margin: 0; color: var(--muted); font-size: 14px; }
.nlegend { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 2px 0 0; font-size: 13px; color: var(--ink-soft); }
.nlegend span { display: inline-flex; align-items: center; gap: 6px; }
.controls > .numpad, .controls > .dom-form { flex: 1 1 100%; }
.numpad { display: grid; gap: 12px; }
.slots4 { display: flex; justify-content: center; gap: 10px; }
.slots4 span { width: 46px; height: 56px; display: grid; place-items: end center; padding-bottom: 4px; border-bottom: 3px solid var(--print); font: 400 38px/1 var(--f-hand); color: var(--c); }
.keypad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.key2 { height: 50px; border: 2px solid var(--paper-2); border-radius: 12px; background: transparent; color: var(--ink); font: 800 20px/1 var(--f-ui); cursor: pointer; font-variant-numeric: tabular-nums; }
.key2:disabled { opacity: .3; cursor: default; }
.btn:disabled { opacity: .4; cursor: default; }

/* battaglia navale */
.navig { display: grid; justify-items: center; gap: 8px; }
.sea-h { justify-self: stretch; margin: 6px 0 0; font-size: 13px; font-weight: 800; color: var(--ink-soft); }
.sea { display: block; width: 100%; max-width: 380px; height: auto; }
.sea.mine { max-width: 230px; }
.sea .lab { font: 700 12px/1 var(--f-ui); fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
.sea .print { stroke-width: 1.5; }
.ship { fill: var(--c); fill-opacity: .16; stroke: var(--c); stroke-width: 3; }
.ship.sunk { fill-opacity: .34; }
.miss { fill: var(--print); opacity: .6; transform-box: fill-box; transform-origin: center; }
.shot-hit { stroke-width: 4.5; }
.sea-hit { fill: transparent; cursor: pointer; }
@media (hover: hover) { .sea-hit:hover { fill: var(--print); fill-opacity: .14; } }

/* domanda della buonanotte */
.domc { display: grid; gap: 14px; }
.dom-q { margin: 0; font: 400 27px/1.25 var(--f-hand); color: var(--ink); text-wrap: balance; }
.dom-ans { display: grid; gap: 10px; }
.ans { padding: 10px 12px; border-radius: 12px; background: var(--paper-2); }
.ans .who { font-size: 12px; font-weight: 800; color: var(--c, var(--ink-soft)); }
.ans p { margin: 4px 0 0; font: 400 21px/1.3 var(--f-hand); color: var(--c, var(--ink)); white-space: pre-wrap; overflow-wrap: anywhere; }
textarea.line-input { resize: none; min-height: 3.6em; font-size: 22px; }
.dom-hist { font-size: 14px; color: var(--ink-soft); }
.dom-hist summary { cursor: pointer; font-weight: 700; }
.hq { margin: 12px 0 2px; font-weight: 700; color: var(--ink); }
.ha { margin: 0; font: 400 18px/1.35 var(--f-hand); color: var(--c); overflow-wrap: anywhere; }

/* the wheel */
.spin { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px 16px; background: var(--scrim); }
.spin-box { width: min(100%, 360px); display: grid; justify-items: center; gap: 14px; }
.spin-title { margin: 0; color: #FFFFFF; font: 800 22px/1.2 var(--f-ui); text-align: center; text-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
.reel-window { position: relative; width: 100%; height: 200px; overflow: hidden; border-radius: 22px; background: var(--paper); box-shadow: var(--shadow); -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
.reel { display: flex; width: max-content; height: 100%; will-change: transform; }
.rcard { flex: none; width: 150px; height: 100%; padding: 12px 7px; }
.rcard span { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: 100%; padding: 10px; border-radius: 18px; background: var(--frame); color: var(--on-frame); text-align: center; font: 800 17px/1.15 var(--f-ui); }
.reel-window::after { content: ""; position: absolute; top: 6px; bottom: 6px; left: calc(50% - 75px + 2px); width: 146px; border-radius: 22px; box-shadow: inset 0 0 0 3px var(--ink); pointer-events: none; }
.spin.done .rcard.win span { animation: winpop .7s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes winpop { 0% { transform: scale(1); } 45% { transform: scale(1.12); } 100% { transform: scale(1.05); } }
@media (prefers-reduced-motion: reduce) {
  .disc.drop, .page.enter, .spin.done .rcard.win span { animation: none; }
}

/* bigger call window for a sharp picture */
.call.big { width: min(calc(100vw - 16px), 560px); }
.call.big .call-video { max-height: 72dvh; }
/* long game names wrap instead of squeezing the score */
.page-head h2 { flex: 1 1 auto; min-width: 0; line-height: 1.1; text-wrap: balance; }
.page-head .score { flex: none; }

/* ships and the sea */
.boat { pointer-events: none; }
.boat .hull { fill: var(--c); fill-opacity: .2; stroke: var(--c); stroke-width: 2.6; stroke-linejoin: round; }
.boat .cabin { fill: var(--paper); stroke: var(--c); stroke-width: 2.2; stroke-linejoin: round; }
.boat .port { fill: var(--c); opacity: .75; }
.boat .hatch { fill: none; stroke: var(--c); stroke-width: 1.6; stroke-linecap: round; opacity: .55; }
.boat.sunk { opacity: .62; }
.sea .water { fill: var(--print); fill-opacity: .07; pointer-events: none; }
.sea .wave, .gart .wave, .rart .wave { fill: none; stroke: var(--print); stroke-width: 1.6; stroke-linecap: round; opacity: .5; pointer-events: none; }
.splash, .boom { pointer-events: none; transform-box: fill-box; transform-origin: center; }
.splash .drop { fill: var(--print); }
.splash .sring { fill: none; stroke: var(--print); stroke-width: 1.8; opacity: .7; }
.boom .burst { fill: var(--c); fill-opacity: .25; stroke: var(--c); stroke-width: 2.4; stroke-linejoin: round; }
.boom .core { fill: var(--c); }

/* little pictures */
.gcard { position: relative; min-height: 112px; }
.gname { padding-right: 34px; }
.gstate { max-width: 100%; }
.gart { position: absolute; right: -8px; top: -10px; width: 54px; height: 54px; padding: 3px; border-radius: 12px; background: var(--paper); box-shadow: 0 6px 12px -7px rgba(0, 0, 0, .45); transform: rotate(7deg); }
.gcard:nth-child(even) .gart { transform: rotate(-5deg); }
.gart svg, .rart svg { display: block; width: 100%; height: 100%; overflow: visible; }
:is(.gart, .rart) .mp { fill: none; stroke: var(--print); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
:is(.gart, .rart) .mi { fill: none; stroke: var(--c); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
:is(.gart, .rart) .mi.strike { stroke-width: 2; opacity: .8; }
:is(.gart, .rart) .md { fill: var(--print); }
:is(.gart, .rart) .mh { fill: none; stroke: var(--print); stroke-width: 1.8; }
:is(.gart, .rart) .mdisc { fill: var(--c); fill-opacity: .85; }
:is(.gart, .rart) .mt { font-family: var(--f-hand); font-size: 12px; fill: var(--c); text-anchor: middle; dominant-baseline: central; }
:is(.gart, .rart) .mt.big { font-size: 20px; }
:is(.gart, .rart) .mdot { fill: var(--ink); }
:is(.gart, .rart) .mring { fill: none; stroke: var(--ink); stroke-width: 2; }
.rart { display: block; flex: none; width: 74px; height: 74px; padding: 3px; border-radius: 14px; background: var(--paper); transform: rotate(-4deg); }
.rcard b { font-weight: 800; text-wrap: balance; }

/* squared paper under the games that sit on paper */
.page:is([data-game="imp"], [data-game="num"], [data-game="dom"], [data-game="c4"]) .card {
  background-image: linear-gradient(color-mix(in srgb, var(--print) 11%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--print) 11%, transparent) 1px, transparent 1px);
  background-size: 18px 18px;
  background-position: -1px -1px;
}
.disc circle { fill-opacity: 1; }
.hole { fill: var(--paper); }

/* how to play */
.rules { background: var(--paper); border-radius: 16px; padding: 12px 16px; }
.rules summary { display: flex; align-items: center; gap: 10px; font-weight: 800; cursor: pointer; list-style: none; }
.rules summary::-webkit-details-marker { display: none; }
.rules summary::before { content: "?"; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--frame); color: var(--on-frame); font-size: 15px; font-weight: 800; flex: none; }
.rules summary::after { content: "›"; margin-left: auto; font-size: 22px; line-height: 1; color: var(--ink-soft); transition: transform .2s ease; }
.rules[open] summary::after { transform: rotate(90deg); }
.rules p { margin: 10px 0 2px; font-size: 16px; line-height: 1.55; color: var(--ink-soft); text-wrap: pretty; }
.home-hint { margin: -6px 2px 0; font-size: 14px; color: var(--ink-soft); text-wrap: pretty; }
/* keep the index under the wheel's dark cover */
.home { position: relative; z-index: 0; isolation: isolate; }
.spin { isolation: isolate; }

/* tarocchi */
:root { --taro: #7A2C4E; --taro-print: #9A3B63; --t-red: #D3312A; --t-yel: #E8B23A; --t-blu: #3570DA; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --taro: #5C2139; --taro-print: #E59BBD; } }
:root[data-theme="dark"] { --taro: #5C2139; --taro-print: #E59BBD; }
.page[data-game="taro"], [data-game="taro"] { --frame: var(--taro); --print: var(--taro-print); }
.gcard[data-game="taro"] { grid-column: 1 / -1; min-height: 100px; }
:is(.gart, .rart) .mback { fill: var(--frame); stroke: var(--paper); stroke-width: 1.5; }
:is(.gart, .rart) .mcard { fill: var(--paper); }
.tback { display: block; aspect-ratio: 5 / 8; border: 0; padding: 0; border-radius: 8px; cursor: default;
  background:
    radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--paper) 90%, transparent) 0 12%, transparent 13%),
    repeating-linear-gradient(45deg, color-mix(in srgb, var(--paper) 22%, transparent) 0 1.5px, transparent 1.5px 8px),
    repeating-linear-gradient(-45deg, color-mix(in srgb, var(--paper) 22%, transparent) 0 1.5px, transparent 1.5px 8px),
    var(--frame);
  box-shadow: inset 0 0 0 3px var(--frame), inset 0 0 0 4.5px color-mix(in srgb, var(--paper) 75%, transparent), 0 3px 8px -4px rgba(0, 0, 0, .45);
  transform: rotate(var(--r, 0deg)) translateY(var(--y, 0px)); }
button.tback { cursor: pointer; transition: transform .15s ease; }
@media (hover: hover) { button.tback:hover { transform: rotate(0deg) translateY(-6px); } }
button.tback:active { transform: scale(.95); }
.tback.gone { visibility: hidden; }
.tback.deal { animation: deal .42s cubic-bezier(.2, .8, .3, 1.2) both; animation-delay: calc(var(--k) * 28ms); }
@keyframes deal { from { opacity: 0; transform: translateY(-30px) scale(.7) rotate(0deg); } }
.ttable { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px 9px; padding: 14px 4px 6px; }
.taro-q { margin: 0 0 12px; font: 400 22px/1.3 var(--f-hand); text-align: center; color: var(--ink); text-wrap: balance; }
.spread { display: grid; gap: 12px; justify-content: center; }
.spread.s1 { grid-template-columns: minmax(0, 160px); }
.spread.s3 { grid-template-columns: repeat(3, minmax(0, 120px)); }
.spread.s5 { gap: 8px 12px; grid-template-columns: repeat(3, minmax(0, 86px)); grid-template-areas: ". top ." "left center right" ". bottom ."; }
.spread.mini.s1 { grid-template-columns: 84px; }
.spread.mini.s3 { grid-template-columns: repeat(3, 84px); }
.spread.mini.s5 { grid-template-columns: repeat(3, 76px); gap: 6px 8px; }
.spread.mini .tback, .spread.mini .tslot { width: 48px; margin: 0 auto; }
.spread.mini .tpos-l { margin-top: 4px; font-size: 11px; }
.tslot { display: block; aspect-ratio: 5 / 8; border-radius: 8px; border: 2px dashed var(--print); opacity: .6; }
.tpos { min-width: 0; text-align: center; }
.tpos-l { margin: 6px 0 0; font-size: 12px; font-weight: 800; color: var(--ink-soft); line-height: 1.2; }
.tpos-n { margin: 2px 0 0; font: 400 17px/1.2 var(--f-hand); color: var(--ink); }
.tpos-n span { display: block; font-size: 14px; color: var(--pen-a); }
.tcard { position: relative; aspect-ratio: 5 / 8; perspective: 900px; }
.tcard .inner { position: absolute; inset: 0; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
.tcard.down .inner { transform: rotateY(180deg); }
.tcard .face { position: absolute; inset: 0; border-radius: 9px; overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden; box-shadow: 0 6px 14px -8px rgba(0, 0, 0, .5); }
.tcard .face.back { transform: rotateY(180deg); }
.tcard .face.back, .tback.mini { background:
    radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--paper) 90%, transparent) 0 12%, transparent 13%),
    repeating-linear-gradient(45deg, color-mix(in srgb, var(--paper) 22%, transparent) 0 1.5px, transparent 1.5px 8px),
    repeating-linear-gradient(-45deg, color-mix(in srgb, var(--paper) 22%, transparent) 0 1.5px, transparent 1.5px 8px),
    var(--frame); }
.tcard .face.front svg { display: block; width: 100%; height: 100%; }
.tcard.rev .face.front svg { transform: rotate(180deg); }
.tcard.flip .inner { animation: tflip .85s cubic-bezier(.3, .7, .3, 1) both; animation-delay: calc(var(--k) * .45s + .1s); }
@keyframes tflip { from { transform: rotateY(180deg); } to { transform: rotateY(0deg); } }
.tframe { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
.tinner { fill: none; stroke: var(--print); stroke-width: 1.2; }
.tnum { font-family: var(--f-hand); font-size: 17px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.tname { font: 800 6.6px/1 var(--f-ui); letter-spacing: .04em; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.ti { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.tr, .ty, .tb, .tp { stroke: var(--ink); stroke-width: 2.2; stroke-linejoin: round; }
.tr { fill: var(--t-red); fill-opacity: .55; }
.ty { fill: var(--t-yel); fill-opacity: .6; }
.tb { fill: var(--t-blu); fill-opacity: .45; }
.tp { fill: var(--paper); }
.tk { fill: var(--ink); }
.reading { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: var(--paper-2); }
.reading .who { font-size: 12px; font-weight: 800; color: var(--c); }
.reading p { margin: 4px 0 0; font: 400 21px/1.35 var(--f-hand); color: var(--c); white-space: pre-wrap; overflow-wrap: anywhere; }
.spreads { display: grid; gap: 10px; }
.sp-btn { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px; border: 2px solid var(--paper-2); border-radius: 14px; background: var(--paper); color: var(--ink); text-align: left; cursor: pointer; }
.sp-btn[aria-pressed="true"] { border-color: var(--frame); box-shadow: inset 0 0 0 1px var(--frame); }
.sp-txt { display: grid; gap: 2px; }
.sp-txt b { font-size: 16px; }
.sp-txt small { font-size: 13px; color: var(--ink-soft); }
.sp-mini { display: grid; gap: 3px; flex: none; width: 46px; justify-content: center; }
.sp-mini i { display: block; width: 12px; height: 19px; border-radius: 3px; background: var(--frame); }
.sp-mini.m1 { grid-template-columns: 12px; }
.sp-mini.m3 { grid-template-columns: repeat(3, 12px); }
.sp-mini.m5 { grid-template-columns: repeat(3, 12px); grid-template-areas: ". a ." "b c d" ". e ."; }
.sp-mini.m5 i:nth-child(1) { grid-area: a; } .sp-mini.m5 i:nth-child(2) { grid-area: b; } .sp-mini.m5 i:nth-child(3) { grid-area: c; } .sp-mini.m5 i:nth-child(4) { grid-area: d; } .sp-mini.m5 i:nth-child(5) { grid-area: e; }
.taro-hist { margin-top: 12px; padding: 12px 16px; border-radius: 16px; background: var(--paper); font-size: 14px; color: var(--ink-soft); }
.taro-hist summary { cursor: pointer; font-weight: 800; color: var(--ink); }
.hentry { padding: 10px 0; border-bottom: 1.5px dashed var(--paper-2); }
.hentry:last-child { border-bottom: 0; }
.hquest { margin: 4px 0 0; font: 400 18px/1.3 var(--f-hand); color: var(--ink); }
.hcards { margin: 4px 0 0; font-weight: 700; color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .tcard.flip .inner, .tback.deal { animation: none; } }

/* five more pages: briscola, memory, disegna, nomi cose città, chi mi conosce */
:root {
  --bri: #2E6B45; --bri-print: #2E6B45;
  --mem: #C0443C; --mem-print: #C0443C;
  --dis: #9A5B2E; --dis-print: #9A5B2E;
  --ncc: #66791C; --ncc-print: #66791C;
  --chi: #8A3FA8; --chi-print: #8A3FA8;
  --t-grn: #3E8A3A; --d-grn: #2E8B57; --d-yel: #E8A82A;
  --s0: #D3312A; --s1: #B07614; --s2: #3570DA; --s3: #3E8A3A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bri: #23533A; --bri-print: #7FD0A0;
    --mem: #97352F; --mem-print: #F2A097;
    --dis: #774624; --dis-print: #E2AE84;
    --ncc: #4F5E15; --ncc-print: #C4D77A;
    --chi: #6B3183; --chi-print: #D9A6EE;
    --s0: #FF8678; --s1: #F0BE5A; --s2: #8FB0FF; --s3: #86D07E; --d-grn: #5FD08F;
  }
}
:root[data-theme="dark"] {

    repeating-linear-gradient(45deg, color-mix(in srgb, var(--paper) 22%, transparent) 0 1.5px, transparent 1.5px 7px),

.bri { display: grid; gap: 14px; }

<script id="logic">
const Game = (() => {
  const SYMS = ['x', 'o', 's', 'h', 'n', 'f', 'l', 'u'];
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const MAX_WRONG = 6;
  const SIZES = [3, 4, 5, 6];
  const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  const INVISIBLE = /[\u0000-\u001f\u007f-\u009f\u00ad\u200b\u200c\u200e\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g;

  const other = s => (s === 'a' ? 'b' : 'a');
  const isSeat = s => s === 'a' || s === 'b';
  const seatOr = (s, d) => (isSeat(s) ? s : d);
  const clone = o => JSON.parse(JSON.stringify(o));
  const setAt = (str, i, ch) => str.slice(0, i) + ch + str.slice(i + 1);
  const int = (v, d) => (typeof v === 'number' && Number.isFinite(v) ? Math.trunc(v) : d);
  const intIn = (v, lo, hi, d) => { const n = int(v, d); return n >= lo && n <= hi ? n : d; };
  const blankPlayer = s => ({ id: null, nick: '', sym: s === 'a' ? 'x' : 'o' });

  function cleanText(raw, max) {
    const s = String(raw == null ? '' : raw).replace(/[\t\n\r]/g, ' ').replace(INVISIBLE, '').replace(/\s+/g, ' ').trim();

    'Che animale saremmo, tu e io?',
    'Il complimento più bello che hai ricevuto?',
    'Cosa ti rilassa di più prima di dormire?',
    'Un film o una serie da vedere insieme?',
    'Cosa ti piace di più della tua vita adesso?',
    'Se potessi rivivere un giorno con me, quale sceglieresti?',
    'Cosa cucineremmo insieme stasera?',
    'Una cosa che ti è venuta bene oggi?',
    'Un posto che ti piacerebbe rivedere?',
    'Cosa ti fa sentire a casa?',
    'La tua parola preferita?',
    'Se domani ci svegliassimo in un’altra città, quale vorresti?',
    'Cosa ti auguri per domani?',
  ];
  const domFresh = (q, n) => ({ q, ans: { a: '', b: '' }, hist: [], n });
  function nextQuestion(cur, wanted) {
    return Number.isInteger(wanted) && wanted >= 0 && wanted < QUESTIONS.length && wanted !== cur ? wanted : (cur + 1) % QUESTIONS.length;
  }

  /* ----- Tarocchi: the 22 Major Arcana, Marseille order ----- */
  const TAROT = [
    ['0', 'Il Matto'], ['I', 'Il Bagatto'], ['II', 'La Papessa'], ['III', 'L’Imperatrice'], ['IV', 'L’Imperatore'],
    ['V', 'Il Papa'], ['VI', 'L’Innamorato'], ['VII', 'Il Carro'], ['VIII', 'La Giustizia'], ['IX', 'L’Eremita'],
    ['X', 'La Ruota di Fortuna'], ['XI', 'La Forza'], ['XII', 'L’Appeso'], ['XIII', 'L’Arcano senza nome'], ['XIV', 'La Temperanza'],
    ['XV', 'Il Diavolo'], ['XVI', 'La Torre'], ['XVII', 'La Stella'], ['XVIII', 'La Luna'], ['XIX', 'Il Sole'],
    ['XX', 'Il Giudizio'], ['XXI', 'Il Mondo'],
  ];
  const SPREADS = {
    1: ['La carta della sera'],
    3: ['Passato', 'Presente', 'Futuro'],
    5: ['A favore', 'Contro', 'Il consiglio', 'Come andrà', 'Il cuore della questione'],
  };
  // A card on the table is card * 2 + 1 when it lies upside down.
  const deckOk = d => Array.isArray(d) && d.length === TAROT.length && d.every(v => Number.isInteger(v) && v >= 0 && v < TAROT.length * 2) && new Set(d.map(v => v >> 1)).size === TAROT.length;
  const taroFresh = n => ({ phase: 'idle', spread: 3, drawer: 'a', deck: [], picked: [], question: '', reading: '', hist: [], n });

  /* ----- shared ----- */
  function freshExtra() {
    return {
      c4: c4Fresh('a', 1), sos: sosFresh('a', 1), num: numFresh('a', 1), navi: naviFresh('a', 1), dom: domFresh(0, 1), taro: taroFresh(1),
      pick: { g: '', n: 0, by: '', at: 0 },
      score: { c4: { a: 0, b: 0 }, sos: { a: 0, b: 0 }, num: { a: 0, b: 0 }, navi: { a: 0, b: 0 }, dom: { a: 0, b: 0 }, taro: { a: 0, b: 0 } },
    };
  }
  const zeroScores = () => Object.fromEntries(GAMES.map(g => [g, { a: 0, b: 0 }]));

  const handles = t => typeof t === 'string' && (t === 'scores0' || t === 'pick' || /^(c4|sos|num|navi|dom|taro)\./.test(t));

  function apply(S, a, cleanText) {
    if (!S || !a || typeof a !== 'object') return null;
    const N = clone(S);
    const s = a.seat;
    switch (a.t) {
      case 'scores0': {
        if (!isSeat(s)) return null;
        N.score = zeroScores();
        return N;
      }
      case 'pick': {
        if (!isSeat(s) || !GAMES.includes(a.g)) return null;
        N.pick = { g: a.g, n: (N.pick && N.pick.n ? N.pick.n : 0) + 1, by: s, at: Date.now() };
        return N;
      }
      case 'c4.drop': {
        const q = N.c4;
        if (c4Result(q.cells) || s !== q.turn) return null;
        const col = a.col;
        if (!Number.isInteger(col) || col < 0 || col >= C4C) return null;
        let r = C4R - 1;
        while (r >= 0 && q.cells[r * C4C + col] !== '0') r--;
        if (r < 0) return null;
        const i = r * C4C + col;
        q.cells = setAt(q.cells, i, s);
        q.last = i;
        const res = c4Result(q.cells);
        if (res && res.win) N.score.c4[res.win] += 1;
        if (!res) q.turn = other(s);
        return N;
      }
      case 'c4.new': {
        const q = N.c4;
        if (!isSeat(s) || !/[ab]/.test(q.cells)) return null;
        if (!c4Result(q.cells) && a.force !== true) return null;
        N.c4 = c4Fresh(other(q.first), q.n + 1);
        return N;
      }
      case 'sos.play': {
        const q = N.sos, i = a.i, ch = a.ch;
        if (sosOver(q) || s !== q.turn) return null;
        if (!Number.isInteger(i) || i < 0 || i >= SN * SN || q.cells[i] !== '.' || (ch !== 'S' && ch !== 'O')) return null;
        q.cells = setAt(q.cells, i, ch);
        q.by = setAt(q.by, i, s);
        const found = sosFind(q.cells, i);
        for (const f of found) q.lines.push([f[0], f[1], f[2], s]);
        q.pts[s] += found.length;
        q.last = i;
        q.mk = found.length;
        if (!found.length) q.turn = other(s);
        if (sosOver(q) && q.pts.a !== q.pts.b) N.score.sos[q.pts.a > q.pts.b ? 'a' : 'b'] += 1;
        return N;
      }
      case 'sos.new': {
        const q = N.sos;
        if (!isSeat(s) || !/[SO]/.test(q.cells)) return null;
        if (!sosOver(q) && a.force !== true) return null;
        N.sos = sosFresh(other(q.first), q.n + 1);
        return N;
      }
      case 'num.secret': {
        const q = N.num;
        if (q.phase !== 'setup' || !isSeat(s) || !numOk(a.code)) return null;
        q.sec[s] = hide(a.code);
        if (q.sec.a && q.sec.b) { q.phase = 'play'; q.turn = q.first; }
        return N;
      }
      case 'num.guess': {
        const q = N.num;
        if (q.phase !== 'play' || s !== q.turn || !numOk(a.code) || q.guesses.length >= 60) return null;
        const secret = show(q.sec[other(s)]);
        if (!numOk(secret)) return null;
        const [b, c] = numScore(secret, a.code);
        q.guesses.push([s, a.code, b, c]);
        if (b === 4) { q.phase = 'over'; q.win = s; N.score.num[s] += 1; }
        else q.turn = other(s);
        return N;
      }
      case 'num.new': {
        const q = N.num;
        if (!isSeat(s) || (q.phase === 'setup' && !q.sec.a && !q.sec.b)) return null;
        if (q.phase !== 'over' && a.force !== true) return null;
        N.num = numFresh(other(q.first), q.n + 1);
        return N;
      }
      case 'navi.place': {
        const q = N.navi;
        if (q.phase !== 'setup' || !isSeat(s) || !fleetOk(a.ships)) return null;
        q.fleet[s] = hide(JSON.stringify(a.ships));
        if (q.fleet.a && q.fleet.b) { q.phase = 'play'; q.turn = q.first; }
        return N;
      }
      case 'navi.shot': {
        const q = N.navi, i = a.i;
        if (q.phase !== 'play' || s !== q.turn) return null;
        if (!Number.isInteger(i) || i < 0 || i >= NV * NV || q.shots[s][i] !== '0') return null;
        const enemy = fleetOf(q, other(s));
        if (!enemy) return null;
        const hit = enemy.some(sh => sh.includes(i));
        q.shots[s] = setAt(q.shots[s], i, hit ? 'h' : 'm');
        q.last = { s, i };
        if (sunkList(enemy, q.shots[s]).every(Boolean)) { q.phase = 'over'; q.win = s; N.score.navi[s] += 1; }
        else q.turn = other(s);
        return N;
      }
      case 'navi.new': {
        const q = N.navi;
        if (!isSeat(s) || (q.phase === 'setup' && !q.fleet.a && !q.fleet.b)) return null;
        if (q.phase !== 'over' && a.force !== true) return null;
        N.navi = naviFresh(other(q.first), q.n + 1);
        return N;
      }
      case 'dom.answer': {
        const d = N.dom;
        if (!isSeat(s) || d.ans[s]) return null;
        const t = cleanText(a.text, 280);
        if (!t) return null;
        d.ans[s] = hide(t);
        return N;
      }
      case 'dom.next': {
        const d = N.dom;
        if (!isSeat(s) || !d.ans.a || !d.ans.b) return null;
        const hist = [[d.q, d.ans.a, d.ans.b]].concat(d.hist).slice(0, 10);
        N.dom = { q: nextQuestion(d.q, a.q), ans: { a: '', b: '' }, hist, n: d.n + 1 };
        return N;
      }
      case 'dom.new': {
        const d = N.dom;
        if (!isSeat(s) || (!d.ans.a && !d.ans.b) || a.force !== true) return null;
        N.dom = { q: nextQuestion(d.q, a.q), ans: { a: '', b: '' }, hist: d.hist, n: d.n + 1 };
        return N;
      }
      case 'dom.skip': {
        const d = N.dom;
        if (!isSeat(s) || d.ans.a || d.ans.b) return null;
        d.q = nextQuestion(d.q, a.q);
        return N;
      }
      case 'taro.shuffle': {
        const t = N.taro;
        if (!isSeat(s) || t.phase !== 'idle' || !SPREADS[a.spread] || !deckOk(a.deck)) return null;
        N.taro = { phase: 'pick', spread: a.spread, drawer: s, deck: a.deck.slice(), picked: [], question: cleanText(a.question, 140), reading: '', hist: t.hist, n: t.n + 1 };
        return N;
      }
      case 'taro.pick': {
        const t = N.taro, pos = a.pos;
        if (t.phase !== 'pick' || s !== t.drawer || !Number.isInteger(pos) || pos < 0 || pos >= t.deck.length || t.picked.includes(pos)) return null;
        t.picked.push(pos);
        if (t.picked.length === t.spread) t.phase = 'spread';
        return N;
      }
      case 'taro.flip': {
        if (!isSeat(s) || N.taro.phase !== 'spread') return null;
        N.taro.phase = 'reveal';
        return N;
      }
      case 'taro.read': {
        const t = N.taro;
        if (t.phase !== 'reveal' || s !== other(t.drawer)) return null;
        const text = cleanText(a.text, 800);
        if (!text || text === t.reading) return null;
        t.reading = text;
        return N;
      }
      case 'taro.done': {
        const t = N.taro;
        if (!isSeat(s) || t.phase !== 'reveal') return null;
        const entry = { at: Date.now(), sp: t.spread, c: t.picked.map(pos => t.deck[pos]), q: t.question, r: t.reading, d: t.drawer };
        N.taro = { phase: 'idle', spread: t.spread, drawer: t.drawer, deck: [], picked: [], question: '', reading: '', hist: [entry].concat(t.hist).slice(0, 10), n: t.n + 1 };
        return N;
      }
      case 'taro.cancel': {
        const t = N.taro;
        if (!isSeat(s) || t.phase === 'idle') return null;
        N.taro = { phase: 'idle', spread: t.spread, drawer: t.drawer, deck: [], picked: [], question: '', reading: '', hist: t.hist, n: t.n + 1 };
        return N;
      }
      default:
        return null;
    }
  }

  function sanitizeExtra(raw) {
    const out = freshExtra();
    const R = raw && typeof raw === 'object' ? raw : {};
    const SC = R.score && typeof R.score === 'object' ? R.score : {};
    for (const g of EXTRA) for (const s of ['a', 'b']) out.score[g][s] = intIn(SC[g] && SC[g][s], 0, 99999, 0);

    const C = R.c4;
    if (C && typeof C.cells === 'string' && C.cells.length === C4R * C4C && /^[0ab]+$/.test(C.cells)) {
      out.c4 = { cells: C.cells, turn: seatOr(C.turn, 'a'), first: seatOr(C.first, 'a'), last: intIn(C.last, -1, C4R * C4C - 1, -1), n: intIn(C.n, 1, 1e9, 1) };
    }

    const Q = R.sos;
    if (Q && typeof Q.cells === 'string' && Q.cells.length === SN * SN && /^[.SO]+$/.test(Q.cells) && typeof Q.by === 'string' && Q.by.length === SN * SN && /^[0ab]+$/.test(Q.by)) {
      const lines = (Array.isArray(Q.lines) ? Q.lines : [])
        .filter(l => Array.isArray(l) && l.length === 4 && [0, 1, 2].every(k => Number.isInteger(l[k]) && l[k] >= 0 && l[k] < SN * SN) && isSeat(l[3]))
        .slice(0, 200);
      const P = Q.pts && typeof Q.pts === 'object' ? Q.pts : {};
      out.sos = {
        cells: Q.cells, by: Q.by, lines, pts: { a: intIn(P.a, 0, 999, 0), b: intIn(P.b, 0, 999, 0) },
        turn: seatOr(Q.turn, 'a'), first: seatOr(Q.first, 'a'), last: intIn(Q.last, -1, SN * SN - 1, -1), mk: intIn(Q.mk, 0, 8, 0), n: intIn(Q.n, 1, 1e9, 1),
      };
    }

    const M = R.num;
    if (M && typeof M === 'object') {
      const sec = M.sec && typeof M.sec === 'object' ? M.sec : {};
      const n = {
        phase: ['setup', 'play', 'over'].includes(M.phase) ? M.phase : 'setup',
        sec: { a: str(sec.a, 64), b: str(sec.b, 64) },
        guesses: (Array.isArray(M.guesses) ? M.guesses : [])
          .filter(x => Array.isArray(x) && isSeat(x[0]) && numOk(x[1]) && Number.isInteger(x[2]) && Number.isInteger(x[3]))
          .slice(0, 60).map(x => [x[0], x[1], intIn(x[2], 0, 4, 0), intIn(x[3], 0, 4, 0)]),
        turn: seatOr(M.turn, 'a'), first: seatOr(M.first, 'a'), win: isSeat(M.win) ? M.win : '', n: intIn(M.n, 1, 1e9, 1),
      };
      if (n.phase !== 'setup' && !(numOk(show(n.sec.a)) && numOk(show(n.sec.b)))) n.phase = 'setup';
      if (n.phase === 'over' && !n.win) n.phase = 'play';
      out.num = n;
    }

    const V = R.navi;
    if (V && typeof V === 'object') {
      const fl = V.fleet && typeof V.fleet === 'object' ? V.fleet : {};
      const sh = V.shots && typeof V.shots === 'object' ? V.shots : {};
      const okShots = x => (typeof x === 'string' && x.length === NV * NV && /^[0hm]+$/.test(x) ? x : '0'.repeat(NV * NV));
      const v = {
        phase: ['setup', 'play', 'over'].includes(V.phase) ? V.phase : 'setup',
        fleet: { a: str(fl.a, 600), b: str(fl.b, 600) },
        shots: { a: okShots(sh.a), b: okShots(sh.b) },
        turn: seatOr(V.turn, 'a'), first: seatOr(V.first, 'a'), win: isSeat(V.win) ? V.win : '',
        last: V.last && isSeat(V.last.s) && Number.isInteger(V.last.i) && V.last.i >= 0 && V.last.i < NV * NV ? { s: V.last.s, i: V.last.i } : null,
        n: intIn(V.n, 1, 1e9, 1),
      };
      if (v.phase !== 'setup' && !(fleetOf(v, 'a') && fleetOf(v, 'b'))) v.phase = 'setup';
      if (v.phase === 'over' && !v.win) v.phase = 'play';
      out.navi = v;
    }

    const D = R.dom;
    if (D && typeof D === 'object') {
      const ans = D.ans && typeof D.ans === 'object' ? D.ans : {};
      out.dom = {
        q: intIn(D.q, 0, QUESTIONS.length - 1, 0),
        ans: { a: str(ans.a, 1200), b: str(ans.b, 1200) },
        hist: (Array.isArray(D.hist) ? D.hist : [])
          .filter(h => Array.isArray(h) && Number.isInteger(h[0]) && h[0] >= 0 && h[0] < QUESTIONS.length && typeof h[1] === 'string' && typeof h[2] === 'string')
          .slice(0, 10).map(h => [h[0], h[1].slice(0, 1200), h[2].slice(0, 1200)]),
        n: intIn(D.n, 1, 1e9, 1),
      };
    }

    const T = R.taro;
    if (T && typeof T === 'object') {
      const spread = SPREADS[T.spread] ? T.spread : 3;
      const deck = deckOk(T.deck) ? T.deck.slice() : [];
      const picked = deck.length ? (Array.isArray(T.picked) ? T.picked : []).filter((v, k, arr) => Number.isInteger(v) && v >= 0 && v < deck.length && arr.indexOf(v) === k).slice(0, spread) : [];
      let phase = ['idle', 'pick', 'spread', 'reveal'].includes(T.phase) ? T.phase : 'idle';
      if (phase !== 'idle' && !deck.length) phase = 'idle';
      if ((phase === 'spread' || phase === 'reveal') && picked.length !== spread) phase = picked.length < spread ? 'pick' : phase;
      const hist = (Array.isArray(T.hist) ? T.hist : []).filter(h => h && typeof h === 'object' && SPREADS[h.sp] && Array.isArray(h.c) && h.c.length === h.sp && h.c.every(v => Number.isInteger(v) && v >= 0 && v < TAROT.length * 2))
        .slice(0, 10).map(h => ({ at: intIn(h.at, 0, 1e15, 0), sp: h.sp, c: h.c.slice(), q: cleanTextLite(h.q, 140), r: cleanTextLite(h.r, 800), d: seatOr(h.d, 'a') }));
      out.taro = {
        phase, spread, drawer: seatOr(T.drawer, 'a'), deck: phase === 'idle' ? [] : deck, picked: phase === 'idle' ? [] : picked,
        question: cleanTextLite(T.question, 140), reading: cleanTextLite(T.reading, 800), hist, n: intIn(T.n, 1, 1e9, 1),
      };
      if (phase === 'idle') { out.taro.question = ''; out.taro.reading = ''; }
    }

    const P = R.pick;
    if (P && typeof P === 'object' && GAMES.includes(P.g)) {
      out.pick = { g: P.g, n: intIn(P.n, 0, 1e9, 0), by: seatOr(P.by, 'a'), at: intIn(P.at, 0, 1e15, 0) };
    }
    return out;
  }

  const cleanTextLite = (v, max) => (typeof v === 'string' ? Array.from(v).slice(0, max).join('') : '');

  // Whether it's this seat's move in a new game (true), the other's (false), or nobody's (null).
  function yourMove(S, g, seat) {
    switch (g) {
      case 'c4': return c4Result(S.c4.cells) ? null : S.c4.turn === seat;
      case 'sos': return sosOver(S.sos) ? null : S.sos.turn === seat;
      case 'num': {
        const q = S.num;
        if (q.phase === 'over') return null;
        if (q.phase === 'setup') return !q.sec[seat];
        return q.turn === seat;
      }
      case 'navi': {
        const q = S.navi;
        if (q.phase === 'over') return null;
        if (q.phase === 'setup') return !q.fleet[seat];
        return q.turn === seat;
      }
      case 'dom': return S.dom.ans[seat] ? (S.dom.ans[other(seat)] ? null : false) : true;
      case 'taro': {
        const t = S.taro;
        if (t.phase === 'pick' || t.phase === 'spread') return t.drawer === seat;
        if (t.phase === 'reveal') return t.reading ? null : other(t.drawer) === seat;
        return null;
      }
      default: return null;
    }
  }

  return {
    GAMES, EXTRA, QUESTIONS, C4R, C4C, SN, NV, FLEET, TAROT, SPREADS, deckOk,
    hide, show, handles, apply, sanitizeExtra, freshExtra, yourMove,
    c4Result, sosOver, sosFind, numOk, numScore, fleetOk, fleetOf, sunkList, randomFleet,
  };
})();

<script id="logic3">
// Rules for the third batch: Briscola, Memory, Disegna e indovina, Nomi cose città, Chi mi conosce meglio.
// Same contract as Game and Game2: apply() returns the next state or null.
const Game3 = (() => {
  const EXTRA = ['bri', 'mem', 'dis', 'ncc', 'chi'];
  const other = s => (s === 'a' ? 'b' : 'a');
  const isSeat = s => s === 'a' || s === 'b';
  const seatOr = (s, d) => (isSeat(s) ? s : d);
  const clone = o => JSON.parse(JSON.stringify(o));
  const int = (v, d) => (typeof v === 'number' && Number.isFinite(v) ? Math.trunc(v) : d);
  const intIn = (v, lo, hi, d) => { const n = int(v, d); return n >= lo && n <= hi ? n : d; };
  const str = (v, max) => (typeof v === 'string' ? v.slice(0, max) : '');
  const hide = s => Game2.hide(s);
  const show = s => Game2.show(s);
  const unpack = (s, ok) => { try { const v = JSON.parse(show(s)); return ok(v) ? v : null; } catch (e) { return null; } };
  const norm = s => Game.normWord(s).replace(/['-]/g, ' ').replace(/\s+/g, ' ').trim();

  /* ----- Briscola: 40 Italian cards, id = suit * 10 + rank ----- */
  const SUITS = ['Coppe', 'Denari', 'Spade', 'Bastoni'];
  const RANKS = ['Asso', 'Due', 'Tre', 'Quattro', 'Cinque', 'Sei', 'Sette', 'Fante', 'Cavallo', 'Re'];
  const POINTS = [11, 0, 10, 0, 0, 0, 0, 2, 3, 4];
  const POWER = [9, 0, 8, 1, 2, 3, 4, 5, 6, 7];
  const suitOf = c => Math.floor(c / 10), rankOf = c => c % 10;
  const cardOk = c => Number.isInteger(c) && c >= 0 && c < 40;
  const cardsOk = v => Array.isArray(v) && v.length <= 40 && v.every(cardOk) && new Set(v).size === v.length;
  const bdeckOk = d => cardsOk(d) && d.length === 40;
  // Does the second card take the first? Same suit: the stronger one. Otherwise only a briscola takes.
  const beats = (f, l, bs) => (suitOf(f) === suitOf(l) ? POWER[rankOf(f)] > POWER[rankOf(l)] : suitOf(f) === bs);
  const briFresh = (first, n) => ({ phase: 'idle', first, turn: first, deck: '', hands: { a: '', b: '' }, brisc: -1, left: 0, table: [], last: null, pts: { a: 0, b: 0 }, n });
  const handOf = (q, s) => unpack(q.hands[s], cardsOk) || [];
  const deckOf = q => unpack(q.deck, cardsOk) || [];

  /* ----- Memory: 20 cards, 10 pairs ----- */
  const MEM_N = 20, MEM_K = 10;
  const layoutOk = s => typeof s === 'string' && s.length === MEM_N && /^[0-9]+$/.test(s) && Array.from({ length: MEM_K }, (_, k) => s.split(String(k)).length - 1).every(c => c === 2);
  const memFresh = (first, n) => ({ lay: '', found: '0'.repeat(MEM_N), open: [], miss: [], turn: first, first, pts: { a: 0, b: 0 }, n });
  const memOver = q => !!q.lay && !q.found.includes('0');
  const layOf = q => { const s = show(q.lay); return layoutOk(s) ? s : ''; };

  /* ----- Disegna e indovina ----- */
  const WORDS = [
    'gatto', 'cane', 'casa', 'albero', 'sole', 'luna', 'stella', 'pizza', 'gelato', 'mare', 'montagna', 'bicicletta',

  /* ----- Nomi cose città ----- */

  const LETTERS = 'ABCDEFGILMNOPRSTUVZ';
  const nccFresh = n => ({ phase: 'idle', letter: '', ans: { a: '', b: '' }, stop: '', veto: '0'.repeat(CATS.length * 2), used: '', hist: [], n });
  const wordsOk = v => Array.isArray(v) && v.length === CATS.length && v.every(w => typeof w === 'string' && w.length <= 40);

  /* ----- Chi mi conosce meglio: this or that ----- */
  const PAIRS = [
    ['Mare', 'Montagna'], ['Pizza', 'Sushi'], ['Cane', 'Gatto'], ['Alba', 'Tramonto'], ['Film', 'Serie tv'], ['Dolce', 'Salato'],
    ['Caffè', 'Tè'], ['Estate', 'Inverno'], ['Libro', 'Film'], ['Serata a casa', 'Serata fuori'], ['Messaggio', 'Chiamata'], ['Colazione dolce', 'Colazione salata'],
    ['Svegliarsi presto', 'Fare tardi'], ['Città', 'Campagna'], ['Pasta', 'Riso'], ['Cioccolato fondente', 'Cioccolato al latte'], ['Viaggio organizzato', 'Partire all’avventura'], ['Spiaggia', 'Piscina'],
    ['Doccia', 'Bagno'], ['Pioggia', 'Sole'], ['Horror', 'Commedia'], ['Gelato', 'Torta'], ['Treno', 'Aereo'], ['Concerto', 'Cinema'],
    ['Vino', 'Birra'], ['Cucinare', 'Ordinare'], ['Abbracci', 'Baci'], ['Ordine', 'Caos'], ['Sneakers', 'Scarpe eleganti'], ['Primo', 'Secondo'],
    ['Pizza margherita', 'Pizza con tutto'], ['Parlare', 'Ascoltare'], ['Foto', 'Video'], ['Natale', 'Capodanno'], ['Lunedì', 'Venerdì'], ['Dormire tanto', 'Fare tante cose'],
    ['Musica alta', 'Silenzio'], ['Mattina', 'Sera'], ['Sorpresa', 'Sapere tutto prima'], ['Coperte', 'Lenzuolo'], ['Divano', 'Letto'], ['Patatine', 'Popcorn'],
    ['Montagne russe', 'Ruota panoramica'], ['Neve', 'Caldo'], ['Giochi da tavolo', 'Videogiochi'], ['Andare in vacanza al mare', 'Andare in una città nuova'], ['Fragole', 'Ciliegie'], ['Lasagne', 'Carbonara'],
    ['Passeggiata', 'Corsa'], ['Disordine in camera', 'Camera perfetta'], ['Tatuaggio', 'Piercing'], ['Profumo dolce', 'Profumo fresco'], ['Ristorante elegante', 'Trattoria'], ['Ritardo', 'Anticipo'],
    ['Cartoni animati', 'Documentari'], ['Ketchup', 'Maionese'], ['Notte in tenda', 'Notte in hotel'], ['Telefono sempre acceso', 'Telefono spento'], ['Mangiare piccante', 'Mangiare delicato'], ['Romantico', 'Avventuroso'],
  ];
  const ROUNDS = 10;
  const chiFresh = (q, n) => ({ phase: 'play', q, k: 1, ans: { a: '', b: '' }, pts: { a: 0, b: 0 }, hist: [], n });
  const chiAnsOk = s => typeof s === 'string' && /^[01]{2}$/.test(s);
  const nextPair = (cur, wanted) => (Number.isInteger(wanted) && wanted >= 0 && wanted < PAIRS.length && wanted !== cur ? wanted : (cur + 7) % PAIRS.length);

  /* ----- shared ----- */
  function fresh() {
    return {
      bri: briFresh('a', 1), mem: memFresh('a', 1), dis: disFresh('a', 1), ncc: nccFresh(1), chi: chiFresh(0, 1),
      score: Object.fromEntries(EXTRA.map(g => [g, { a: 0, b: 0 }])),

  }
  const handles = t => typeof t === 'string' && /^(bri|mem|dis|ncc|chi)\./.test(t);

  function apply(S, a, cleanText) {
    if (!S || !a || typeof a !== 'object') return null;
    const N = clone(S);
    const s = a.seat;
    if (!isSeat(s)) return null;
    switch (a.t) {
      case 'bri.deal': {
        const q = N.bri;
        if ((q.phase !== 'idle' && q.phase !== 'over') || !bdeckOk(a.deck)) return null;
        const d = a.deck, first = q.phase === 'over' ? other(q.first) : q.first, second = other(first);
        const hands = { [first]: [d[0], d[2], d[4]], [second]: [d[1], d[3], d[5]] };
        // The seventh card is turned up: it sets the briscola and is the last one drawn.
        const rest = d.slice(7).concat([d[6]]);
        N.bri = { phase: 'play', first, turn: first, deck: hide(JSON.stringify(rest)), hands: { a: hide(JSON.stringify(hands.a)), b: hide(JSON.stringify(hands.b)) }, brisc: d[6], left: rest.length, table: [], last: null, pts: { a: 0, b: 0 }, n: q.n + 1 };
        return N;
      }
      case 'bri.play': {
        const q = N.bri, c = a.card;
        if (q.phase !== 'play' || s !== q.turn || !cardOk(c)) return null;

        if (!hand.includes(c)) return null;

          q.turn = other(s);

          q.table = [];

          q.deck = hide(JSON.stringify(rest));
          q.left = rest.length;
          q.turn = win;
          if (!hands.a.length && !hands.b.length) {
            q.phase = 'over';
            if (q.pts.a !== q.pts.b) N.score.bri[q.pts.a > q.pts.b ? 'a' : 'b'] += 1;

            q.turn = other(s);

        const q = N.mem;

        q.word = hide(w);

        return N;
      }
      case 'dis.clear': {
        const q = N.dis;

        q.strokes = [];
        return N;
      }
      case 'dis.guess': {
        const q = N.dis;
        if (q.phase !== 'draw' || s !== other(q.drawer) || q.guesses.length >= MAX_GUESSES) return null;
        const g = cleanText(a.text, 40);
        if (!guessKey(g)) return null;
        const hit = guessKey(g) === guessKey(show(q.word));
        q.guesses.push([g, hit ? 1 : 0]);

        return N;
      }
      case 'dis.give': {
        const q = N.dis;
        if (q.phase !== 'draw' || s !== other(q.drawer)) return null;
        q.phase = 'done';
        q.win = 'n';
        return N;
      }
      case 'dis.next': {
        const q = N.dis;

        return N;
      }

        const q = N.ncc;

        N.ncc = { phase: 'idle', letter: '', ans: { a: '', b: '' }, stop: '', veto: '0'.repeat(CATS.length * 2), used: q.used, hist: [[q.letter, p.ta, p.tb]].concat(q.hist).slice(0, 10), n: q.n + 1 };

        return N;
      }

        const q = N.chi;
        if (q.phase !== 'play' || q.ans[s] || (a.me !== 0 && a.me !== 1) || (a.you !== 0 && a.you !== 1)) return null;
        q.ans[s] = hide(`${a.me}${a.you}`);
        if (q.ans.a && q.ans.b) {
          const A = show(q.ans.a), B = show(q.ans.b);
          if (A[1] === B[0]) q.pts.a += 1;
          if (B[1] === A[0]) q.pts.b += 1;
          q.hist.push([q.q, A, B]);
          if (q.k >= ROUNDS) {
            q.phase = 'over';
            if (q.pts.a !== q.pts.b) N.score.chi[q.pts.a > q.pts.b ? 'a' : 'b'] += 1;
          }

        return N;
      }
      case 'chi.next': {
        const q = N.chi;
        if (q.phase !== 'play' || !q.ans.a || !q.ans.b) return null;
        q.q = nextPair(q.q, a.q);
        q.k += 1;
        q.ans = { a: '', b: '' };
        return N;
      }
      case 'chi.new': {
        const q = N.chi;
        if (q.phase !== 'over' && (a.force !== true || (q.k === 1 && !q.ans.a && !q.ans.b))) return null;
        N.chi = chiFresh(nextPair(q.q, a.q), q.n + 1);
        return N;
      }
      default:
        return null;
    }
  }

  function sanitize(raw, cleanText) {
    const out = fresh();
    const R = raw && typeof raw === 'object' ? raw : {};
    const SC = R.score && typeof R.score === 'object' ? R.score : {};
    for (const g of EXTRA) for (const s of ['a', 'b']) out.score[g][s] = intIn(SC[g] && SC[g][s], 0, 99999, 0);

    const B = R.bri;
    if (B && typeof B === 'object') {
      const H = B.hands && typeof B.hands === 'object' ? B.hands : {};
      const P = B.pts && typeof B.pts === 'object' ? B.pts : {};
      const q = {
        phase: ['idle', 'play', 'over'].includes(B.phase) ? B.phase : 'idle',
        first: seatOr(B.first, 'a'), turn: seatOr(B.turn, 'a'),
        deck: str(B.deck, 800), hands: { a: str(H.a, 200), b: str(H.b, 200) },
        brisc: intIn(B.brisc, -1, 39, -1), left: intIn(B.left, 0, 40, 0),
        table: (Array.isArray(B.table) ? B.table : []).filter(x => Array.isArray(x) && isSeat(x[0]) && cardOk(x[1])).slice(0, 1).map(x => [x[0], x[1]]),
        last: B.last && Array.isArray(B.last.t) && B.last.t.length === 2 && B.last.t.every(x => Array.isArray(x) && isSeat(x[0]) && cardOk(x[1])) && isSeat(B.last.w)
          ? { t: B.last.t.map(x => [x[0], x[1]]), w: B.last.w } : null,

      };
      if (q.phase === 'play' && !(cardOk(q.brisc) && unpack(q.deck, cardsOk) && unpack(q.hands.a, cardsOk) && unpack(q.hands.b, cardsOk))) q.phase = 'idle';
      if (q.phase === 'idle') Object.assign(q, { turn: q.first, deck: '', hands: { a: '', b: '' }, brisc: -1, left: 0, table: [], last: null, pts: { a: 0, b: 0 } });

    }

    const M = R.mem;
    if (M && typeof M === 'object') {
      const P = M.pts && typeof M.pts === 'object' ? M.pts : {};
      const idx = v => (Array.isArray(v) ? v : []).filter((x, k, arr) => Number.isInteger(x) && x >= 0 && x < MEM_N && arr.indexOf(x) === k).slice(0, 2);
      const q = {
        lay: str(M.lay, 64), found: typeof M.found === 'string' && M.found.length === MEM_N && /^[0ab]+$/.test(M.found) ? M.found : '0'.repeat(MEM_N),
        open: idx(M.open).slice(0, 1), miss: idx(M.miss), turn: seatOr(M.turn, 'a'), first: seatOr(M.first, 'a'),
        pts: { a: intIn(P.a, 0, MEM_K, 0), b: intIn(P.b, 0, MEM_K, 0) }, n: intIn(M.n, 1, 1e9, 1),
      };
      if (q.lay && !layoutOk(show(q.lay))) q.lay = '';
      if (!q.lay) Object.assign(q, { found: '0'.repeat(MEM_N), open: [], miss: [], pts: { a: 0, b: 0 }, turn: q.first });

    }

    const D = R.dis;
    if (D && typeof D === 'object') {
      const strokes = [];
      let ink = 0;
      for (const x of Array.isArray(D.strokes) ? D.strokes : []) {
        if (!strokeOk(x) || strokes.length >= MAX_STROKES || ink + x[2].length > MAX_INK) break;
        strokes.push([x[0], x[1], x[2]]);
        ink += x[2].length;
      }
      const q = {
        phase: ['choose', 'draw', 'done'].includes(D.phase) ? D.phase : 'choose', drawer: seatOr(D.drawer, 'a'),
        word: str(D.word, 200), strokes,
        guesses: (Array.isArray(D.guesses) ? D.guesses : []).filter(g => Array.isArray(g) && typeof g[0] === 'string' && (g[1] === 0 || g[1] === 1)).slice(0, MAX_GUESSES).map(g => [cleanText(g[0], 40), g[1]]),
        win: D.win === 'y' || D.win === 'n' ? D.win : '', n: intIn(D.n, 1, 1e9, 1),
      };

      if (q.phase === 'done' && !q.win) q.phase = 'draw';

    const C = R.ncc;
    if (C && typeof C === 'object') {
      const A = C.ans && typeof C.ans === 'object' ? C.ans : {};

        phase: ['idle', 'play', 'score'].includes(C.phase) ? C.phase : 'idle',
        letter: typeof C.letter === 'string' && C.letter.length === 1 && LETTERS.includes(C.letter) ? C.letter : '',
        ans: { a: str(A.a, 1200), b: str(A.b, 1200) }, stop: isSeat(C.stop) ? C.stop : '',
        veto: typeof C.veto === 'string' && C.veto.length === CATS.length * 2 && /^[01]+$/.test(C.veto) ? C.veto : '0'.repeat(CATS.length * 2),
        used: typeof C.used === 'string' ? Array.from(C.used).filter(ch => LETTERS.includes(ch)).slice(0, 8).join('') : '',
        hist: (Array.isArray(C.hist) ? C.hist : []).filter(h => Array.isArray(h) && typeof h[0] === 'string' && LETTERS.includes(h[0]) && h[0].length === 1).slice(0, 10).map(h => [h[0], intIn(h[1], 0, 999, 0), intIn(h[2], 0, 999, 0)]),

    const W = R.chi;
    if (W && typeof W === 'object') {
      const A = W.ans && typeof W.ans === 'object' ? W.ans : {};
      const P = W.pts && typeof W.pts === 'object' ? W.pts : {};

    } else if (imp.phase === 'setup' && canManage()) {

  function viewQua(anim) {
    const q = S.qua, over = G.quaOver(q), started = G.quaStarted(q), cnt = G.quaCount(q);
    const s = 60, m = 30, W = q.C * s + 2 * m, H = q.R * s + 2 * m;
    const X = c => m + c * s, Y = r => m + r * s;
    const playable = !over && canAct(q.turn);
    const freshBoxes = new Set(anim && q.last && q.mk ? G.edgeBoxes(q, q.last[0], Number(q.last.slice(1))).filter(b => q.bx[b] !== '0') : []);
    let boxes = '', lines = '', hits = '', dots = '';
    for (let b = 0; b < q.bx.length; b++) {
      const o = q.bx[b];
      if (o === '0') continue;
      const r = Math.floor(b / q.C), c = b % q.C;
      boxes += `<text class="ini${freshBoxes.has(b) ? ' pop' : ''}" x="${X(c) + s / 2}" y="${Y(r) + s / 2 + 2}" style="--c:var(--pen-${o})">${esc(initialOf(o))}</text>`;
    }
    const edge = (k, i, x1, y1, x2, y2) => {
      const o = (k === 'h' ? q.h : q.v)[i];
      if (o !== '0') {
        const isLast = q.last === k + i;
        lines += `<path class="pen edge-line${isLast ? ' last' : ''}${isLast && anim ? ' fresh' : ''}" pathLength="1" style="--c:var(--pen-${o})" d="${penLine(x1, y1, x2, y2, 'e' + q.n + k + i)}"/>`;
      } else if (playable) {
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, hs = s / 2;
        hits += `<g class="edge" data-act="line" data-k="${k}" data-i="${i}"><polygon class="hit" points="${mx - hs},${my} ${mx},${my - hs} ${mx + hs},${my} ${mx},${my + hs}"/><line class="ghost" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="--c:var(--pen-${q.turn})"/></g>`;
      }
    };
    for (let r = 0; r <= q.R; r++) for (let c = 0; c < q.C; c++) edge('h', r * q.C + c, X(c), Y(r), X(c + 1), Y(r));
    for (let r = 0; r < q.R; r++) for (let c = 0; c <= q.C; c++) edge('v', r * (q.C + 1) + c, X(c), Y(r), X(c), Y(r + 1));
    for (let r = 0; r <= q.R; r++) for (let c = 0; c <= q.C; c++) dots += `<circle class="dot" cx="${X(c)}" cy="${Y(r)}" r="3.6"/>`;
    const label = `Griglia ${q.R} per ${q.C}: ${cnt.a} quadratini a ${esc(nameOf('a'))}, ${cnt.b} a ${esc(nameOf('b'))}`;
    const board = `<div class="card"><svg class="dots" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${boxes}${lines}${hits}${dots}</svg></div>`;

    const tally = `<span class="tally" aria-hidden="true"><span style="--c:var(--pen-a)">${esc(initialOf('a'))} ${cnt.a}</span><span style="--c:var(--pen-b)">${esc(initialOf('b'))} ${cnt.b}</span></span>`;
    let status;
    if (over) status = cnt.a === cnt.b ? `Pari, ${cnt.a} a ${cnt.b}.` : `Ha vinto ${inkName(cnt.a > cnt.b ? 'a' : 'b')}, ${Math.max(cnt.a, cnt.b)} a ${Math.min(cnt.a, cnt.b)}.`;
    else if (q.mk && q.last) status = seat === q.turn ? 'Quadratino! Ancora tu.' : `Quadratino! Gioca ancora ${inkName(q.turn)}.`;
    else status = turnLine(q.turn);
    status += ' ' + tally;

    let controls = '';
    if (canManage() && (over || !started)) {
      controls = `<div class="seg" role="group" aria-label="${over ? 'Nuova partita' : 'Grandezza della griglia'}"><span class="seg-label">${over ? 'Nuova partita:' : 'Griglia:'}</span>` +
        G.SIZES.map(k => `<button class="chipbtn" type="button" data-act="size" data-size="${k}" aria-pressed="${!over && q.R === k}">${k}×${k}</button>`).join('') +
        '</div>';
