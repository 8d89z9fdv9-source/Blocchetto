<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blocchetto della buonanotte</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Blocchetto della buonanotte">
<meta name="theme-color" content="#D2ECDB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101814" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blocchetto">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Patrick+Hand&display=swap">
<style>
:root {
  /* Layout: a pocket game pad. Mint cover, three coloured tabs that tuck under the open page; each page is a coloured frame around rounded paper cards, marks drawn with a red and a blue felt-tip. */
  --bg: #D2ECDB;
  --ink: #1D2340;
  --ink-soft: #4A5270;
  --paper: #F7F5F0;
  --paper-2: #E9E5DC;
  --imp: #7066D4;
  --qua: #3570DA;
  --tris: #E0662C;
  --imp-print: #7066D4;
  --qua-print: #3570DA;
  --tris-print: #EE9B72;
  --pen-a: #D3312A;
  --pen-b: #233C9C;
  --on-frame: #FFFFFF;
  --live: #23935A;
  --muted: #8B90A0;
  --scrim: rgba(17, 22, 40, .45);
  --shadow: 0 1px 0 rgba(29, 35, 64, .05), 0 12px 26px -16px rgba(29, 35, 64, .45);
  --f-ui: "Figtree", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-hand: "Patrick Hand", "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101814; --ink: #E8ECF5; --ink-soft: #AAB2C6; --paper: #1E2332; --paper-2: #2B3144;
    --imp: #5A51BE; --qua: #2C5DB9; --tris: #B9552A;
    --imp-print: #A99FF5; --qua-print: #86A6F0; --tris-print: #C9774F;
    --pen-a: #FF8678; --pen-b: #9DB3FF; --on-frame: #FFFFFF; --live: #57D18F; --muted: #7F8699;
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 12px 26px -16px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101814; --ink: #E8ECF5; --ink-soft: #AAB2C6; --paper: #1E2332; --paper-2: #2B3144;
  --imp: #5A51BE; --qua: #2C5DB9; --tris: #B9552A;
  --imp-print: #A99FF5; --qua-print: #86A6F0; --tris-print: #C9774F;
  --pen-a: #FF8678; --pen-b: #9DB3FF; --on-frame: #FFFFFF; --live: #57D18F; --muted: #7F8699;
  --scrim: rgba(0, 0, 0, .6); --shadow: 0 12px 26px -16px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 40px;
  display: grid; gap: 16px;
}

/* cover */
.cover { display: grid; gap: 12px; }
.cover-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.cover h1 { margin: 0; font-size: clamp(27px, 7.4vw, 36px); font-weight: 800; line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance; }
.cover .sub { margin: 8px 0 0; font-size: 15px; color: var(--ink-soft); max-width: 32ch; }
.pill { flex: none; font: 700 14px/1 var(--f-ui); color: var(--ink); background: transparent; border: 2px solid var(--ink); border-radius: 999px; padding: 9px 13px; cursor: pointer; }
@media (hover: hover) { .pill:hover { background: var(--ink); color: var(--bg); } }
.who { display: flex; flex-wrap: wrap; gap: 8px; min-height: 32px; }
.chip { display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: 100%; padding: 6px 12px 6px 9px; border-radius: 999px; background: var(--paper); font-size: 14px; font-weight: 700; box-shadow: var(--shadow); }
.chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip .state { font-weight: 500; color: var(--ink-soft); white-space: nowrap; }
.inkdot { width: 11px; height: 11px; border-radius: 50%; background: var(--c); flex: none; }
.chip.here .inkdot { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--live); }

/* tabs tucked under the page */
.book { display: grid; }
.tabs { position: relative; z-index: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; margin-bottom: -18px; padding-inline: 4px; }
.tab {
  position: relative; border: 0; border-radius: 14px 14px 8px 8px; padding: 13px 6px 30px;
  color: var(--on-frame); font: 800 16px/1.1 var(--f-ui); letter-spacing: .01em; cursor: pointer;
  transform: translateY(8px) rotate(var(--tilt)); transition: transform .2s ease; box-shadow: var(--shadow);
}
.tab[aria-selected="true"] { transform: none; }
.tab-imp { background: var(--imp); --tilt: -2deg; }
.tab-qua { background: var(--qua); --tilt: 1.5deg; }
.tab-tris { background: var(--tris); --tilt: -1deg; }
.tab .badge { position: absolute; top: -6px; right: -4px; width: 17px; height: 17px; border-radius: 50%; background: var(--paper); box-shadow: 0 0 0 3px var(--c, var(--ink)); }

/* page */
.page { position: relative; z-index: 1; --frame: var(--imp); --print: var(--imp-print); background: var(--frame); border-radius: 22px; padding: 14px 12px 12px; display: grid; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
.page[data-game="qua"] { --frame: var(--qua); --print: var(--qua-print); }
.page[data-game="tris"] { --frame: var(--tris); --print: var(--tris-print); }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px; min-width: 0; }
.page-head h2 { margin: 0; color: var(--on-frame); font-size: 21px; font-weight: 800; flex: none; }
.score { display: inline-flex; align-items: center; gap: 8px; min-width: 0; padding: 6px 12px; border-radius: 999px; background: var(--paper); font-weight: 700; font-size: 14px; }
.sc-n { color: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; max-width: 7.5em; }
.sc-p { font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
.sc-sep { margin: 0 3px; color: var(--muted); }
.card { background: var(--paper); border-radius: 16px; padding: 16px; min-width: 0; }
.panel { background: var(--paper); border-radius: 16px; padding: 14px 16px; display: grid; gap: 12px; min-width: 0; }
.status { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.4; text-wrap: pretty; }
.ink-name { color: var(--c); font-weight: 800; }
.count { display: inline-block; margin-left: 4px; font-size: 14px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.reveal { font-family: var(--f-hand); font-size: 21px; letter-spacing: .05em; }
.tally { display: inline-flex; gap: 12px; margin-left: 6px; font-family: var(--f-hand); font-size: 21px; font-weight: 400; vertical-align: -1px; }
.tally span { color: var(--c); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.note { margin: 0; padding: 0 4px; font-size: 14px; color: var(--ink-soft); text-wrap: pretty; }

/* buttons */
.btn { font: 700 16px/1 var(--f-ui); padding: 13px 20px; border-radius: 999px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.small { padding: 9px 14px; font-size: 14px; }
@media (hover: hover) { .btn:hover { filter: brightness(1.1); } }
.seg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.seg-label { font-size: 14px; font-weight: 700; color: var(--ink-soft); margin-right: 4px; }
.chipbtn { font: 700 15px/1 var(--f-ui); padding: 10px 13px; border-radius: 999px; border: 2px solid var(--paper-2); background: transparent; cursor: pointer; font-variant-numeric: tabular-nums; }
.chipbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.symbtn { width: 44px; height: 44px; padding: 7px; border-radius: 12px; border: 2px solid transparent; background: transparent; cursor: pointer; }
.symbtn svg { width: 100%; height: 100%; display: block; overflow: visible; }
.symbtn[aria-pressed="true"] { border-color: var(--ink); background: var(--paper-2); }

/* pen and print */
.pen { fill: none; stroke: var(--c, var(--ink)); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.pen.thin { stroke-width: 2.6; }
.pen.sym { stroke-width: 7; }
.pen.edge-line { stroke-width: 3.6; }
.pen.edge-line.last { stroke-width: 5.2; }
.print { fill: none; stroke: var(--print); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.fresh { animation: draw .5s cubic-bezier(.3, .7, .4, 1) both; }
.win-line .fresh { animation-delay: .35s; }
@keyframes draw {
  0% { stroke-dasharray: 1 1; stroke-dashoffset: 1; }
  99% { stroke-dasharray: 1 1; stroke-dashoffset: 0; }
  100% { stroke-dasharray: none; stroke-dashoffset: 0; }
}
.pop { animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both; transform-box: fill-box; transform-origin: center; display: inline-block; }
@keyframes pop { from { opacity: 0; transform: scale(.4) rotate(-12deg); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .fresh, .pop { animation: none; }
  .tab { transition: none; }
}

/* hangman */
.hang { display: grid; justify-items: center; gap: 14px; }
.gallows { width: min(100%, 250px); height: auto; overflow: visible; }
.hint { margin: -6px 0 0; font-family: var(--f-hand); font-size: 21px; color: var(--ink-soft); text-align: center; }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; max-width: 100%; font-size: var(--fs, 32px); }
.slots .w { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.slot { width: 1.05em; height: 1.35em; border-bottom: 3px solid var(--print); display: grid; place-items: end center; font-family: var(--f-hand); line-height: 1; padding-bottom: .06em; }
.punct { font-family: var(--f-hand); line-height: 1.35; }
.ch { color: var(--c); }
.ch.ghost { color: var(--muted); opacity: .55; }
.ch.miss { color: var(--muted); }
.slots.empty { width: min(100%, 260px); height: 1.3em; border-bottom: 3px dashed var(--print); opacity: .6; }
.abc { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 2px 4px; }
.abc.waiting .key:not(.used) { opacity: .55; }
.key { position: relative; height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--print); font: 800 20px/1 var(--f-ui); cursor: pointer; }
.key:disabled { cursor: default; }
.key.used { color: var(--muted); }
.key.hit { color: var(--ink); }
.key .mark { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); overflow: visible; pointer-events: none; }
@media (hover: hover) { .key:not(:disabled):hover { background: var(--paper-2); } }

/* dots and boxes */
.dots { display: block; width: 100%; height: auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.dot { fill: var(--print); pointer-events: none; }
.ini { font-family: var(--f-hand); font-size: 34px; fill: var(--c); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.edge { cursor: pointer; }
.edge .hit { fill: transparent; }
.edge .ghost { stroke: var(--c); stroke-width: 4; stroke-linecap: round; opacity: 0; transition: opacity .12s; }
@media (hover: hover) { .edge:hover .ghost { opacity: .4; } }

/* tic-tac-toe */
.tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tb { position: relative; aspect-ratio: 1 / 1; border-radius: 14px; background: var(--paper); }
.tb.future { opacity: .5; }
.tb.active { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--ink); }
.cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); border-radius: 14px; overflow: hidden; }
.cell { display: grid; place-items: center; min-width: 0; min-height: 0; padding: 14%; border: 0; border-right: 2px solid var(--print); border-bottom: 2px solid var(--print); background: transparent; }
.cell:nth-child(3n) { border-right: 0; }
.cell:nth-child(n+7) { border-bottom: 0; }
button.cell { cursor: pointer; }
@media (hover: hover) { button.cell:hover { background: var(--paper-2); } }
.cell svg { width: 100%; height: 100%; display: block; overflow: visible; }
.win-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.win-line .pen { stroke-width: 6; }

/* forms and the names sheet */
.form { display: grid; gap: 10px; }
.lbl { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
.opt { font-weight: 500; }
.line-input { width: 100%; font: 25px/1.2 var(--f-hand); color: var(--ink); background: transparent; border: 0; border-bottom: 3px solid var(--print, var(--ink-soft)); border-radius: 0; padding: 4px 2px 6px; letter-spacing: .04em; }
.line-input:focus { outline: none; border-bottom-color: var(--ink); }
.line-input::placeholder { color: var(--muted); opacity: 1; }
.line-input.secret { -webkit-text-security: disc; }
.err { margin: 0; min-height: 1.2em; color: var(--pen-a); font-size: 14px; font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.sheet {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: end center; background: var(--scrim);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
@media (min-width: 640px) { .sheet { place-items: center; } }
.sheet-card { width: min(100%, 480px); max-height: calc(100% - 8px); overflow: auto; background: var(--paper); border-radius: 22px; padding: 18px; display: grid; gap: 16px; box-shadow: var(--shadow); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h3 { margin: 0; font-size: 22px; font-weight: 800; }
.seat { display: grid; gap: 8px; padding-top: 14px; border-top: 2px solid var(--paper-2); }
.seat-top { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.seat-top .tag { font-weight: 600; color: var(--ink-soft); font-size: 14px; }
.seat-name { margin: 0; font-family: var(--f-hand); font-size: 24px; color: var(--c); }
.ask { margin: 0; font-weight: 600; }

/* iPhone: safe areas, no zoom on double tap, no text selection while playing */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { min-height: 100dvh; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); touch-action: manipulation; }
.book, .tabs, .call, .ring, .gate { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.cover-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.pill { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; }
.pill svg { width: 18px; height: 18px; flex: none; }
.pill.call-pill { background: var(--ink); color: var(--bg); }
.note .row { margin-top: 10px; }

/* the call window: dark on purpose, it frames a camera picture */
.call { position: fixed; z-index: 40; left: 0; top: 0; width: 132px; border-radius: 18px; overflow: hidden; background: #0E1220; box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .55); touch-action: none; }
.call.big { width: min(calc(100vw - 24px), 440px); }
.call-video { position: relative; aspect-ratio: 3 / 4; background: #0E1220; }
.call.big .call-video { max-height: 62dvh; width: 100%; }
.call video { display: block; object-fit: cover; background: #0E1220; }
#remote { position: absolute; inset: 0; width: 100%; height: 100%; }
#local { position: absolute; right: 6px; bottom: 6px; width: 34%; aspect-ratio: 3 / 4; border-radius: 10px; transform: scaleX(-1); box-shadow: 0 0 0 2px rgba(255, 255, 255, .85); }
.call-msg { position: absolute; left: 8px; right: 8px; top: 8px; margin: 0; color: #FFFFFF; font-size: 13px; font-weight: 700; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); }
.tap-audio { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap; background: #FFFFFF; color: #0E1220; border-color: #FFFFFF; }
.call-bar { display: flex; justify-content: space-between; gap: 4px; padding: 6px; background: #0E1220; }
.call.big .call-bar { justify-content: center; gap: 14px; padding: 10px; }
.cbtn { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .16); color: #FFFFFF; cursor: pointer; }
.cbtn svg { width: 16px; height: 16px; }
.cbtn.off { background: #FFFFFF; color: #0E1220; }
.cbtn.end { background: #E5484D; }
.call.big .cbtn { width: 48px; height: 48px; }
.call.big .cbtn svg { width: 22px; height: 22px; }

.ring { position: fixed; z-index: 50; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%); width: min(calc(100vw - 24px), 420px); display: grid; gap: 12px; padding: 16px; border-radius: 20px; background: var(--paper); color: var(--ink); box-shadow: var(--shadow), 0 0 0 3px var(--c, var(--ink)); }
.ring p { margin: 0; font-size: 18px; font-weight: 800; }
.btn.ok { background: #1F9D57; border-color: #1F9D57; color: #FFFFFF; }

.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%); width: max-content; max-width: min(calc(100vw - 32px), 420px); padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 600; box-shadow: var(--shadow); }

.gate { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: var(--bg); padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.gate-card { width: min(100%, 400px); display: grid; gap: 14px; text-align: center; }
.gate h2 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
.gate p { margin: 0 0 6px; color: var(--ink-soft); }
.who-btn { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 20px; border: 0; border-radius: 18px; background: var(--paper); color: var(--c); font: 800 22px/1 var(--f-ui); box-shadow: var(--shadow); cursor: pointer; }
.who-btn .inkdot { width: 16px; height: 16px; }
.link-box { width: 100%; padding: 11px 12px; border: 2px solid var(--paper-2); border-radius: 12px; background: var(--bg); color: var(--ink); font: 600 16px/1.3 var(--f-ui); }
</style>
</head>
<body>
<div class="wrap">
  <header class="cover">
    <div>
      <h1>Blocchetto della buonanotte</h1>
      <div class="cover-actions">
        <button class="pill call-pill" id="call-btn" type="button" data-act="call"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.5" width="13" height="11" rx="2.5"/><path d="M15.5 11l6-3.5v9l-6-3.5"/></svg><span id="call-btn-label">Chiama</span></button>
        <button class="pill" id="open-sheet" type="button" data-act="open-sheet">Impostazioni</button>
      </div>
    </div>
    <div class="who" id="who"></div>
  </header>

  <div class="book">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Giochi">
      <button class="tab tab-imp" id="tab-imp" type="button" role="tab" aria-controls="page" data-act="tab" data-tab="imp">Impiccato<span class="badge" hidden><span class="sr">tocca a te</span></span></button>
      <button class="tab tab-qua" id="tab-qua" type="button" role="tab" aria-controls="page" data-act="tab" data-tab="qua">Quadratini<span class="badge" hidden><span class="sr">tocca a te</span></span></button>
      <button class="tab tab-tris" id="tab-tris" type="button" role="tab" aria-controls="page" data-act="tab" data-tab="tris">Tris<span class="badge" hidden><span class="sr">tocca a te</span></span></button>
    </nav>
    <section class="page" id="page" role="tabpanel" data-game="imp" aria-labelledby="tab-imp">
      <div class="page-head"><h2 id="page-title">Impiccato</h2><div class="score" id="page-score"></div></div>
      <div id="board"></div>
      <div class="panel">
        <p class="status" id="status" aria-live="polite"></p>
        <div class="controls" id="controls" hidden></div>
      </div>
    </section>
  </div>

<script id="logic">
const Game = (() => {
  const SYMS = ['x', 'o', 's', 'h', 'n', 'f', 'l', 'u'];
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const MAX_WRONG = 6;
  const SIZES = [3, 4, 5, 6];
  const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  const INVISIBLE = /[\u0000-\u001f\u007f-\u009f\u00ad\u200b\u200c\u200e\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g;

  const other = s => (s === 'a' ? 'b' : 'a');
  const isSeat = s => s === 'a' || s === 'b';
  const seatOr = (s, d) => (isSeat(s) ? s : d);
  const clone = o => JSON.parse(JSON.stringify(o));
  const setAt = (str, i, ch) => str.slice(0, i) + ch + str.slice(i + 1);
  const int = (v, d) => (typeof v === 'number' && Number.isFinite(v) ? Math.trunc(v) : d);
  const intIn = (v, lo, hi, d) => { const n = int(v, d); return n >= lo && n <= hi ? n : d; };
  const blankPlayer = s => ({ id: null, nick: '', sym: s === 'a' ? 'x' : 'o' });

  function cleanText(raw, max) {
    const s = String(raw == null ? '' : raw).replace(/[\t\n\r]/g, ' ').replace(INVISIBLE, '').replace(/\s+/g, ' ').trim();
    return Array.from(s).filter(ch => !(ch.length === 1 && ch >= '\ud800' && ch <= '\udfff')).slice(0, max).join('').trim();
  }

  // Secret words keep only A-Z, spaces, apostrophes and hyphens; accents are dropped (PERCHÉ -> PERCHE).
  function normWord(raw) {
    return String(raw == null ? '' : raw)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toUpperCase()
      .replace(/[\u2018\u2019\u0060\u00b4]/g, "'")
      .replace(/[^A-Z' -]/g, '')
      .replace(/\s+/g, ' ')
      .replace(/-{2,}/g, '-')
      .replace(/'{2,}/g, "'")
      .trim()
      .slice(0, 24)
      .trim();
  }

  // Not secure, just not readable at a glance in shared data.
  function enc(word) {
    let s = '';
    for (let i = 0; i < word.length; i++) s += String.fromCharCode(word.charCodeAt(i) ^ 23);
    return btoa(s).split('').reverse().join('');
  }
  function dec(code) {
    try {
      const b = atob(String(code || '').split('').reverse().join(''));
      let s = '';
      for (let i = 0; i < b.length; i++) s += String.fromCharCode(b.charCodeAt(i) ^ 23);
      return s && normWord(s) === s ? s : '';
    } catch (e) {
      return '';
    }
  }

  function emptyQua(R, C, first, n) {
    return { R, C, h: '0'.repeat((R + 1) * C), v: '0'.repeat(R * (C + 1)), bx: '0'.repeat(R * C), turn: first, first, last: '', mk: 0, n };
  }
  function emptyBoard(first) {
    return { c: ['', '', '', '', '', '', '', '', ''], f: first };
  }
  function fresh() {
    return {
      v: 1, rev: 0, ts: 0, by: '',
      players: { a: blankPlayer('a'), b: blankPlayer('b') },
      score: { imp: { a: 0, b: 0 }, qua: { a: 0, b: 0 }, tris: { a: 0, b: 0 } },
      imp: { phase: 'setup', setter: 'a', w: '', hint: '', g: '', n: 1 },
      qua: emptyQua(4, 4, 'a', 1),
      tris: { boards: [emptyBoard('a')], page: 1, lm: -1 },
    };
  }

  function impView(imp) {
    const word = imp.phase === 'play' ? dec(imp.w) : '';
    const set = new Set(word.replace(/[^A-Z]/g, ''));
    const wrong = [];
    for (const ch of imp.g) if (!set.has(ch)) wrong.push(ch);
    const lost = wrong.length >= MAX_WRONG;
    let won = set.size > 0 && !lost;
    if (won) for (const ch of set) if (!imp.g.includes(ch)) { won = false; break; }
    return { word, set, wrong, won, lost, over: imp.phase === 'play' && (won || lost), guesser: other(imp.setter) };
  }

  function trisResult(c) {
    for (const ln of LINES) {
      const s = c[ln[0]] ? c[ln[0]][0] : '';
      if (s && c[ln[1]] && c[ln[1]][0] === s && c[ln[2]] && c[ln[2]][0] === s) return { win: s, line: ln };
    }
    return c.every(Boolean) ? { draw: true } : null;
  }
  function trisTurn(b) {
    return b.c.filter(Boolean).length % 2 === 0 ? b.f : other(b.f);
  }
  function trisActive(t) {
    const i = t.boards.length - 1;
    return i < 0 || trisResult(t.boards[i].c) ? -1 : i;
  }

  function quaCount(q) {
    let a = 0, b = 0;
    for (const ch of q.bx) { if (ch === 'a') a++; else if (ch === 'b') b++; }
    return { a, b };
  }
  const quaOver = q => !q.bx.includes('0');
  const quaStarted = q => /[ab]/.test(q.h) || /[ab]/.test(q.v);
  function edgeBoxes(q, k, i) {
    const R = q.R, C = q.C, out = [];
    if (k === 'h') {
      const r = Math.floor(i / C), c = i % C;
      if (r > 0) out.push((r - 1) * C + c);
      if (r < R) out.push(r * C + c);
    } else {
      const r = Math.floor(i / (C + 1)), c = i % (C + 1);
      if (c > 0) out.push(r * C + c - 1);
      if (c < C) out.push(r * C + c);
    }
    return out;
  }
  function boxClosed(q, b) {
    const C = q.C, r = Math.floor(b / C), c = b % C;
    return q.h[r * C + c] !== '0' && q.h[(r + 1) * C + c] !== '0' && q.v[r * (C + 1) + c] !== '0' && q.v[r * (C + 1) + c + 1] !== '0';
  }

  function turnOf(S, g) {
    if (g === 'imp') {
      const v = impView(S.imp);
      if (v.over) return null;
      return S.imp.phase === 'setup' ? S.imp.setter : v.guesser;
    }
    if (g === 'qua') return quaOver(S.qua) ? null : S.qua.turn;
    if (g === 'tris') {
      const i = trisActive(S.tris);
      return i < 0 ? null : trisTurn(S.tris.boards[i]);
    }
    return null;
  }

  // Every change goes through here: returns the next state, or null when the move is not allowed.
  function apply(S, a) {
    if (!S || !a || typeof a !== 'object') return null;
    const N = clone(S);
    const s = a.seat;
    switch (a.t) {
      case 'seat': {
        if (!isSeat(s) || typeof a.id !== 'string' || !a.id || N.players[s].id === a.id) return null;
        const o = other(s);
        if (N.players[o].id === a.id) N.players[o] = blankPlayer(o);
        N.players[s] = { id: a.id, nick: '', sym: blankPlayer(s).sym };
        return N;
      }
      case 'free': {
        if (!isSeat(s) || !isSeat(a.which) || !N.players[a.which].id) return null;
        N.players[a.which] = blankPlayer(a.which);
        return N;
      }
      case 'nick': {
        if (!isSeat(s)) return null;
        const nick = cleanText(a.nick, 16);
        if (N.players[s].nick === nick) return null;
        N.players[s].nick = nick;
        return N;
      }
      case 'sym': {
        if (!isSeat(s) || !SYMS.includes(a.sym) || N.players[s].sym === a.sym) return null;
        N.players[s].sym = a.sym;
        return N;
      }
      case 'scores0': {
        if (!isSeat(s)) return null;
        N.score = fresh().score;
        return N;
      }
      case 'imp.set': {
        const imp = N.imp;
        if (imp.phase !== 'setup' || s !== imp.setter) return null;
        const word = normWord(a.word);
        if (word.replace(/[^A-Z]/g, '').length < 2) return null;
        N.imp = { phase: 'play', setter: imp.setter, w: enc(word), hint: cleanText(a.hint, 40), g: '', n: imp.n };
        return N;
      }
      case 'imp.swap': {
        if (!isSeat(s) || N.imp.phase !== 'setup') return null;
        N.imp.setter = other(N.imp.setter);
        return N;
      }
      case 'imp.cancel': {
        const v = impView(N.imp);
        if (N.imp.phase !== 'play' || v.over || s !== N.imp.setter) return null;
        N.imp = { phase: 'setup', setter: N.imp.setter, w: '', hint: '', g: '', n: N.imp.n + 1 };
        return N;
      }
      case 'imp.guess': {
        const imp = N.imp, v = impView(imp);
        if (imp.phase !== 'play' || v.over || s !== v.guesser) return null;
        const ch = typeof a.ch === 'string' ? a.ch : '';
        if (ch.length !== 1 || !LETTERS.includes(ch) || imp.g.includes(ch)) return null;
        imp.g += ch;
        const after = impView(imp);
        if (after.won) N.score.imp[after.guesser] += 1;
        else if (after.lost) N.score.imp[imp.setter] += 1;
        return N;
      }
      case 'imp.next': {
        if (!isSeat(s) || !impView(N.imp).over) return null;
        N.imp = { phase: 'setup', setter: other(N.imp.setter), w: '', hint: '', g: '', n: N.imp.n + 1 };
        return N;
      }
      case 'qua.line': {
        const q = N.qua;
        if (quaOver(q) || s !== q.turn) return null;
        const k = a.k, i = a.i;
        if ((k !== 'h' && k !== 'v') || !Number.isInteger(i)) return null;
        const line = k === 'h' ? q.h : q.v;
        if (i < 0 || i >= line.length || line[i] !== '0') return null;
        if (k === 'h') q.h = setAt(q.h, i, s); else q.v = setAt(q.v, i, s);
        let made = 0;
        for (const b of edgeBoxes(q, k, i)) {
          if (q.bx[b] === '0' && boxClosed(q, b)) { q.bx = setAt(q.bx, b, s); made++; }
        }
        q.last = k + i;
        q.mk = made;
        if (!made) q.turn = other(s);
        if (quaOver(q)) {
          const n = quaCount(q);
          if (n.a !== n.b) N.score.qua[n.a > n.b ? 'a' : 'b'] += 1;
        }
        return N;
      }
      case 'qua.new': {
        if (!isSeat(s)) return null;
        const q = N.qua;
        const size = SIZES.includes(a.size) ? a.size : q.R;
        const started = quaStarted(q);
        if (started && !quaOver(q) && a.force !== true) return null;
        if (!started && size === q.R && size === q.C) return null;
        const first = started ? other(q.first) : q.first;
        N.qua = emptyQua(size, size, first, started ? q.n + 1 : q.n);
        return N;
      }
      case 'tris.play': {
        const t = N.tris, bi = trisActive(t);
        if (bi < 0) return null;
        const b = t.boards[bi];
        if (s !== trisTurn(b)) return null;
        const i = a.i;
        if (!Number.isInteger(i) || i < 0 || i > 8 || b.c[i]) return null;
        b.c[i] = s + N.players[s].sym;
        t.lm = bi * 9 + i;
        const r = trisResult(b.c);
        if (r) {
          if (r.win) N.score.tris[r.win] += 1;
          if (t.boards.length < 6) t.boards.push(emptyBoard(other(b.f)));
        }
        return N;
      }
      case 'tris.page': {
        const t = N.tris;
        if (!isSeat(s) || trisActive(t) >= 0) return null;
        const last = t.boards[t.boards.length - 1];
        N.tris = { boards: [emptyBoard(other(last.f))], page: t.page + 1, lm: -1 };
        return N;
      }
      default:
        return null;
    }
  }

  // Shared data is untrusted: rebuild a well-formed state from whatever arrives.
  function sanitize(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
    const st = fresh();
    st.rev = Math.max(0, int(raw.rev, 0));
    st.ts = Math.max(0, int(raw.ts, 0));
    st.by = typeof raw.by === 'string' ? raw.by.slice(0, 120) : '';
    const P = raw.players && typeof raw.players === 'object' ? raw.players : {};
    for (const s of ['a', 'b']) {
      const p = P[s] && typeof P[s] === 'object' ? P[s] : {};
      st.players[s] = {
        id: typeof p.id === 'string' && p.id && p.id.length <= 200 ? p.id : null,
        nick: cleanText(p.nick, 16),
        sym: SYMS.includes(p.sym) ? p.sym : blankPlayer(s).sym,
      };
    }
    const SC = raw.score && typeof raw.score === 'object' ? raw.score : {};
    for (const g of ['imp', 'qua', 'tris']) for (const s of ['a', 'b']) st.score[g][s] = intIn(SC[g] && SC[g][s], 0, 99999, 0);

    const I = raw.imp && typeof raw.imp === 'object' ? raw.imp : {};
    st.imp = {
      phase: I.phase === 'play' ? 'play' : 'setup',
      setter: seatOr(I.setter, 'a'),
      w: typeof I.w === 'string' ? I.w.slice(0, 80) : '',
      hint: cleanText(I.hint, 40),
      g: Array.from(new Set(String(I.g || '').replace(/[^A-Z]/g, ''))).join(''),
      n: intIn(I.n, 1, 1e9, 1),
    };
    if (st.imp.phase === 'play' && !dec(st.imp.w)) st.imp.phase = 'setup';
    if (st.imp.phase === 'setup') { st.imp.w = ''; st.imp.hint = ''; st.imp.g = ''; }

    const Q = raw.qua && typeof raw.qua === 'object' ? raw.qua : {};
    const R = intIn(Q.R, 3, 6, 4), C = intIn(Q.C, 3, 6, 4);
    const okLine = (v, len) => typeof v === 'string' && v.length === len && /^[0ab]*$/.test(v);
    if (okLine(Q.h, (R + 1) * C) && okLine(Q.v, R * (C + 1)) && okLine(Q.bx, R * C)) {
      st.qua = {
        R, C, h: Q.h, v: Q.v, bx: Q.bx,
        turn: seatOr(Q.turn, 'a'), first: seatOr(Q.first, 'a'),
        last: typeof Q.last === 'string' && /^[hv]\d{1,3}$/.test(Q.last) ? Q.last : '',
        mk: intIn(Q.mk, 0, 2, 0), n: intIn(Q.n, 1, 1e9, 1),
      };
    } else {
      st.qua = emptyQua(R, C, seatOr(Q.first, 'a'), intIn(Q.n, 1, 1e9, 1));
    }

    const T = raw.tris && typeof raw.tris === 'object' ? raw.tris : {};
    const boards = (Array.isArray(T.boards) ? T.boards : []).slice(0, 6).map(b => {
      const c = b && Array.isArray(b.c) ? b.c : [];
      return {
        c: Array.from({ length: 9 }, (_, k) => (typeof c[k] === 'string' && /^[ab][xoshnflu]$/.test(c[k]) ? c[k] : '')),
        f: seatOr(b && b.f, 'a'),
      };
    });
    st.tris = { boards: boards.length ? boards : [emptyBoard('a')], page: intIn(T.page, 1, 1e9, 1), lm: intIn(T.lm, -1, 53, -1) };
    return st;
  }

  // Highest revision wins; ties are broken the same way on every device.
  function newer(x, y) {
    if (x.rev !== y.rev) return x.rev > y.rev;
    if (x.ts !== y.ts) return x.ts > y.ts;
    return x.by > y.by;
  }

  return {
    SYMS, LETTERS, MAX_WRONG, SIZES, other, fresh, apply, sanitize, newer, impView,
    trisResult, trisTurn, trisActive, quaCount, quaOver, quaStarted, edgeBoxes, turnOf, normWord, enc, dec, cleanText,
  };
})();
</script>
<script>
(() => {

  const store = {

  };

  function cleanCode(c) {
    const s = String(c || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 24);

  const params = new URLSearchParams(location.hash.slice(1));
  const code = cleanCode(params.get('k')) || cleanCode(store.get('blocchetto.code')) || newCode();
  store.set('blocchetto.code', code);
  let seat = seatOr(params.get('p')) || seatOr(store.get('blocchetto.seat.' + code));
  function rememberSeat() {
    if (seat) store.set('blocchetto.seat.' + code, seat);
    history.replaceState(null, '', `${location.pathname}${location.search}#k=${code}${seat ? '&p=' + seat : ''}`);
  }

  const peerId = s => PEER_PREFIX + code + '-' + s;

  const intIn = (v, lo, hi) => (typeof v === 'number' && Number.isFinite(v) && v >= lo && v <= hi ? Math.trunc(v) : 0);
  function cleanMeta(m) {

    for (const sec of SECS) {

  function load() {
    let raw = null;
    try { raw = JSON.parse(store.get(stateKey()) || 'null'); } catch (e) { raw = null; }
    const st = raw && G.sanitize(raw);
    S = withMeta(st || G.fresh(), st ? raw.meta : null);

  function save() { if (seat) store.set(stateKey(), JSON.stringify(S)); }

  // Each game (and the names) carries its own version, so two moves in different games never overwrite each other.
  function newerMeta(x, y) {
    if (x.v !== y.v) return x.v > y.v;
    if (x.ts !== y.ts) return x.ts > y.ts;

  }
  function act(a) {

    const base = {};
    for (const sec of secs) {
      base[sec] = S.meta[sec].v;
      N.meta[sec] = { v: S.meta[sec].v + 1, ts: Date.now(), by: seat };
    }
    S = N;
    save();
    pushSections(secs, base);
    render();

    return `<span class="sc-n" style="--c:var(--pen-a)">${esc(nameOf('a'))}</span><span class="sc-p">${sc.a}<span class="sc-sep">–</span>${sc.b}</span><span class="sc-n" style="--c:var(--pen-b)">${esc(nameOf('b'))}</span>`;
  }
  function symPicker(s, label) {
    const cur = S.players[s].sym;
    return `<div class="seg syms" role="group" aria-label="${label}"><span class="seg-label">${label}:</span>` +
      G.SYMS.map(k => `<button class="symbtn" type="button" data-act="sym" data-sym="${k}" aria-pressed="${k === cur}" aria-label="${SYM_NAMES[k]}">${symSVG(k, s, 'pick' + k, false)}</button>`).join('') +
      '</div>';
  }

  function viewImp(anim) {
    const imp = S.imp, v = G.impView(imp), setter = imp.setter, guesser = v.guesser, n = imp.n;
    const last = imp.g.slice(-1);
    const lastWrong = anim && last && !v.set.has(last);
    const lastRight = anim && last && v.set.has(last);
    const parts = imp.phase === 'play' ? Math.min(v.wrong.length, G.MAX_WRONG) : 0;
    const P = [
      penCircle(172, 62, 17, 'hd' + n), penLine(172, 79, 173, 138, 'bd' + n),
      penLine(172, 96, 148, 122, 'la' + n), penLine(172, 96, 197, 121, 'ra' + n),
      penLine(173, 138, 152, 182, 'll' + n), penLine(173, 138, 194, 181, 'rl' + n),
    ];
    let svg = `<svg class="gallows" viewBox="0 0 240 226" role="img" aria-label="Errori ${parts} su ${G.MAX_WRONG}"><path class="print" d="M22 212 H150 M42 212 V24 H172 M42 62 L80 24 M172 24 V45"/>`;
    for (let i = 0; i < parts; i++) svg += `<path class="pen${lastWrong && i === parts - 1 ? ' fresh' : ''}" pathLength="1" style="--c:var(--pen-${setter})" d="${P[i]}"/>`;
    if (v.lost) svg += `<path class="pen thin${anim ? ' fresh' : ''}" pathLength="1" style="--c:var(--pen-${setter})" d="M163 56 l6 6 M169 56 l-6 6 M175 56 l6 6 M181 56 l-6 6"/>`;
    svg += '</svg>';

    let body = '';
    if (imp.phase === 'play') {
      const showGhost = seat === setter;
      const longest = Math.max(...v.word.split(' ').map(w => w.length));
      const fs = longest <= 8 ? 32 : longest <= 11 ? 26 : longest <= 14 ? 22 : 18;
      if (imp.hint) body += `<p class="hint">indizio: ${esc(imp.hint)}</p>`;
      body += `<div class="slots" style="--fs:${fs}px" aria-label="Parola da indovinare">`;
      for (const w of v.word.split(' ')) {
        body += '<span class="w">';
        for (const ch of w) {
          if (ch === "'" || ch === '-') { body += `<span class="punct">${ch}</span>`; continue; }
          let inner = '';
          if (imp.g.includes(ch)) inner = `<span class="ch${lastRight && ch === last ? ' pop' : ''}" style="--c:var(--pen-${setter})">${ch}</span>`;
          else if (v.lost) inner = `<span class="ch miss">${ch}</span>`;
          else if (showGhost) inner = `<span class="ch ghost">${ch}</span>`;
          body += `<span class="slot">${inner}</span>`;
        }
        body += '</span>';
      }
      body += '</div>';
      const playable = !v.over && canAct(guesser);
      body += `<div class="abc${playable || v.over ? '' : ' waiting'}" role="group" aria-label="Lettere">`;
      for (const ch of G.LETTERS) {
        const used = imp.g.includes(ch), hit = used && v.set.has(ch);
        let mark = '';
        if (used) {
          const d = hit ? penCircle(20, 20, 14, 'kc' + n + ch) : penLine(9, 31, 31, 9, 'kx' + n + ch);
          mark = `<svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><path class="pen thin${anim && ch === last ? ' fresh' : ''}" pathLength="1" style="--c:var(--pen-${guesser})" d="${d}"/></svg>`;
        }
        const label = used ? (hit ? `${ch}, c'è` : `${ch}, non c'è`) : ch;
        body += `<button class="key${used ? ' used' : ''}${hit ? ' hit' : ''}" type="button" data-act="guess" data-ch="${ch}" aria-label="${label}"${!playable || used ? ' disabled' : ''}>${ch}${mark}</button>`;
      }
      body += '</div>';
    } else {
      body += '<div class="slots empty" aria-hidden="true"></div>';
    }
    const board = `<div class="card hang">${svg}${body}</div>`;

    let status;
    if (imp.phase === 'setup') {
      status = canAct(setter) ? 'Scegli una parola.' : `${inkName(setter)} sta pensando a una parola…`;
    } else if (!v.over) {
      status = (canAct(guesser) ? 'Tocca a te.' : `${inkName(guesser)} sta provando.`) +
        (v.wrong.length ? ` <span class="count">${v.wrong.length} ${v.wrong.length === 1 ? 'errore' : 'errori'} su ${G.MAX_WRONG}</span>` : '');
    } else if (v.won) {
      status = `Indovinata! Punto per ${inkName(guesser)}.`;
    } else {
      status = `Impiccato! Era <span class="reveal">${esc(v.word)}</span>.`;
    }

    let controls = '';
    if (imp.phase === 'setup' && canAct(setter)) {
      controls = `<form id="imp-form" class="form" autocomplete="off" novalidate>
        <label class="lbl" for="imp-word">Parola</label>
        <input class="line-input" id="imp-word" name="word" type="text" maxlength="24" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next">
        <label class="lbl" for="imp-hint">Indizio <span class="opt">(se vuoi)</span></label>
        <input class="line-input" id="imp-hint" name="hint" type="text" maxlength="40" autocomplete="off" enterkeyhint="go">
        <p id="imp-err" class="err" role="alert"></p>
        <div class="row"><button class="btn" type="submit">Via</button><button class="btn ghost" type="button" data-act="imp-swap">Fai scegliere a ${esc(nameOf(other()))}</button></div>
      </form>`;
    } else if (imp.phase === 'setup' && canManage()) {
      controls = '<button class="btn ghost small" type="button" data-act="imp-swap">La scelgo io</button>';
    } else if (v.over && canManage()) {
      controls = '<button class="btn" type="button" data-act="imp-next">Nuova parola</button>';
    } else if (imp.phase === 'play' && canAct(setter) && !imp.g) {
      controls = '<button class="btn ghost small" type="button" data-act="imp-cancel">Cambia parola</button>';
    }
    return { board, status, controls };
  }

  function viewQua(anim) {
    const q = S.qua, over = G.quaOver(q), started = G.quaStarted(q), cnt = G.quaCount(q);
    const s = 60, m = 30, W = q.C * s + 2 * m, H = q.R * s + 2 * m;
    const X = c => m + c * s, Y = r => m + r * s;
    const playable = !over && canAct(q.turn);
    const freshBoxes = new Set(anim && q.last && q.mk ? G.edgeBoxes(q, q.last[0], Number(q.last.slice(1))).filter(b => q.bx[b] !== '0') : []);
    let boxes = '', lines = '', hits = '', dots = '';
    for (let b = 0; b < q.bx.length; b++) {
      const o = q.bx[b];
      if (o === '0') continue;
      const r = Math.floor(b / q.C), c = b % q.C;
      boxes += `<text class="ini${freshBoxes.has(b) ? ' pop' : ''}" x="${X(c) + s / 2}" y="${Y(r) + s / 2 + 2}" style="--c:var(--pen-${o})">${esc(initialOf(o))}</text>`;
    }
    const edge = (k, i, x1, y1, x2, y2) => {
      const o = (k === 'h' ? q.h : q.v)[i];
      if (o !== '0') {
        const isLast = q.last === k + i;
        lines += `<path class="pen edge-line${isLast ? ' last' : ''}${isLast && anim ? ' fresh' : ''}" pathLength="1" style="--c:var(--pen-${o})" d="${penLine(x1, y1, x2, y2, 'e' + q.n + k + i)}"/>`;
      } else if (playable) {
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, hs = s / 2;
        hits += `<g class="edge" data-act="line" data-k="${k}" data-i="${i}"><polygon class="hit" points="${mx - hs},${my} ${mx},${my - hs} ${mx + hs},${my} ${mx},${my + hs}"/><line class="ghost" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="--c:var(--pen-${q.turn})"/></g>`;
      }
    };
    for (let r = 0; r <= q.R; r++) for (let c = 0; c < q.C; c++) edge('h', r * q.C + c, X(c), Y(r), X(c + 1), Y(r));
    for (let r = 0; r < q.R; r++) for (let c = 0; c <= q.C; c++) edge('v', r * (q.C + 1) + c, X(c), Y(r), X(c), Y(r + 1));
    for (let r = 0; r <= q.R; r++) for (let c = 0; c <= q.C; c++) dots += `<circle class="dot" cx="${X(c)}" cy="${Y(r)}" r="3.6"/>`;
    const label = `Griglia ${q.R} per ${q.C}: ${cnt.a} quadratini a ${esc(nameOf('a'))}, ${cnt.b} a ${esc(nameOf('b'))}`;
    const board = `<div class="card"><svg class="dots" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${boxes}${lines}${hits}${dots}</svg></div>`;

    const tally = `<span class="tally" aria-hidden="true"><span style="--c:var(--pen-a)">${esc(initialOf('a'))} ${cnt.a}</span><span style="--c:var(--pen-b)">${esc(initialOf('b'))} ${cnt.b}</span></span>`;
    let status;
    if (over) status = cnt.a === cnt.b ? `Pari, ${cnt.a} a ${cnt.b}.` : `Ha vinto ${inkName(cnt.a > cnt.b ? 'a' : 'b')}, ${Math.max(cnt.a, cnt.b)} a ${Math.min(cnt.a, cnt.b)}.`;
    else if (q.mk && q.last) status = seat === q.turn ? 'Quadratino! Ancora tu.' : `Quadratino! Gioca ancora ${inkName(q.turn)}.`;
    else status = turnLine(q.turn);
    status += ' ' + tally;

    let controls = '';
    if (canManage() && (over || !started)) {
      controls = `<div class="seg" role="group" aria-label="${over ? 'Nuova partita' : 'Grandezza della griglia'}"><span class="seg-label">${over ? 'Nuova partita:' : 'Griglia:'}</span>` +
        G.SIZES.map(k => `<button class="chipbtn" type="button" data-act="size" data-size="${k}" aria-pressed="${!over && q.R === k}">${k}×${k}</button>`).join('') +
        '</div>';
    } else if (canManage() && started && !over) {
      controls = ui.confirm === 'qua'
        ? '<span class="ask">Ricominciamo?</span><button class="btn small" type="button" data-act="qua-restart">Sì</button><button class="btn small ghost" type="button" data-act="cancel">No</button>'
        : '<button class="btn ghost small" type="button" data-act="ask-qua">Ricomincia</button>';
    }
    return { board, status, controls };
  }

  function winLine(line, s, key, fresh) {
    const cx = i => 50 + (i % 3) * 100, cy = i => 50 + Math.floor(i / 3) * 100;
    let x1 = cx(line[0]), y1 = cy(line[0]), x2 = cx(line[2]), y2 = cy(line[2]);
    const len = Math.hypot(x2 - x1, y2 - y1), ex = (x2 - x1) / len * 34, ey = (y2 - y1) / len * 34;
    x1 -= ex; y1 -= ey; x2 += ex; y2 += ey;
    return `<svg class="win-line" viewBox="0 0 300 300" aria-hidden="true"><path class="pen${fresh ? ' fresh' : ''}" pathLength="1" style="--c:var(--pen-${s})" d="${penLine(x1, y1, x2, y2, key)}"/></svg>`;
  }

  function viewTris(anim) {
    const t = S.tris, active = G.trisActive(t);
    const turn = active >= 0 ? G.trisTurn(t.boards[active]) : null;
    const playable = active >= 0 && canAct(turn);
    const lastBoard = t.lm >= 0 ? Math.floor(t.lm / 9) : -1;
    let board = '<div class="tgrid">';
    for (let bi = 0; bi < 6; bi++) {
      const b = t.boards[bi];
      if (!b) {
        board += `<div class="tb future" aria-hidden="true"><div class="cells">${'<div class="cell"></div>'.repeat(9)}</div></div>`;
        continue;
      }
      const res = G.trisResult(b.c), isActive = bi === active;
      board += `<div class="tb${isActive ? ' active' : ''}"${isActive ? ' role="group" aria-label="Partita in corso"' : ''}><div class="cells">`;
      for (let i = 0; i < 9; i++) {
        const v = b.c[i];
        if (!v && isActive && playable) board += `<button class="cell" type="button" data-act="tris" data-i="${i}" aria-label="Casella ${i + 1}"></button>`;
        else board += `<div class="cell">${v ? symSVG(v[1], v[0], `c${t.page}-${bi}-${i}`, anim && t.lm === bi * 9 + i) : ''}</div>`;
      }
      board += '</div>';
      if (res && res.win) board += winLine(res.line, res.win, `w${t.page}-${bi}`, anim && lastBoard === bi);
      board += '</div>';
    }
    board += '</div>';

    let status = '';
    const doneIdx = active >= 0 ? active - 1 : t.boards.length - 1;
    const prev = doneIdx >= 0 ? t.boards[doneIdx] : null;
    const prevRes = prev ? G.trisResult(prev.c) : null;
    if (prevRes && (active < 0 || !t.boards[active].c.some(Boolean))) status = prevRes.win ? `Tris di ${inkName(prevRes.win)}! ` : 'Patta! ';
    status += active < 0 ? 'Pagina finita.' : turnLine(turn);

    let controls = '';
    if (active < 0 && canManage()) controls += '<button class="btn" type="button" data-act="page">Volta pagina</button>';
    if (seat) controls += symPicker(seat, 'Il tuo segno');
    return { board, status, controls };
  }

  function whoHTML() {
    const o = other(), name = esc(nameOf(o)), t = partnerTabNow();
    let text = `${name} non c’è`;
    if (!synced) text = 'Mi collego…';
    else if (partnerHere()) text = t ? `${name} è ${WHERE[t]}` : `${name} c’è`;
    return `<span class="chip${partnerHere() ? ' here' : ''}" style="--c:var(--pen-${o})"><span class="inkdot"></span><span class="nm">${text}</span></span>`;
  }

  function noteHTML() {
    if (netError) return `<span>${esc(netError)}</span>`;
    if (synced && !partnerHere() && store.get('blocchetto.met.' + code) !== '1') {
      return `<button class="btn small" type="button" data-act="share">Manda il link a ${esc(nameOf(other()))}</button>`;
    }
    return '';
  }

  function setHTML(el, html) {
    if (el._html === html) return;
    const focused = document.activeElement;
    const keep = focused && el.contains(focused) && focused.id && focused.tagName === 'INPUT'
      ? { id: focused.id, s: focused.selectionStart, e: focused.selectionEnd } : null;
    const vals = {};
    el.querySelectorAll('input[id]').forEach(i => { vals[i.id] = i.value; });
    el.innerHTML = html;
    el._html = html;
    for (const id in vals) {
      const i = document.getElementById(id);
      if (i && el.contains(i)) { i.value = vals[id]; i.dataset.init = '1'; }
    }
    if (keep) {
      const i = document.getElementById(keep.id);
      if (i) { i.focus({ preventScroll: true }); try { i.setSelectionRange(keep.s, keep.e); } catch (e) { /* not a text field */ } }
    }
  }

  function renderTabs() {
    for (const g of GAMES) {
      const b = $('#tab-' + g);
      b.setAttribute('aria-selected', String(g === tab));
      b.tabIndex = g === tab ? 0 : -1;
      const badge = b.querySelector('.badge');
      const yours = !!seat && G.turnOf(S, g) === seat;
      badge.hidden = !yours;
      if (yours) badge.style.setProperty('--c', `var(--pen-${seat})`);
    }
  }

  function renderSheet() {
    const el = $('#sheet');
    el.hidden = !ui.sheet;
    if (!ui.sheet) { el.innerHTML = ''; el._html = ''; return; }
    const o = other();
    let h = '<div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">';
    h += '<div class="sheet-head"><h3 id="sheet-title">Impostazioni</h3><button class="btn small" type="button" data-act="close-sheet">Fatto</button></div>';
    h += `<section class="seat" style="--c:var(--pen-${seat})"><label class="lbl" for="nick-${seat}">Il tuo nome</label><input class="line-input" id="nick-${seat}" data-nick="${seat}" type="text" maxlength="16" autocomplete="off" enterkeyhint="done">`;
    h += symPicker(seat, 'Il tuo segno nel tris') + '</section>';
    h += `<section class="seat"><div class="seat-top">Link per ${esc(nameOf(o))}</div><input class="link-box" id="link-box" type="text" readonly value="${esc(inviteLink())}" aria-label="Link per ${esc(nameOf(o))}"><div class="row"><button class="btn small" type="button" data-act="share">Manda</button><button class="btn small ghost" type="button" data-act="copy">Copia</button></div></section>`;
    h += '<section class="seat">';
    if (ui.confirm === 'scores') {
      h += '<p class="ask">Azzero tutti i punteggi?</p><div class="row"><button class="btn small" type="button" data-act="do-reset">Azzera</button><button class="btn small ghost" type="button" data-act="cancel">No</button></div>';
    } else if (ui.confirm === 'switch') {
      h += `<p class="ask">Allora sei ${esc(nameOf(o))}?</p><div class="row"><button class="btn small" type="button" data-act="do-switch">Sì</button><button class="btn small ghost" type="button" data-act="cancel">No</button></div>`;
    } else {
      h += `<div class="row"><button class="btn small ghost" type="button" data-act="ask-reset">Azzera i punteggi</button><button class="btn small ghost" type="button" data-act="ask-switch">Non sono ${esc(nameOf(seat))}</button></div>`;
    }
    h += '</section></div>';
    setHTML(el, h);
    const inp = document.getElementById('nick-' + seat);
    if (inp && inp.dataset.init !== '1') { inp.value = nameOf(seat); inp.dataset.init = '1'; }
  }

  function renderGate() {
    const g = $('#gate');
    g.hidden = !!seat;
    if (seat) return;
    setHTML(g, '<div class="gate-card"><h2>Chi sei?</h2>' +
      '<button class="who-btn" type="button" data-act="iam" data-seat="a" style="--c:var(--pen-a)"><span class="inkdot"></span>Gabri</button>' +
      '<button class="who-btn" type="button" data-act="iam" data-seat="b" style="--c:var(--pen-b)"><span class="inkdot"></span>Ivi</button></div>');
  }

  function render() {
    renderGate();
    if (!seat) return;
    const sig = JSON.stringify(S[tab]);
    let anim = false;
    if (seen.imp === undefined) { for (const g of GAMES) seen[g] = JSON.stringify(S[g]); }
    else if (seen[tab] !== sig) { seen[tab] = sig; animSig = tab + sig; animUntil = Date.now() + 900; anim = true; }
    else if (animSig === tab + sig && Date.now() < animUntil) anim = true;

    setHTML($('#who'), whoHTML());
    renderTabs();
    const page = $('#page');
    page.dataset.game = tab;
    page.setAttribute('aria-labelledby', 'tab-' + tab);
    $('#page-title').textContent = TITLES[tab];
    const v = tab === 'imp' ? viewImp(anim) : tab === 'qua' ? viewQua(anim) : viewTris(anim);
    setHTML($('#page-score'), scoreHTML(tab));
    setHTML($('#board'), v.board);
    setHTML($('#status'), v.status);
    setHTML($('#controls'), v.controls);
    $('#controls').hidden = !v.controls;
    const note = noteHTML();
    setHTML($('#note'), note);
    $('#note').hidden = !note;
    renderSheet();
    renderCall();
  }

  /* ---------- input ---------- */
  function setTab(t) {
    if (!GAMES.includes(t) || t === tab) return;
    tab = t;
    ui.confirm = '';
    store.set('blocchetto.tab', t);
    updatePresence();
    render();
  }
  function openSheet() {
    ui.sheet = true;
    ui.confirm = '';
    renderSheet();
    const b = $('#sheet [data-act="close-sheet"]');
    if (b) b.focus();
  }
  function closeSheet() {
    ui.sheet = false;
    ui.confirm = '';
    render();
    $('#open-sheet').focus();
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) {
      if (e.target.id === 'sheet') closeSheet();
      return;
    }
    if (el.disabled) return;
    const A = el.getAttribute('data-act');
    switch (A) {
      case 'iam':
        seat = seatOr(el.getAttribute('data-seat'));
        rememberSeat();
        load();
        render();
        startSync();
        startNet();
        break;
      case 'tab': setTab(el.getAttribute('data-tab')); break;
      case 'open-sheet': openSheet(); break;
      case 'close-sheet': closeSheet(); break;
      case 'share': shareInvite(); break;
      case 'copy': copyInvite(); break;
      case 'call': startCall(); break;
      case 'answer': answerCall(); break;
      case 'decline': declineCall(); break;
      case 'hangup': hangup(); break;
      case 'mic':
        micOn = !micOn;
        if (localStream) localStream.getAudioTracks().forEach(t => { t.enabled = micOn; });
        renderCall();
        break;
      case 'cam':
        camOn = !camOn;
        if (localStream) localStream.getVideoTracks().forEach(t => { t.enabled = camOn; });
        renderCall();
        break;
      case 'call-size':
        bigCall = !bigCall;
        pos.x = null;
        renderCall();
        break;
      case 'tap-audio':
        $('#remote').play().then(() => { needTap = false; renderCall(); }).catch(() => {});
        break;
      case 'guess': act({ t: 'imp.guess', seat, ch: el.getAttribute('data-ch') }); break;
      case 'imp-swap': act({ t: 'imp.swap', seat }); break;
      case 'imp-next': act({ t: 'imp.next', seat }); break;
      case 'imp-cancel': act({ t: 'imp.cancel', seat }); break;
      case 'line': act({ t: 'qua.line', seat, k: el.getAttribute('data-k'), i: Number(el.getAttribute('data-i')) }); break;
      case 'size': act({ t: 'qua.new', seat, size: Number(el.getAttribute('data-size')) }); break;
      case 'ask-qua': ui.confirm = 'qua'; render(); break;
      case 'qua-restart': ui.confirm = ''; act({ t: 'qua.new', seat, size: S.qua.R, force: true }); render(); break;
      case 'tris': act({ t: 'tris.play', seat, i: Number(el.getAttribute('data-i')) }); break;
      case 'page': act({ t: 'tris.page', seat }); break;
      case 'sym': act({ t: 'sym', seat, sym: el.getAttribute('data-sym') }); break;
      case 'ask-reset': ui.confirm = 'scores'; renderSheet(); break;
      case 'ask-switch': ui.confirm = 'switch'; renderSheet(); break;
      case 'do-reset': ui.confirm = ''; act({ t: 'scores0', seat }); renderSheet(); break;
      case 'do-switch':
        seat = other();
        rememberSeat();
        location.reload();
        break;
      case 'cancel': ui.confirm = ''; render(); break;
      default: break;
    }
  });

  document.addEventListener('submit', e => {
    if (e.target.id !== 'imp-form') return;
    e.preventDefault();
    const form = e.target;
    const word = G.normWord(form.elements.word.value);
    const err = $('#imp-err');
    if (word.replace(/[^A-Z]/g, '').length < 2) {
      err.textContent = 'Almeno due lettere, senza numeri.';
      form.elements.word.focus();
      return;
    }
    if (document.activeElement) document.activeElement.blur();
    if (!act({ t: 'imp.set', seat, word, hint: form.elements.hint.value })) err.textContent = 'Qualcosa non va, ricarica la pagina.';
  });

  document.addEventListener('change', e => {
    const s = e.target.getAttribute && e.target.getAttribute('data-nick');
    if (s && s === seat) act({ t: 'nick', seat, nick: e.target.value });
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && ui.sheet) { closeSheet(); return; }
    const tgt = e.target;
    if (ui.sheet || e.metaKey || e.ctrlKey || e.altKey) return;
    if (tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.isContentEditable)) return;
    if (tab === 'imp' && /^[a-zA-Z]$/.test(e.key)) {
      const v = G.impView(S.imp);
      if (S.imp.phase === 'play' && !v.over && canAct(v.guesser)) act({ t: 'imp.guess', seat, ch: e.key.toUpperCase() });
    }
  });

  $('#tabs').addEventListener('keydown', e => {
    const i = GAMES.indexOf(tab);
    const n = e.key === 'ArrowRight' ? (i + 1) % 3 : e.key === 'ArrowLeft' ? (i + 2) % 3 : e.key === 'Home' ? 0 : e.key === 'End' ? 2 : -1;
    if (n < 0) return;
    e.preventDefault();
    setTab(GAMES[n]);
    $('#tab-' + GAMES[n]).focus();
  });

  if (seat) load();
  render();
  startSync();
  startNet();
})();
</script>
</body>
</html>
